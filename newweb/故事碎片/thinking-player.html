    <title>故事碎片 · 播放器</title>
    <style>
        /* ---------- 基础样式（与您原文件一致） ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* 全局基准字号：整页排版以 rem 为主，调这一行即可整体缩放 UI */
        html { font-size: 17.5px; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #0a0a0a;
            background-image: linear-gradient(180deg, #101010 0%, #0a0a0a 55%, #080808 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

        .rough-card {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            padding: 34px 30px 38px;
            background: #111111;
            background-image: linear-gradient(180deg, rgba(158,176,196,0.045) 0%, rgba(0,0,0,0) 46%);
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 8px 0 #1a1a1a, 0 16px 44px rgba(0,0,0,0.8), 0 0 26px rgba(188,196,204,0.04), inset 0 1px 0 rgba(255,255,255,0.035), inset 0 -40px 70px rgba(0,0,0,0.18);
            position: relative;
            /* 问询态切换时内边距（34/38 ↔ 26/28）也平滑收放，和对话区/舞台同步 */
            transition: padding .42s cubic-bezier(0.4,0,0.2,1);
        }
        .rough-card::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;

            pointer-events: none;

        }

            text-shadow: 0 0 6px rgba(200,180,150,0.1);
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
            margin-bottom: 4px;
        }
        .title span { margin-right: 8px; font-size: 1.8rem; }
        .sub-hint {
            text-align: center;
            color: #5a5a5a;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #222;
            margin-bottom: 16px;
        }
        .sub-hint .progress { color: #7a7a6a; }

        .stage {
            display: flex;
            gap: 20px;
            min-height: min(520px, 58vh);
            align-items: stretch;
            /* 问询态切换时舞台最小高度（40vh ↔ 58vh）平滑过渡，和对话区同步收放 */
            transition: min-height .42s cubic-bezier(0.4,0,0.2,1);
        }
        .role-column {
            flex: 0 0 178px;
            background: #0d0d0d;
            border: 2px solid #222;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;
            min-height: 200px;
        }
        .role-column.left-column { border-right: 3px solid #2a1f1a; }
        .role-column.right-column { border-left: 3px solid #1a222a; }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 200px;
        }
        .role-item {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(0px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.34,1.2,0.64,1),

        }
        .role-item .avatar-wrap {
            width: 108px;
            height: 108px;
            border: 3px solid #333;
            border-radius: 2px;
            overflow: hidden;
            background: #0a0a0a;
            transition: border-color 0.4s, box-shadow 0.4s, transform 0.4s,

                        height 0.42s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 0 12px rgba(0,0,0,0.6);

        }
        .role-item .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
        }
        .role-item .avatar-wrap .placeholder-avatar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            font-size: 1.5rem;
            background: #2a1a1a;
        }
        .role-item .role-name {
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: 4px;

            font-weight: 600;

        }
        .role-item.active .avatar-wrap {
            border-color: #8a7a6a;
            box-shadow: 0 0 28px rgba(120,100,80,0.3);
            transform: scale(1.10);

        }
        .role-item.active .role-name { color: #d0c0a8; }

        .dialogue-wrap {
            flex: 1;
            background: #0a0a0a;
            border: 2px solid #222;
            border-bottom: none;
            padding: 18px 22px;
            min-height: min(340px, 34vh);
            max-height: min(520px, 58vh);
            /* 问询态切换时对话区高度（40vh ↔ 58vh）平滑涨回，避免收起时"卡一下再跳变" */
            transition: max-height .42s cubic-bezier(0.4,0,0.2,1);
            overflow-y: auto;
            overflow-x: hidden;          /* 右侧气泡贴边时不再冒出横向滚动条 */
            scrollbar-gutter: stable;    /* 竖向滚动条出现/消失时不再挤压内容宽度 */
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            position: relative;

        /* 滚动条平时隐形（只靠 scrollbar-gutter 预留空隙，不挤压内容），悬停对话区才显出，

        .dialogue-wrap::-webkit-scrollbar { width: 6px; }

        .msg-item {

        .msg-item .msg-image .img-placeholder {

        }
        .msg-item .msg-image .img-placeholder .icon { margin-right: 8px; font-size: 1.2rem; opacity: 0.5; }

        .msg-item.from-left {
            align-self: flex-start;
            border-left-color: #b05a3a;
            --origin: left center;
            --rot: -3deg;
            animation-name: msgPopInLeft;
        }
        .msg-item.from-left .msg-speaker { text-align: left; }
        .msg-item.from-right {
            align-self: flex-end;

        .msg-item.from-right .msg-speaker { text-align: right; }

        @keyframes msgPopInLeft {
            0% { opacity:0; transform: translateX(-40px) scale(0.7) rotate(-3deg); }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px dashed #222;
            flex-wrap: wrap;
            /* 问询展开时整条收起：靠 max-height + opacity + 间距一起过渡。
               注意必须常驻 DOM 只改 max-height，不能用 display:none —— display 变化不参与过渡。 */
            max-height: 110px;   // 贴近实际高度即可；设太大动画前半段会看不到变化
            overflow: hidden;
            opacity: 1;
            transition: max-height .42s cubic-bezier(0.4,0,0.2,1),

        .controls-row.stowed {

        .controls-row button {

            transition: 0.15s;
            font-family: 'Courier New', monospace;

        .controls-row button:hover {
            background: #222;
            border-color: #666;

        }
        .controls-row button:active {

        }
        .controls-row .btn-continue { min-width: 100px; }
        .controls-row .btn-skip { border-color: #3a4a3a; color: #8aaa8a; }
        .controls-row .btn-skip:hover { border-color: #5a7a5a; color: #aacaaa; }
        .controls-row .btn-auto {
            border-color: #4a3a3a;

        }
        .controls-row .btn-auto:hover { border-color: #6a4a3a; color: #d0aa8a; }
        .controls-row .btn-auto.playing { border-color: #6a5a3a; color: #d0b08a; background: #1e1a14; }
        .controls-row .btn-auto.paused { border-color: #4a5a3a; color: #8aaa7a; background: #141a14; }
        .controls-row .btn-auto.completed { border-color: #3a4a3a; color: #5a7a5a; }
        .controls-row .btn-reset {

        }
        .controls-row .btn-reset:hover { border-color: #5a3a3a; color: #8a6a6a; }
        .controls-row .step-indicator {

        @media (max-width:720px) {

            .stage { flex-direction:column; gap:12px; min-height:auto; }
            .role-column {

            }

            .avatar-container {

                flex-wrap:wrap;

            .role-item .role-name { font-size:0.5rem; margin-top:2px; }
            .dialogue-wrap { max-height:320px; min-height:180px; padding:10px 12px; border-bottom:none; }
            .msg-item { max-width:92%; font-size:0.85rem; padding:8px 12px; }

        @media (max-width:460px) {

            .msg-item .msg-speaker { font-size:0.6rem; }
            .msg-item .msg-image img { max-height:120px; }
            .controls-row button { padding:6px 12px; font-size:0.7rem; }
            .controls-row .btn-continue { padding:6px 14px; }
            .controls-row .btn-auto { min-width:80px; }

        /* ================= CRT 复古滤镜 ================= */
        .crt { position: fixed; inset: 0; pointer-events: none; z-index: 999998; opacity: 0; transition: opacity .45s ease; overflow: hidden; }
        .crt.on { opacity: 1; }

        .crt-scanlines {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0.32) 3px,
                rgba(0,0,0,0.32) 4px
            );
            animation: crtJitter 7s linear infinite;
        }
        @keyframes crtJitter { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }

        .crt-aperture {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                to right,
                rgba(255,0,0,0.05) 0px,
                rgba(0,255,0,0.05) 1px,
                rgba(0,0,255,0.05) 2px,
                rgba(0,0,0,0) 3px
            );
        }

        .crt-vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 44%,
                rgba(0,0,0,0.28) 79%,
                rgba(0,0,0,0.74) 100%);
            box-shadow: inset 0 0 80px 26px rgba(0,0,0,0.55),
                        inset 0 0 14px 2px rgba(140,200,255,0.06);
        }

        .crt-flicker {
            position: absolute; inset: 0;
            background: rgba(170,200,255,0.05);
            mix-blend-mode: screen;
            animation: crtFlicker .9s steps(6) infinite;
        }
        @keyframes crtFlicker {
            0% { opacity: .02; } 20% { opacity: .07; } 40% { opacity: .03; }
            60% { opacity: .09; } 80% { opacity: .04; } 100% { opacity: .02; }
        }

        .crt-beam {
            position: absolute; left: 0; right: 0; height: 140px;
            background: linear-gradient(to bottom,
                rgba(200,225,255,0) 0%,
                rgba(200,225,255,0.035) 40%,
                rgba(210,235,255,0.075) 50%,
                rgba(200,225,255,0.035) 60%,
                rgba(200,225,255,0) 100%);
            animation: crtBeam 7s linear infinite;
        }
        @keyframes crtBeam { 0% { top: -160px; } 100% { top: 100%; } }

        .crt-noise {
            position: absolute; inset: 0;
            opacity: .035;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
            background-size: 140px 140px;
            animation: crtNoiseShift .35s steps(3) infinite;
        }
        @keyframes crtNoiseShift {
            0% { background-position: 0 0; }
            33% { background-position: -30px 20px; }
            66% { background-position: 25px -18px; }
            100% { background-position: 0 0; }
        }

        body.crt-on .rough-card,
        body.crt-on .msg-item,
        body.crt-on .role-item .role-name {
            text-shadow: 0.5px 0 rgba(255,70,70,.35), -0.5px 0 rgba(70,220,255,.35);
        }
        body.crt-on .rough-card {
            box-shadow: 0 8px 0 #1a1a1a, 0 16px 44px rgba(0,0,0,0.85), 0 0 28px rgba(188,196,204,0.055), inset 0 1px 0 rgba(255,255,255,0.035), inset 0 -40px 70px rgba(0,0,0,0.2);
        }
        body.crt-on .role-item .avatar-wrap img {
            filter: contrast(1.05) saturate(0.92);
        }

        /* ================= 通用悬浮按钮 ================= */
        /* ================= 通用悬浮按钮 =================
           注意：悬浮按钮（CRT 开关 / 返回主页）**自身不发光**——不要再给它们加 box-shadow 光晕或 text-shadow。
           它们正好压在 CRT 暗角里，以前靠多层光晕硬顶，现在改成「实色底 + 亮描边 + 亮文字 + 不透明」的
           纯对比度来保证看得见；发光一律交给 .crt 滤镜层统一处理。 */
        .crt-toggle, .back-btn {
            position: fixed; z-index: 999997;
            background: #2e2e2a; border: 2px solid #b0b0a2; color: #ffffff; font-weight: 700;
            padding: 10px 20px; font-family: 'Courier New', monospace;
            font-size: 0.92rem; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 3px 0 #101010, 0 6px 14px rgba(0,0,0,0.6);
            transition: background .15s, border-color .15s, color .15s;
            opacity: 1;
        }
        .crt-toggle:hover, .back-btn:hover { background: #3a3a36; border-color: #e0e0cd; color: #ffffff; }
        .crt-toggle:active, .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #101010; }
        /* CRT 开关：开关两态统一用绿色系（它控制的就是绿色磷光滤镜，视觉上更自洽）；
           开态（active）比关态更亮一号，用来体现状态差异。返回按钮保持中性/暖色，不受影响。 */
        .crt-toggle { border-color: #6f9670; color: #cdeacf; background: #20291f; }
        .crt-toggle:hover { background: #26322a; border-color: #9ac79d; color: #ffffff; }
        .crt-toggle.active, .crt-toggle.active:hover { border-color: #c8f0cb; color: #ffffff; background: #243528; }
        .crt-toggle.active:hover { border-color: #e6ffe8; color: #ffffff; background: #2d4234; }

        /* （老式电影放映模式已移除，恢复为纯 CRT 模式） */

        .crt-toggle { top: 14px; right: 14px; }
        .back-btn {
            top: 14px; left: 14px;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .back-btn:hover { border-color: #e8d9bd; color: #ffffff; background: #3a352c; }
        .back-btn.dragging {
            cursor: grabbing;
            opacity: .9;
            box-shadow: 0 3px 12px rgba(0,0,0,0.8);
            transition: none;
        }

        /* ================= 开场演出：标题卡 ================= */
        /* 注意：这里不能用 display:none → flex 来显隐。
           display 变化不参与过渡，浏览器会直接以最终状态渲染，opacity 的淡入淡出就永远跑不出来。
           所以元素常驻 DOM（fixed，不影响布局），靠 visibility + opacity 做显隐，visibility 的 0s 延迟
           保证"淡出播完才真正隐藏"。下面的时长与 JS 里的 TC_FADE_IN / TC_FADE_OUT 保持一致。 */
        .title-card {
            position: fixed; inset: 0; z-index: 999990;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, rgba(8,8,8,0.80) 0%, rgba(0,0,0,0.97) 72%);
            font-family: 'Courier New', monospace;
            cursor: pointer;
            opacity: 0; visibility: hidden; pointer-events: none;
            /* 淡出用这一条：opacity .6s，visibility 等淡出结束才切 hidden */
            transition: opacity .6s ease, visibility 0s linear .6s;
            user-select: none;
        }
        /* 淡入用这一条：opacity .45s，visibility 立刻可见 */
        .title-card.show {
            opacity: 1; visibility: visible; pointer-events: auto;
            transition: opacity .45s ease, visibility 0s linear 0s;
        }
        /* 大字背后那条模糊横杠 */
        .tc-bar {
            position: absolute; left: 50%; top: 50%;
            width: min(1200px, 94vw); height: 118px;
            transform: translate(-50%, -50%) scaleX(0);
            /* 背景辉光跟随大字颜色：--tc-bar-mid / --tc-bar-edge 由 JS 按 color 写入，
               未配置时回落默认米白（与默认的 --tc-color #ded6c4 同源） */
            background: linear-gradient(90deg,
                rgba(0,0,0,0) 0%, var(--tc-bar-edge, rgba(150,140,120,0.20)) 16%,
                var(--tc-bar-mid, rgba(214,204,184,0.34)) 50%, var(--tc-bar-edge, rgba(150,140,120,0.20)) 84%, rgba(0,0,0,0) 100%);
            filter: blur(24px);
            opacity: 0;
            transition: transform .75s cubic-bezier(0.16,0.84,0.3,1), opacity .45s ease;
        }
        .title-card.show .tc-bar { transform: translate(-50%, -50%) scaleX(1); opacity: 1; }
        /* 散场：横杠被撑开并淡掉 */
        .title-card.disperse .tc-bar { transform: translate(-50%, -50%) scaleX(1.35); opacity: 0; transition: .6s ease; }
        /* 爆开式：横杠也从中心 zoom 出来，跟着字一起"炸" */
        .title-card.burst .tc-bar {
            transform: translate(-50%, -50%) scale(0.12); opacity: 0;
            transition: transform .5s cubic-bezier(0.18,0.9,0.32,1), opacity .4s ease;
        }
        .title-card.burst.show .tc-bar { transform: translate(-50%, -50%) scaleX(1); opacity: 1; }
        .title-card.burst.disperse .tc-bar { transform: translate(-50%, -50%) scaleX(1.35) scaleY(0.35); opacity: 0; transition: .6s ease; }

        .tc-stage { position: relative; text-align: center; padding: 0 4vw; }
        /* --tc-color / --tc-glow 由 JS 按配置写入（未配置时用下面的默认米白） */
        .tc-text {
            font-size: clamp(2.2rem, 8.4vw, 6.4rem);
            font-weight: 700; letter-spacing: 0.06em; line-height: 1.12;
            color: var(--tc-color, #ded6c4); white-space: nowrap;
            text-shadow: 0 0 34px var(--tc-glow, rgba(0,0,0,0.9)), 0 6px 0 rgba(0,0,0,0.55);
        }
        /* 每个字符单独一层：--fx 是它待命时所在的屏幕外方向，--d/--d2 是合拢/分散的错峰延迟 */
        .tc-char {
            display: inline-block; opacity: 0;
            transform: translateX(var(--fx, 0px)) scale(1.08);
            transition: transform .62s cubic-bezier(0.16,0.84,0.3,1), opacity .42s ease;
        }
        .title-card.assemble .tc-char { opacity: 1; transform: translateX(0) scale(1); transition-delay: var(--d, 0ms); }
        .title-card.disperse .tc-char { opacity: 0; transform: translateX(var(--fx, 0px)) scale(1.08); transition-delay: var(--d2, 0ms); transition-duration: .5s; }

        /* 爆开式（回答成功等）：每个字先缩在中心、带扇形角度，再从中心炸开回到横排原位。
           --bx / --by 是 JS 测出的"该字最终位置相对文本中心的偏移"，待命态乘以 -1 把字拉回正中心，
           --ang 是它待命时的旋转角（按离中心远近张开成扇形）。 */
        /* burst：从正中心像开花一样旋转绽开，再排成横排 */
        .title-card.burst .tc-char {
            opacity: 0;
            /* 待命态：所有字缩在正中心拧成"花苞"，按离中心远近带上扇形旋转角 */
            transform: translate(calc(var(--bx, 0px) * -1), var(--by, 0px)) rotate(var(--ang, 0deg)) scale(0.06);
            transform-origin: center center;
            transition: transform .78s cubic-bezier(0.22, 1.32, 0.34, 1), opacity .42s ease;
        }
        .title-card.burst.assemble .tc-char {
            opacity: 1;
            /* 绽开：旋转归正 + 放大归位，弹簧曲线带一点过冲，像花瓣"啪"地张开 */
            transform: translate(0, 0) rotate(0deg) scale(1);
            transition-delay: var(--d, 0ms);
        }
        .title-card.burst.disperse .tc-char {
            opacity: 0;
            /* 散场：像花合拢一样轻轻往回收、反向拧一点再淡出 */
            transform: translate(calc(var(--bx, 0px) * -0.5), calc(var(--by, 0px) * 0.5)) rotate(calc(var(--ang, 0deg) * -0.6)) scale(0.55);
            transition-delay: var(--d2, 0ms);
            transition-duration: .52s;
        }

            margin-top: 20px; color: #8a8272;
            font-size: clamp(0.7rem, 1.6vw, 1rem); letter-spacing: 0.36em;

        }
        .title-card.assemble .tc-sub { opacity: 0.9; transform: translateY(0); transition-delay: .55s; }
        .title-card.disperse .tc-sub { opacity: 0; transition: opacity .35s ease; transition-delay: 0s; }

        .tc-hint {
            position: absolute; bottom: 7vh; left: 0; right: 0; text-align: center;

            opacity: 0; transition: opacity .5s ease;
        }
        .title-card.assemble .tc-hint { opacity: 0.7; transition-delay: 1.1s; }
        .title-card.disperse .tc-hint { opacity: 0; transition: opacity .3s; transition-delay: 0s; }

        /* 演出期间锁住故事界面：卡片整体不吃鼠标事件（键盘由 JS 守卫挡） */

        body.crt-on .tc-text {

        }

            /* 黑幕淡入淡出也压短；visibility 的 delay 保留，不影响 JS 的收尾定时器（它只会更晚） */
            .title-card, .title-card.show { transition-duration: .12s !important; }
            /* 问询面板展开 / 底部控制条收放也压短；JS 的兜底定时器按正常节奏走，只会更晚、不会卡住 */
            .ask-panel, .controls-row { transition-duration: .12s !important; }

        /* 拼错的那一轮：留在对话里当线索，但视觉上作废，让玩家看清"这条路没成立"。

        .msg-item.branch-dead {

            filter: grayscale(0.55);

            border-right-style: dashed !important;

            border-right-color: #4a3a3a !important;

        .msg-item.branch-dead .msg-speaker::after { content: ' ·未成立'; color: #8a6464; font-size: 0.9em; }
