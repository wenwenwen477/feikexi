        };

        // ================================================================
        //  🔄 改写名字加载（与 index 共享 localStorage 键名）
        // ================================================================
        function loadCustomNames() {
            const saved = localStorage.getItem('custom_character_names');
            if (saved) {
                try {
                    const names = JSON.parse(saved);
                    const defaultOrder = ['旁观者', '识人鱼', '根系管家', '说谎者', '影中人', '贵妇人','Maku','Aki','辣妹','乌鸦'];
                    for (const storyId in STORY_DATA) {
                        const chars = STORY_DATA[storyId].characters;
                        for (const key in chars) {
                            const idx = defaultOrder.indexOf(key);
                            if (idx !== -1 && names[idx] && names[idx].trim()) {
                                chars[key].name = names[idx].trim();
                            }
                        }
                    }
                } catch (e) { console.warn('读取改写名字失败:', e); }
            }
        }
        loadCustomNames();

        function getDisplayName(char) {
            return `[${char.id}]${char.name}`;
        }

        // 跨窗口请求父页面（index）切换场景 BGM：
        //   postMessage(window.opener) 为主，localStorage 的 storage 事件兜底（file:// 下更稳）。
        //   fade=true 走淡入淡出；快进时传 false 做即时切换。父页面会顺带把曲子加入音乐收藏。
        function switchSceneBgm(name, file, fade) {
            if (!name) return;
            const cmd = { __spg: true, type: 'bgm-switch', name: name, file: file || null, fade: !!fade };
            try {
                if (window.opener && typeof window.opener.postMessage === 'function') {
                    window.opener.postMessage(cmd, '*');
                }
            } catch (e) { /* 跨源或 opener 不可用，交给 storage 兜底 */ }
            try { localStorage.setItem('spg_bgm_cmd', JSON.stringify(Object.assign({ _t: Date.now() }, cmd))); } catch (e) {}
        }

        // ================================================================
        //  🚀 播放器核心
        // ================================================================
        const leftContainer = document.getElementById('leftContainer');
        const rightContainer = document.getElementById('rightContainer');
        const dialogueWrap = document.getElementById('dialogueWrap');
        const dialogueEmpty = document.getElementById('dialogueEmpty');
        const btnContinue = document.getElementById('btnContinue');
        const btnSkipAll = document.getElementById('btnSkipAll');
        const btnAutoPlay = document.getElementById('btnAutoPlay');
        const btnReset = document.getElementById('btnReset');
        const stepIndicator = document.getElementById('stepIndicator');
        const totalDisplay = document.getElementById('totalDisplay');
        const totalCount = document.getElementById('totalCount');
        const progressHint = document.getElementById('progressHint');
        const storyTitle = document.getElementById('storyTitle');

        let currentIndex = 0;
        let isAnimating = false;
        let currentSpeaker = null;
        let autoPlayTimer = null;
        let autoPlayState = 'idle'; // idle | playing | paused | completed
        const AUTO_INTERVAL = 1100;
        let fastForwarding = false;   // 快进 / 直接全显时，关闭平滑滚动以保证跟随
        let pendingAskId = null;      // 本句演完后要展开的问询 id
        let instantReveal = false;    // 直接全显时，文段不带弹入动画

        // ---------- 获取当前故事数据 ----------
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('id') || 'THINK-1';
        const story = STORY_DATA[storyId];
        if (!story) {
            document.body.innerHTML = `<div style="color:#b8b0a0;padding:40px;text-align:center;">❌ 未找到档案：${storyId}</div>`;
            throw new Error('故事不存在');
        }

        storyTitle.textContent = story.title;
        const DIALOGUE_DATA = story.dialogue;
        const CHARACTERS = story.characters;

        const involvedKeys = [];
        const seen = new Set();
        for (const item of DIALOGUE_DATA) {
            if (!seen.has(item.speaker)) {
                seen.add(item.speaker);
                involvedKeys.push(item.speaker);
            }
        }
        // 问询分支里出现的人物也要登记，否则头像不会被预创建
        // fallback 可能是单个对象也可能是数组（递进线索），这里两种都要收
        for (const ak of Object.values(story.asks || {})) {
            const fbList = Array.isArray(ak.fallback) ? ak.fallback : (ak.fallback ? [ak.fallback] : []);
            const allLines = [].concat(
                ...((ak.branches || []).map(b => b.lines || [])),
                ...(fbList.map(f => f.lines || []))
            );
            for (const item of allLines) {
                if (item && item.speaker && !seen.has(item.speaker)) {
                    seen.add(item.speaker);
                    involvedKeys.push(item.speaker);
                }
            }
        }
        for (const key of involvedKeys) {
            if (!CHARACTERS[key]) {
                CHARACTERS[key] = {
                    id: 99,
                    name: key,
                    defaultAvatar: `${key}/${key}.png`,
                    color: '#888',
                    side: 'left',
                    order: 0
                };
            }
        }
        if (involvedKeys.length === 0) {
            for (const k in CHARACTERS) involvedKeys.push(k);
        }

        const roleState = {};
        const currentPortraits = {};
        for (const key of involvedKeys) {
            roleState[key] = {
                side: CHARACTERS[key].side || 'left',
                order: CHARACTERS[key].order || 0
            };
            currentPortraits[key] = CHARACTERS[key].defaultAvatar;
        }

        totalDisplay.textContent = DIALOGUE_DATA.length;
        totalCount.textContent = DIALOGUE_DATA.length;

        // ---------- 创建角色 DOM ----------
        const roleElements = {};
        const containerMap = { 'left': leftContainer, 'right': rightContainer };

        function createRoleElement(key) {
            const char = CHARACTERS[key];
            const item = document.createElement('div');
            item.className = 'role-item';
            item.dataset.role = key;

            const avatarWrap = document.createElement('div');
            avatarWrap.className = 'avatar-wrap';
            const img = document.createElement('img');
            img.src = getImagePath(currentPortraits[key] || char.defaultAvatar);
            img.alt = char.name;
            img.onerror = function() {
                this.style.display = 'none';
                let placeholder = this.parentElement.querySelector('.placeholder-avatar');
                if (!placeholder) {
                    placeholder = document.createElement('span');
                    placeholder.className = 'placeholder-avatar';
                    placeholder.textContent = '?';
                    this.parentElement.appendChild(placeholder);
                }
            };
            avatarWrap.appendChild(img);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'role-name';
            nameSpan.textContent = getDisplayName(char);

            item.appendChild(avatarWrap);
            item.appendChild(nameSpan);
            return item;
        }

        for (const key of involvedKeys) {
            const el = createRoleElement(key);
            const side = roleState[key].side;
            (containerMap[side] || leftContainer).appendChild(el);
            roleElements[key] = el;
        }

        // ---------- 渲染角色（居中） ----------
        function renderRoles(speakerKey) {
            const leftKeys = involvedKeys.filter(k => roleState[k].side === 'left');
            const rightKeys = involvedKeys.filter(k => roleState[k].side === 'right');
            leftKeys.sort((a,b) => roleState[a].order - roleState[b].order);
            rightKeys.sort((a,b) => roleState[a].order - roleState[b].order);
            layoutContainer(leftContainer, leftKeys, speakerKey);
            layoutContainer(rightContainer, rightKeys, speakerKey);

            for (const key of involvedKeys) {
                const el = roleElements[key];
                const isActive = (key === speakerKey);
                el.classList.toggle('active', isActive);
                const char = CHARACTERS[key];
                const avatarWrap = el.querySelector('.avatar-wrap');
                const nameSpan = el.querySelector('.role-name');
                nameSpan.textContent = getDisplayName(char);
                if (isActive) {
                    avatarWrap.style.borderColor = char.color;
                    avatarWrap.style.boxShadow = `0 0 30px ${char.color}44`;
                    nameSpan.style.color = char.color;
                } else {
                    avatarWrap.style.borderColor = '#333';
                    avatarWrap.style.boxShadow = '0 0 12px rgba(0,0,0,0.6)';
                    nameSpan.style.color = '#6a6a5a';
                }
            }
            currentSpeaker = speakerKey;
        }

        function layoutContainer(container, keys, speakerKey) {
            if (keys.length === 0) return;
            let containerHeight = container.clientHeight || 400;
            // 行高按实际测量值算（头像尺寸若被样式改过也能自适应），量不到时才回落到 138
            const probe = roleElements[keys[0]];
            const itemHeight = (probe && probe.offsetHeight) ? probe.offsetHeight : (108 + 22 + 8);
            const activeIndex = keys.indexOf(speakerKey);
            // 平时以"正在说话的人"居中；问询态改成整列成组居中，
            // 这样舞台被压矮时头像也不会被裁掉（成组只需 N 倍行高的空间）
            const groupCenter = appCard.classList.contains('asking');
            const centerIndex = groupCenter ? (keys.length - 1) / 2 : ((activeIndex !== -1) ? activeIndex : 0);
            const centerOffset = (containerHeight - itemHeight) / 2;
            for (let i=0; i<keys.length; i++) {
                const key = keys[i];
                const el = roleElements[key];
                const targetParent = container;
                if (el.parentNode !== targetParent) targetParent.appendChild(el);
                const offsetY = centerOffset + (i - centerIndex) * itemHeight;
                el.style.transform = `translateX(-50%) translateY(${offsetY}px)`;
            }
        }

        // ---------- 滚动到底部（快进时强制瞬时，避免平滑滚动追不上） ----------
        function scrollToBottom(forceInstant) {
            if (forceInstant) {
                const prev = dialogueWrap.style.scrollBehavior;
                dialogueWrap.style.scrollBehavior = 'auto';
                dialogueWrap.scrollTop = dialogueWrap.scrollHeight;
                dialogueWrap.style.scrollBehavior = prev;
            } else {
                dialogueWrap.scrollTop = dialogueWrap.scrollHeight;
            }
        }

        // ---------- 处理单条对话 ----------
        function processDialogueItem(item) {
            const { speaker, text, portrait, setSide, setOrder, image } = item;
            if (setSide !== undefined) roleState[speaker].side = setSide;
            if (setOrder !== undefined) roleState[speaker].order = setOrder;
            if (portrait) currentPortraits[speaker] = portrait;
            else currentPortraits[speaker] = CHARACTERS[speaker].defaultAvatar;
            const el = roleElements[speaker];
            const img = el.querySelector('img');
            if (img) {
                const placeholder = el.querySelector('.placeholder-avatar');
                if (placeholder) placeholder.remove();
                img.style.display = '';
                img.src = getImagePath(currentPortraits[speaker]);
            }
            renderRoles(speaker);

            const char = CHARACTERS[speaker];
            const side = roleState[speaker].side || 'left';
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg-item from-${side}`;
            if (instantReveal) msgDiv.classList.add('no-anim');
            msgDiv.style.borderLeftColor = side === 'left' ? char.color : '#2a2a2a';
            msgDiv.style.borderRightColor = side === 'right' ? char.color : '#2a2a2a';

            const nameSpan = document.createElement('div');
            nameSpan.className = 'msg-speaker';
            nameSpan.textContent = getDisplayName(char);
            nameSpan.style.color = char.color;

            const textSpan = document.createElement('div');
            textSpan.className = 'msg-text';
            textSpan.textContent = text;

            msgDiv.appendChild(nameSpan);
            msgDiv.appendChild(textSpan);

            if (image) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'msg-image';
                // 容器先挂进消息但保持隐藏：加载期间不会在气泡下方留空的深色矩形
                // 注意：不能用 loading="lazy"，脱离文档的图片永远不会触发加载，会彻底不显示
                imgContainer.style.display = 'none';
                const imgEl = document.createElement('img');
                imgEl.alt = '配图';
                imgEl.onload = function() {
                    imgContainer.style.display = '';
                    if (fastForwarding) scrollToBottom(true);
                    else scrollToBottom(false);
                };
                imgEl.onerror = function() {
                    imgEl.style.display = 'none';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'img-placeholder';
                    placeholder.innerHTML = `<span class="icon">🖼️</span> 图片加载失败：${image}`;
                    imgContainer.appendChild(placeholder);
                    imgContainer.style.display = '';
                };
                imgContainer.appendChild(imgEl);
                msgDiv.appendChild(imgContainer);
                imgEl.src = getMessageImagePath(image);
            }

            if (dialogueEmpty && dialogueEmpty.parentNode === dialogueWrap) {
                dialogueWrap.removeChild(dialogueEmpty);
            }
            dialogueWrap.appendChild(msgDiv);
            scrollToBottom(fastForwarding);
            return msgDiv;   // 返回节点：分支演出时要给失败的台词打"未成立"标记
        }

        // ---------- 推进 ----------
        function advanceDialogue() {
            if (isAnimating) return;
            if (askOpen || branchPlaying) return;   // 问询面板开着 / 分支正在演出时，主线暂停
            if (currentIndex >= DIALOGUE_DATA.length) return;
            isAnimating = true;
            try {
                const item = DIALOGUE_DATA[currentIndex];
                processDialogueItem(item);
                currentIndex++;
                stepIndicator.innerHTML = `<em>${currentIndex}</em> / <span>${DIALOGUE_DATA.length}</span>`;
                // 这一句自带问询：主线先停在这里，把判断权交给玩家
                if (item.ask && ASKS[item.ask]) pendingAskId = item.ask;
                if (item.bgm) switchSceneBgm(item.bgm, item.bgmFile, true);
                if (currentIndex >= DIALOGUE_DATA.length) {
                    markReviewed(storyId);
                    btnContinue.disabled = true;
                    btnContinue.textContent = '✓ 已读完';
                    btnSkipAll.disabled = true;
                    btnSkipAll.textContent = '✓ 已回顾';
                    progressHint.textContent = '📖 故事碎片已完整呈现。';
                    if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                        stopAutoPlay();
                        updateAutoPlayUI('completed');
                    }
                } else if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                    // 自动播放中：按钮禁用态与提示语一律交给 updateAutoPlayUI 统一管，
                    // 这里再写一次会把它改成"点击继续"，跟"⏸ 自动中"自相矛盾
                    updateAutoPlayUI(autoPlayState);
                } else {
                    btnContinue.disabled = false;
                    btnContinue.textContent = '▶ 继续';
                    progressHint.textContent = `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                }
                if (pendingAskId) {
                    const id = pendingAskId; pendingAskId = null;
                    btnContinue.disabled = true;
                    btnSkipAll.disabled = true;
                    setTimeout(() => openAsk(id), 650);
                }
            } catch (e) { console.error(e); }
            finally { setTimeout(() => { isAnimating = false; }, 400); }
        }

        // ---------- 自动播放 ----------
        function updateAutoPlayUI(state) {
            autoPlayState = state;
            btnAutoPlay.classList.remove('playing','paused','completed');
            switch (state) {
                case 'idle': btnAutoPlay.textContent = '▶ 自动播放'; btnAutoPlay.disabled = false; break;
                case 'playing': btnAutoPlay.textContent = '⏸ 暂停'; btnAutoPlay.disabled = false; btnAutoPlay.classList.add('playing'); break;
                case 'paused': btnAutoPlay.textContent = '▶ 继续播放'; btnAutoPlay.disabled = false; btnAutoPlay.classList.add('paused'); break;
                case 'completed': btnAutoPlay.textContent = '✓ 已播放'; btnAutoPlay.disabled = true; btnAutoPlay.classList.add('completed'); break;
            }
            // 自动播放"正在跑"(playing) 才禁用手动按钮；一旦暂停(paused)，控制已交还玩家，
            // 左侧"继续"即作为切回手动模式的入口（点击 = 停掉自动、走一句手动），"回顾全部"同理可点。
            const atEnd = (currentIndex >= DIALOGUE_DATA.length);
            btnContinue.disabled = (state === 'playing') || atEnd;
            btnSkipAll.disabled  = (state === 'playing') || atEnd;
            if (state === 'playing') {
                btnContinue.textContent = '⏸ 自动中';
                btnSkipAll.textContent  = '⏸ 自动中';
            } else if (state === 'paused') {
                btnContinue.textContent = '▶ 继续';
                btnSkipAll.textContent  = '⏩ 回顾全部';
            } else if (atEnd) {
                btnContinue.textContent = '✓ 已读完';
                btnSkipAll.textContent  = '✓ 已回顾';
            } else {
                btnContinue.textContent = '▶ 继续';
                btnSkipAll.textContent  = '⏩ 回顾全部';
            }
            if (state === 'playing') progressHint.textContent = `▶ 自动播放中 · ${currentIndex}/${DIALOGUE_DATA.length}`;
            else if (state === 'paused') progressHint.textContent = `⏸ 已暂停 · ${currentIndex}/${DIALOGUE_DATA.length}`;
            else if (state === 'completed') progressHint.textContent = '📖 故事碎片已完整呈现。';
            else progressHint.textContent = currentIndex >= DIALOGUE_DATA.length ? '📖 故事碎片已完整呈现。' : `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
        }

        function startAutoPlay() {
            if (autoPlayTimer) return;
            if (currentIndex >= DIALOGUE_DATA.length) { updateAutoPlayUI('completed'); return; }
            updateAutoPlayUI('playing');
            setTimeout(autoPlayNext, 100);
        }

        function autoPlayNext() {
            if (autoPlayState !== 'playing') return;
            if (currentIndex >= DIALOGUE_DATA.length) { stopAutoPlay(); updateAutoPlayUI('completed'); return; }
            advanceDialogue();
            if (currentIndex >= DIALOGUE_DATA.length) { stopAutoPlay(); updateAutoPlayUI('completed'); return; }
            autoPlayTimer = setTimeout(autoPlayNext, AUTO_INTERVAL);
        }

        function pauseAutoPlay() {
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            if (autoPlayState === 'playing') updateAutoPlayUI('paused');
        }

        function resumeAutoPlay() {
            if (autoPlayState === 'paused' && currentIndex < DIALOGUE_DATA.length) {
                updateAutoPlayUI('playing');
                setTimeout(autoPlayNext, 200);
            } else if (currentIndex >= DIALOGUE_DATA.length) updateAutoPlayUI('completed');
        }

        function stopAutoPlay() {
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
        }

        function toggleAutoPlay() {
            if (autoPlayState === 'idle') startAutoPlay();
            else if (autoPlayState === 'playing') pauseAutoPlay();
            else if (autoPlayState === 'paused') resumeAutoPlay();
        }

        // ---------- 回顾全部 ----------
        async function skipAllDialogue() {
            if (askOpen || branchPlaying) return;   // 问询进行中不让快进跳过

            if (isAnimating) return;
            if (currentIndex >= DIALOGUE_DATA.length) return;
            if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                stopAutoPlay();
                updateAutoPlayUI('idle');
            }
            isAnimating = true;
            fastForwarding = true;
            btnContinue.disabled = true;
            btnSkipAll.disabled = true;
            btnAutoPlay.disabled = true;
            btnReset.disabled = true;
            btnSkipAll.textContent = '⏳ 回顾中…';
            let stoppedAtAsk = false;
            try {
                while (currentIndex < DIALOGUE_DATA.length) {
                    const item = DIALOGUE_DATA[currentIndex];
                    processDialogueItem(item);
                    currentIndex++;
                    stepIndicator.innerHTML = `<em>${currentIndex}</em> / <span>${DIALOGUE_DATA.length}</span>`;
                    progressHint.textContent = `⏩ 回顾中 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                    await new Promise(r => setTimeout(r, 60));
                    if (item.bgm) switchSceneBgm(item.bgm, item.bgmFile, false);
                    // 遇到问询：在这里停下，把判断权交给玩家（而不是一股脑跳到结尾）
                    if (item.ask && ASKS[item.ask]) {
                        pendingAskId = item.ask;
                        stoppedAtAsk = true;
                        break;
                    }
                }
                if (!stoppedAtAsk) {
                    // 没有再遇到提问 → 整段回顾完成
                    scrollToBottom(true);
                    fastForwarding = false;
                    btnContinue.disabled = true;
                    btnContinue.textContent = '✓ 已读完';
                    btnSkipAll.disabled = true;
                    btnSkipAll.textContent = '✓ 已回顾';
                    btnAutoPlay.disabled = true;
                    btnAutoPlay.textContent = '✓ 已播放';
                    btnAutoPlay.classList.add('completed');
                    btnReset.disabled = false;
                    progressHint.textContent = '📖 故事碎片已完整呈现。';
                    markReviewed(storyId);
                    updateAutoPlayUI('completed');
                }
            } catch (e) { console.error(e); }
            finally {
                isAnimating = false;
                fastForwarding = false;
                if (stoppedAtAsk) {
                    // 停在提问处：保留按钮禁用态，交给 openAsk 接手
                    btnContinue.disabled = true;
                    btnSkipAll.disabled = true;
                    btnAutoPlay.disabled = false;
                    btnReset.disabled = false;
                    const id = pendingAskId; pendingAskId = null;
                    if (id) setTimeout(() => openAsk(id), 650);
                } else if (currentIndex < DIALOGUE_DATA.length) {
                    // 中途停下（理论不会发生，除非被打断）：恢复正常手动态
                    btnSkipAll.disabled = false;
                    btnAutoPlay.disabled = false;
                    btnReset.disabled = false;
                    btnContinue.disabled = false;
                    btnContinue.textContent = '▶ 继续';
                    btnSkipAll.textContent = '⏩ 回顾全部';
                    updateAutoPlayUI('idle');
                }
                // currentIndex >= length 时：完成态由 try 块已设置，这里不再改动按钮
            }
        }

        // ---------- 重置 ----------
        function resetDialogue() {
            if (isAnimating) return;
            forceCloseAsk();
            pendingAskId = null;
            // 重来一次时，之前"拼错几次"的账也清零，线索从头给起
            for (const k of Object.keys(askRetries)) delete askRetries[k];
            unmarkReviewed(storyId);
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            for (const key of involvedKeys) {
                roleState[key].side = CHARACTERS[key].side || 'left';
                roleState[key].order = CHARACTERS[key].order || 0;
                currentPortraits[key] = CHARACTERS[key].defaultAvatar;
                const el = roleElements[key];
                const img = el.querySelector('img');
                if (img) {
                    const placeholder = el.querySelector('.placeholder-avatar');
                    if (placeholder) placeholder.remove();
                    img.style.display = '';
                    img.src = getImagePath(currentPortraits[key]);
                }
            }
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            dialogueWrap.appendChild(dialogueEmpty);
            currentIndex = 0;
            btnContinue.disabled = false;
            btnContinue.textContent = '▶ 继续';
            btnSkipAll.disabled = false;
            btnSkipAll.textContent = '⏩ 回顾全部';
            btnReset.disabled = false;
            stepIndicator.innerHTML = `<em>0</em> / <span>${DIALOGUE_DATA.length}</span>`;
            progressHint.textContent = `点击下方按钮推进对话 · 共 ${DIALOGUE_DATA.length} 句`;
            updateAutoPlayUI('idle');
            const firstSpeaker = DIALOGUE_DATA[0]?.speaker || involvedKeys[0];
            renderRoles(firstSpeaker);
            dialogueWrap.scrollTop = 0;
        }

        // ---------- 已读标记（播放完一次后，下次跳转直接展示全部） ----------
        const REVIEWED_KEY = 'spg_story_reviewed_v1';
        function getReviewedSet() {
            try { return new Set(JSON.parse(localStorage.getItem(REVIEWED_KEY) || '[]')); }
            catch (e) { return new Set(); }
        }
        function isReviewed(id) { return getReviewedSet().has(id); }
        // 清除某段故事的已读标记（用于「⟲ 重来」，与主界面「清空记录」语义一致）
        function unmarkReviewed(id) {
            try {
                const s = getReviewedSet(); s.delete(id);
                localStorage.setItem(REVIEWED_KEY, JSON.stringify(Array.from(s)));
            } catch (e) {}
        }
        function markReviewed(id) {
            try {
                const s = getReviewedSet(); s.add(id);
                localStorage.setItem(REVIEWED_KEY, JSON.stringify(Array.from(s)));
            } catch (e) {}
        }

        // 直接把全部文段铺出来（无弹入动画、瞬时滚到底），用于「已读过的档案再次打开」
        function showAllInstant() {
            fastForwarding = true;
            instantReveal = true;
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            for (const item of DIALOGUE_DATA) {
                processDialogueItem(item);
                // 已读档案的「完整记录」：把每个问询「回答正确以后」的分支演出也补上，
                // 否则从主页返回再打开时这几段对话会消失。只补非彩蛋(=真正回答正确、推进了主线)的已见分支。
                if (item.ask && ASKS[item.ask]) {
                    const cfg = ASKS[item.ask];
                    const seen = getSeenList(item.ask);
                    const hit = (cfg.branches || []).find(b => !b.egg && b.tag && seen.includes(b.tag));
                    if (hit && Array.isArray(hit.lines)) {
                        for (const ln of hit.lines) processDialogueItem(ln);
                    }
                }
            }
            currentIndex = DIALOGUE_DATA.length;
            stepIndicator.innerHTML = `<em>${DIALOGUE_DATA.length}</em> / <span>${DIALOGUE_DATA.length}</span>`;
            instantReveal = false;
            fastForwarding = false;
            markReviewed(storyId);
            btnContinue.disabled = true; btnContinue.textContent = '✓ 已读完';
            btnSkipAll.disabled = true; btnSkipAll.textContent = '✓ 已回顾';
            btnAutoPlay.disabled = true; btnAutoPlay.textContent = '✓ 已播放'; btnAutoPlay.classList.add('completed');
            progressHint.textContent = '📖 故事碎片已完整呈现。';
            scrollToBottom(true);
        }

        // =================================================================
        //  开场演出：标题卡
        //  按档案 id 配置，没配的档案照常直接进页面。
        //  节奏：压暗 → 模糊横杠展开 → 字从两边往中间合 → 停留 → 向两边分散（分散一开始即解锁）
        // =================================================================
        // 用法：'档案id': { text: '大字', sub: '下方小字（可省略）', color: '大字颜色（可省略，默认米白）' }
        // color 支持 #rrggbb / #rgb / rgb() / 颜色名，写什么色背后的辉光就跟着变成什么色
        // 开场大字（页面刚打开时播）；问询开始时另有一张「审问开始」大字，写在每条 asks 配置里，两者不冲突
        const TITLE_CARDS = {
            // 问询页开场：按档案 id 配置，未配置的档案直接进页面（照 story-player 的写法，加一行即可）
            // 每条可加 se:'文件名' 自定义开场音效（默认 CNstart；se:null 关闭）；填文件名会自动拼 bgm/se/ 目录
            'D1H17M40-GA-1-2': { text: '审问：好奇的事', sub: 'D1H17M40 · 关于那个男人' },
			//'D2026921-H12M35': { text: '审问：关于更新', sub: 'D2026921-H12M35 · 关于更新',color:'#A52A2A' },
        };
        const TC_DEFAULT_COLOR = '#ded6c4';   // 没写 color 时的默认色（米白）
        const TC_GLOW_ALPHA = 0.34;           // 辉光透明度（辉光色 = 大字颜色 + 这个透明度）

        const titleCardEl = document.getElementById('titleCard');
        const tcTextEl = document.getElementById('tcText');
        const tcSubEl = document.getElementById('tcSub');
        const appCard = document.getElementById('app');
        const controlsRow = document.getElementById('controlsRow');
        const CONTROLS_MAX_H = 110;   // 与控制条的 CSS max-height 保持一致（收放动画要用它换算）

        const TC_STEP = 34;        // 逐字错峰间隔
        const TC_CHAR_MS = 620;    // 单个字符飞到位的时间（与 CSS transition 对齐）
        const TC_ENTER_AT = 260;   // 覆盖层淡入多久后开始合拢
        const TC_HOLD = 780;       // 合拢后停留多久再散场
        // 黑幕淡入 / 淡出：这两个数必须与 CSS 里 .title-card 的 opacity 过渡时长一致
        const TC_FADE_IN = 450;        // .title-card.show 的 opacity .45s
        const TC_FADE_OUT = 600;       // .title-card 的 opacity .6s
        const TC_FADE_OUT_AT = 140;    // 散场开始后多久才开始淡出黑幕（让字先裂开一点）

        // 把配置的 color 拆成 "r,g,b"，用来生成同色辉光；解析不了就返回 null（走默认黑辉光）
        function tcColorToRgb(str) {
            let s = (str || '').trim();
            if (!s) return null;
            if (/^#[0-9a-f]{3}$/i.test(s)) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
            let m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(s);
            if (m) return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)].join(',');
            m = /^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i.exec(s);
            if (m) return [+m[1], +m[2], +m[3]].map(Math.round).join(',');
            // 颜色名之类：借一个临时节点让浏览器帮我们解析成 rgb()
            const probe = document.createElement('span');
            probe.style.display = 'none';
            probe.style.color = s;
            document.body.appendChild(probe);
            const computed = getComputedStyle(probe).color;
            probe.remove();
            m = /^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i.exec(computed || '');
            return m ? [+m[1], +m[2], +m[3]].map(Math.round).join(',') : null;
        }

        let titleCardPlaying = false;
        let titleCardOnEnd = null;   // 演出结束（散场淡出后）要接着做的事，比如"回答成功"后接分支对话
        let tcTimers = [];

        function tcAfter(ms, fn) { tcTimers.push(setTimeout(fn, ms)); }
        function clearTitleCardTimers() { tcTimers.forEach(clearTimeout); tcTimers = []; }

        // 解锁：散场动画一开始就放开操作，玩家不用干等
        function unlockTitleCard() {
            if (!titleCardPlaying) return;
            titleCardPlaying = false;
            appCard.classList.remove('tc-locked');
        }

        function finishTitleCard() {
            if (!titleCardEl.classList.contains('show')) return;
            clearTitleCardTimers();
            unlockTitleCard();
            titleCardEl.classList.remove('assemble');
            titleCardEl.classList.add('disperse');
            // 覆盖层交还点击，避免挡住刚解锁的按钮（.show 摘掉后 CSS 本就是 none，这里再显式兜一次）
            titleCardEl.style.pointerEvents = 'none';

            // 黑幕淡出：等字先裂开一点再撤，视觉上是"字散开、黑幕跟着散掉"
            tcAfter(TC_FADE_OUT_AT, () => {
                titleCardEl.classList.remove('show');   // 触发 opacity 1 → 0（visibility 会在淡出结束后自动转 hidden）
            });
            // 淡出走完才摘 disperse：中途摘掉会让字和横杠的样式跳回"待命态"，虽然看不见但没必要
            tcAfter(TC_FADE_OUT_AT + TC_FADE_OUT + 80, () => {
                titleCardEl.classList.remove('disperse');
                titleCardEl.style.pointerEvents = '';
                // 演出彻底结束，接着做该做的事（如"回答成功"后接分支对话）；只触发一次
                const cb = titleCardOnEnd;
                titleCardOnEnd = null;
                if (typeof cb === 'function') cb();
            });
        }

        // —— 开场大字音效 ——
        // 默认播 CNstart；cfg.se 可自定义（填音效文件名，自动拼 bgm/se/ 目录；含斜杠则视为完整相对路径）；
        // 显式 se:null 则不播。thinking 位于 newweb/故事碎片/，SE_DIR 相对当前页解析。
        const SE_DIR = new URL('../../bgm/se/', location.href).href;
        const SE_DEFAULT_TITLE = 'CNstart';   // 档案/标题开场默认音效
        const SE_DEFAULT_ASK = 'UIstart';      // 审问开场默认音效
        const SE_DEFAULT_BURST = 'Correct';    // 回答成功（爆开）大字默认音效
        let _seUnlocked = false;
        const _sePending = [];
        function _seFire(src) {
            try {
                const a = new Audio(src);
                a.volume = 0.85;
                const p = a.play();
                if (p && p.catch) p.catch(() => {});
            } catch (e) { /* 文件缺失或策略拦截，忽略 */ }
        }
        function _seUnlock() {
            if (_seUnlocked) return;
            _seUnlocked = true;
            while (_sePending.length) _seFire(_sePending.shift());
        }
        ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
            window.addEventListener(ev, _seUnlock, { once: true, passive: true }));
        function playTitleSe(se, fallback) {
            if (se === null || se === false) return;                 // 显式关闭
            const name = (typeof se === 'string' && se.trim()) ? se.trim() : (fallback || SE_DEFAULT_TITLE);
            const src = name.includes('/')
                ? new URL(name, location.href).href
                : SE_DIR + name + (name.toLowerCase().endsWith('.mp3') ? '' : '.mp3');
            if (_seUnlocked) { _seFire(src); return; }
            // 先试着播（若此刻已有用户手势则成功）；被自动播放策略拦截则等首次手势补播
            try {
                const a = new Audio(src);
                a.volume = 0.85;
                const p = a.play();
                if (p && p.catch) p.catch(() => { _sePending.push(src); });
            } catch (e) { _sePending.push(src); }
        }

        function playTitleCard(cfg, mode, onEnd, defaultSe) {
            const raw = (cfg.text || '').trim();
            if (!raw) return;
            const burst = mode === 'burst';          // 爆开式：从中心炸开（回答成功等）；否则两侧飞入（默认）
            titleCardOnEnd = (typeof onEnd === 'function') ? onEnd : null;

            // 开场音效：标题卡类（非 burst）默认播该场景音效（档案开场 CNstart / 审问开场 UIstart，由 defaultSe 决定）；
            // burst（回答成功等）默认播 Correct，显式配 se 可换、se:null 可强制关闭。
            if (burst) { playTitleSe(cfg.se, SE_DEFAULT_BURST); }
            else { playTitleSe(cfg.se, defaultSe || SE_DEFAULT_TITLE); }

            tcTextEl.innerHTML = '';
            tcSubEl.textContent = cfg.sub || '';
            tcSubEl.style.display = cfg.sub ? '' : 'none';

            // 大字颜色：未配置就回落默认米白；辉光用同色低透明度，暗背景下会有淡淡的同色光晕
            const color = (cfg.color || TC_DEFAULT_COLOR).trim();
            const rgb = tcColorToRgb(color);
            tcTextEl.style.setProperty('--tc-color', color);
            tcTextEl.style.setProperty('--tc-glow', rgb ? `rgba(${rgb},${TC_GLOW_ALPHA})` : 'rgba(0,0,0,0.9)');
            // 背景横杠辉光也跟随大字颜色：中间实、两侧虚，未解析出颜色则用默认米白
            if (rgb) {
                titleCardEl.style.setProperty('--tc-bar-mid', `rgba(${rgb},0.34)`);
                titleCardEl.style.setProperty('--tc-bar-edge', `rgba(${rgb},0.18)`);
            } else {
                titleCardEl.style.setProperty('--tc-bar-mid', 'rgba(214,204,184,0.34)');
                titleCardEl.style.setProperty('--tc-bar-edge', 'rgba(150,140,120,0.20)');
            }

            // 拆成左右两半：左半从屏幕左侧飞入，右半从右侧飞入，往中间合
            const chars = Array.from(raw);
            const half = Math.ceil(chars.length / 2);
            chars.forEach((ch, i) => {
                const span = document.createElement('span');
                span.className = 'tc-char';
                span.textContent = ch === ' ' ? '\u00A0' : ch;   // 空格也要占位，不然会被压掉
                const fromLeft = i < half;
                span.style.setProperty('--fx', fromLeft ? '-72vw' : '72vw');
                // 合拢：外侧的字符先出发，内侧最后补上 → 视觉上是两股字流涌向中间
                const dIn = fromLeft ? i * TC_STEP : (chars.length - 1 - i) * TC_STEP;
                // 散场：反过来，靠中间的字符先裂开，向两边飞散
                const dOut = fromLeft ? (half - 1 - i) * TC_STEP : (i - half) * TC_STEP;
                span.style.setProperty('--d', dIn + 'ms');
                span.style.setProperty('--d2', dOut + 'ms');
                tcTextEl.appendChild(span);
            });

            let maxIn;
            if (burst) {
                // 爆开式：先量出每个字"最终位置相对整行中心的偏移"，待命态把它拉回正中心并带上扇形角度；
                // 合拢时由内向外波及。文本此刻已布局（标题卡 visibility:hidden 仍占位），测量可靠。
                const textRect = tcTextEl.getBoundingClientRect();
                const cx = textRect.left + textRect.width / 2;
                const cy = textRect.top + textRect.height / 2;
                const n = chars.length;
                const center = (n - 1) / 2;
                const BURST_STEP = 26;
                Array.from(tcTextEl.children).forEach((span, i) => {
                    const r = span.getBoundingClientRect();
                    const bx = (r.left + r.width / 2) - cx;
                    const by = (r.top + r.height / 2) - cy;
                    const ang = (i - center) * 26;   // 离中心越远张角越大，花苞拧得越开，绽开时旋转归位更明显
                    span.style.setProperty('--bx', bx + 'px');
                    span.style.setProperty('--by', by + 'px');
                    span.style.setProperty('--ang', ang + 'deg');
                    const d = Math.abs(i - center) * BURST_STEP;   // 由中心向外波及，像花瓣从蕊心依次张开
                    span.style.setProperty('--d', d + 'ms');
                    span.style.setProperty('--d2', d + 'ms');
                });
                maxIn = center * BURST_STEP;
            } else {
                maxIn = Math.max(half - 1, chars.length - 1 - half) * TC_STEP;
            }

            const assembleEnd = TC_ENTER_AT + maxIn + TC_CHAR_MS;   // 全部合拢完成

            titleCardPlaying = true;
            appCard.classList.add('tc-locked');
            clearTitleCardTimers();   // 万一上一场演出的淡出定时器还在跑，先清掉，别让它把新演出收走
            titleCardEl.style.pointerEvents = '';
            titleCardEl.classList.remove('disperse', 'assemble', 'burst');
            if (burst) titleCardEl.classList.add('burst');
            titleCardEl.classList.add('show');   // 触发黑幕淡入（opacity 0 → 1）

            tcAfter(TC_ENTER_AT, () => titleCardEl.classList.add('assemble'));
            tcAfter(assembleEnd + TC_HOLD, finishTitleCard);
        }

        // 点击 / 空格：跳过演出（只结束演出本身，不会推进对话）
        titleCardEl.addEventListener('click', finishTitleCard);

        // ---------- 初始化 ----------
        // =================================================================
        //  🕵️  问询系统：拼词组
        //  在 dialogue[] 某句上写 ask:'ASK-x' → 该句演完后展开面板；
        //  玩家把词拖进空槽 → 「就这样问」 → 命中分支 → 演出该分支对话 → 回到主线。
        // =================================================================
        const askPanel    = document.getElementById('askPanel');
        const askSentence = document.getElementById('askSentence');
        const askWordsEl  = document.getElementById('askWords');
        const askSeenEl   = document.getElementById('askSeen');
        const askConfirm  = document.getElementById('askConfirm');
        const askClear    = document.getElementById('askClear');
        const askRefresh  = document.getElementById('askRefresh');

        const ASKS = story.asks || {};
        const SEEN_KEY = 'spg_thinking_seen_v1';   // 记录见过的分支（spg_ 前缀约定）

        function getSeenMap() {
            try { return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); } catch (e) { return {}; }
        }
        function getSeenList(askId) { const m = getSeenMap(); return Array.isArray(m[askId]) ? m[askId] : []; }
        function markBranchSeen(askId, tag) {
            if (!tag) return;
            try {
                const m = getSeenMap();
                const list = Array.isArray(m[askId]) ? m[askId] : [];
                if (!list.includes(tag)) list.push(tag);
                m[askId] = list;
                localStorage.setItem(SEEN_KEY, JSON.stringify(m));
            } catch (e) {}
        }

        let askOpen = false;          // 面板是否展开
        let branchPlaying = false;    // 分支对话正在演出
        let currentAskId = null;
        let currentAsk = null;
        let slotEls = [];             // 槽 DOM
        let slotValues = [];          // 每槽：{ text, idx } 或 null
        let usedIdx = new Set();      // 已被放进槽里的词下标
        let heldIdx = null;           // 点击通道：手上拿着的词
        let dragPayload = null;       // 拖拽通道：{ idx } 或 { fromSlot } 或 null
        let branchTimer = null;
        let askReopenTimer = null;    // 拼错后延迟重开面板的定时器（重置时要清掉，否则会诈尸）
        let askMaxTimer = null;       // 展开动画跑完后解除 max-height 上限
        const askRetries = {};        // 每个问询失败过几次（用来取递进的线索）
        let autoResumeAfterAsk = false;   // 进问询前是否开着自动播放（答完自动接回）

        // fallback 不是"分支结局"，而是"这句话没问动他"：
        // 演完线索台词后会回到同一问重新提问，主线绝不往前走。
        // 写法两种：单个对象（每次都同一段）／数组（按失败次数递进，最后一段循环用）
        function getFallbackSteps(cfg) {
            const fb = cfg.fallback;
            if (!fb) return [];
            return Array.isArray(fb) ? fb : [fb];
        }

        // 失败重问不计入"已见分支"，否则玩家会因为拼错而白拿进度
        function askTotalBranches(cfg) {
            return (cfg.branches || []).length;
        }

        // ---------- 渲染：提示句 + 空槽 ----------
        function buildAskSentence(cfg) {
            askSentence.innerHTML = '';
            slotEls = [];
            slotValues = [];
            const tokens = String(cfg.prompt || '').split(/(\{\d*\})/);
            for (const tk of tokens) {
                if (!tk) continue;
                if (/^\{\d*\}$/.test(tk)) {
                    const slot = document.createElement('span');
                    slot.className = 'ask-slot empty';
                    slot.dataset.slot = String(slotEls.length);
                    wireSlot(slot, slotEls.length);
                    askSentence.appendChild(slot);
                    slotEls.push(slot);
                    slotValues.push(null);
                } else {
                    askSentence.appendChild(document.createTextNode(tk));
                }
            }
        }

        // ---------- 渲染：词池（已被占用的词不再显示，语义是"移动"而不是"复制"） ----------
        function renderAskWords() {
            askWordsEl.innerHTML = '';
            const words = currentAsk.words || [];
            words.forEach((w, idx) => {
                if (usedIdx.has(idx)) return;
                const chip = document.createElement('span');
                chip.className = 'ask-word';
                chip.textContent = w;
                chip.dataset.idx = String(idx);
                chip.draggable = true;
                if (heldIdx === idx) chip.classList.add('picked');
                chip.addEventListener('click', () => {
                    heldIdx = (heldIdx === idx) ? null : idx;
                    renderAskWords();
                    refreshSlotHints();
                });
                chip.addEventListener('dragstart', (e) => {
                    dragPayload = { idx: idx };
                    chip.classList.add('dragging');
                    heldIdx = null;
                    try { e.dataTransfer.setData('text/plain', w); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
                });
                chip.addEventListener('dragend', () => { chip.classList.remove('dragging'); dragPayload = null; });
                askWordsEl.appendChild(chip);
            });
        }

        function refreshSlotHints() {
            slotEls.forEach(el => el.classList.toggle('pickable', heldIdx !== null && !el.classList.contains('filled')));
        }

        // ---------- 装填 / 退回 ----------
        function fillSlot(slotPos, wordIdx) {
            if (slotValues[slotPos]) releaseSlot(slotPos);          // 槽里已有词 → 先退回
            for (let i = 0; i < slotValues.length; i++) {           // 同一个词不能占两个槽
                if (i !== slotPos && slotValues[i] && slotValues[i].idx === wordIdx) releaseSlot(i);
            }
            slotValues[slotPos] = { text: currentAsk.words[wordIdx], idx: wordIdx };
            usedIdx.add(wordIdx);
            paintSlot(slotPos);
            renderAskWords();
            refreshSlotHints();
        }
        function releaseSlot(slotPos) {
            const v = slotValues[slotPos];
            if (!v) return;
            usedIdx.delete(v.idx);
            slotValues[slotPos] = null;
            paintSlot(slotPos);
        }
        function paintSlot(slotPos) {
            const el = slotEls[slotPos];
            const v = slotValues[slotPos];
            if (v) {
                el.textContent = v.text;
                el.classList.remove('empty');
                el.classList.add('filled');
                el.draggable = true;      // 填好之后才能再拖出去换槽 / 拖回词池
            } else {
                el.textContent = '';
                el.classList.add('empty');
                el.classList.remove('filled');
                el.draggable = false;
            }
        }
        function clearAllSlots() {
            for (let i = 0; i < slotValues.length; i++) releaseSlot(i);
            heldIdx = null;
            renderAskWords();
            refreshSlotHints();
        }

        // ---------- 槽的事件（拖放 + 点击两条通道） ----------
        function wireSlot(el, slotPos) {
            el.addEventListener('click', () => {
                if (slotValues[slotPos]) { releaseSlot(slotPos); renderAskWords(); refreshSlotHints(); return; }
                if (heldIdx !== null) { fillSlot(slotPos, heldIdx); heldIdx = null; renderAskWords(); refreshSlotHints(); }
            });
            el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('hover'); });
            el.addEventListener('dragleave', () => el.classList.remove('hover'));
            el.addEventListener('drop', (e) => {
                e.preventDefault(); el.classList.remove('hover');
                if (!dragPayload) return;
                if (dragPayload.fromSlot !== undefined) {
                    const from = dragPayload.fromSlot;
                    if (from === slotPos) return;
                    const a = slotValues[from], b = slotValues[slotPos];
                    slotValues[from] = b; slotValues[slotPos] = a;
                    paintSlot(from); paintSlot(slotPos);
                } else {
                    fillSlot(slotPos, dragPayload.idx);
                }
                dragPayload = null;
            });
            // 已填好的槽里那个词也能再拖走（换槽 / 拖回词池）
            el.addEventListener('dragstart', (e) => {
                if (!slotValues[slotPos]) { e.preventDefault(); return; }
                dragPayload = { fromSlot: slotPos };
                try { e.dataTransfer.setData('text/plain', slotValues[slotPos].text); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
            });
            el.addEventListener('dragend', () => { dragPayload = null; });
        }

        // 词池也收 drop：把槽里的词拖回来 = 退回
        askWordsEl.addEventListener('dragover', (e) => e.preventDefault());
        askWordsEl.addEventListener('drop', (e) => {
            e.preventDefault();
            if (dragPayload && dragPayload.fromSlot !== undefined) {
                releaseSlot(dragPayload.fromSlot);
                renderAskWords();
                refreshSlotHints();
            }
            dragPayload = null;
        });

        // ---------- 打开 / 关闭 ----------
        // 底部控制条收起 / 放回来：问询期间整条藏起来，让玩家只面对这一问
        let controlsStowTimer = null;
        function setControlsStowed(on) {
            if (controlsStowTimer) { clearTimeout(controlsStowTimer); controlsStowTimer = null; }
            controlsRow.classList.toggle('stowed', on);
        }

        // reopen = true 表示这是"拼错之后的重问"：不再甩开场大字，只把面板重新展开
        function openAsk(askId, reopen) {
            const cfg = ASKS[askId];
            if (!cfg || askOpen) return;
            currentAskId = askId;
            currentAsk = cfg;
            usedIdx = new Set();
            heldIdx = null;

            buildAskSentence(cfg);
            renderAskWords();
            refreshSlotHints();

            const seenN = getSeenList(askId).length;
            const tries = askRetries[askId] || 0;
            askSeenEl.textContent = `已见分支 ${seenN} / ${askTotalBranches(cfg)}`
                + (tries > 0 ? `　·　第 ${tries + 1} 次提问` : '');

            // 展开：先把 max-height 钉成具体数值（none 无法参与过渡），强制 reflow 记下起点，
            // 再交给 CSS 的目标值 520px，过渡才跑得起来。动画结束后解成 none，长内容不会被裁。
            askPanel.style.maxHeight = '0px';
            void askPanel.offsetWidth;
            askPanel.classList.add('open');
            askPanel.style.maxHeight = '';
            if (askMaxTimer) { clearTimeout(askMaxTimer); askMaxTimer = null; }
            askMaxTimer = setTimeout(() => {
                askMaxTimer = null;
                if (askPanel.classList.contains('open')) askPanel.style.maxHeight = 'none';
            }, 520);
            askOpen = true;
            setControlsStowed(true);
            relayoutForAsk(true);
            // 如果玩家进问询前开着自动播放，先记下来，答完自动接回去，不用他再点一次
            // 注意这一段必须放在下面禁用按钮之前：updateAutoPlayUI 会重算按钮的禁用态
            if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                autoResumeAfterAsk = true;
                stopAutoPlay();
                updateAutoPlayUI('idle');
            }
            btnContinue.disabled = true;
            btnSkipAll.disabled = true;
            // 自动播放状态下被 stow 了，提示语自己写，不要被 UI 更新覆盖
            progressHint.textContent = tries > 0
                ? '🕵️ 推理有问题。可以试着换种拼法。'
                : '🕵️ 把词拖进空处，做出你的推理。';

            // 开场大字：标题 / 小字 / 颜色全都来自配置，改配置就能换。重问时不重复播。
            if (!reopen) playTitleCard({ text: cfg.title || '审问开始', sub: cfg.sub || '', color: cfg.color || '', se: cfg.se }, undefined, undefined, SE_DEFAULT_ASK);
        }

        function closeAsk() {
            // 收起：先把当前真实高度钉成具体数值（此时内联可能是 none），reflow 后再清掉内联、
            // 让 CSS 的 max-height:0 成为终点，过渡才跑得起来。
            if (askMaxTimer) { clearTimeout(askMaxTimer); askMaxTimer = null; }
            askPanel.style.maxHeight = askPanel.scrollHeight + 'px';
            void askPanel.offsetWidth;
            askPanel.classList.remove('open');
            askPanel.style.maxHeight = '';
            askOpen = false;
            currentAsk = null;
            heldIdx = null;
            // 立即退出问询态：对话区/舞台高度用 CSS 过渡平滑涨回（见 .dialogue-wrap / .stage 的
            // transition），面板同时收起，二者同步收放，卡片高度不会瞬间超过提问态，窗口滚动条不闪、也不跳变。
            relayoutForAsk(false);
        }

        // 问询态切换后舞台高度变了 → 重新居中头像、并把对话滚到底
        function relayoutForAsk(on) {
            appCard.classList.toggle('asking', on);
            requestAnimationFrame(() => {
                if (currentSpeaker) renderRoles(currentSpeaker);
                scrollToBottom(true);
            });
        }

        function forceCloseAsk() {
            if (branchTimer) { clearTimeout(branchTimer); branchTimer = null; }
            if (askReopenTimer) { clearTimeout(askReopenTimer); askReopenTimer = null; }   // 否则重置后面板会诈尸
            if (askMaxTimer) { clearTimeout(askMaxTimer); askMaxTimer = null; }
            branchPlaying = false;
            autoResumeAfterAsk = false;
            setControlsStowed(false);
            closeAsk();
        }

        // ---------- 判定 + 分支演出 ----------
        function matchBranch(match, seq) {
            if (!Array.isArray(match) || match.length !== seq.length) return false;
            for (let i = 0; i < match.length; i++) {
                const m = match[i];
                if (m === null || m === undefined || m === '*') continue;
                if (m !== seq[i]) return false;
            }
            return true;
        }

        // dead = true 表示这段对话是"没成立的拼句"，视觉上作废，让玩家看清这条路走不通
        function playBranchLines(lines, onDone, dead) {
            if (!lines || lines.length === 0) { onDone(); return; }
            branchPlaying = true;
            btnContinue.disabled = true;
            btnSkipAll.disabled = true;
            let i = 0;
            const step = () => {
                if (i >= lines.length) {
                    branchPlaying = false;
                    btnSkipAll.disabled = false;
                    onDone();
                    return;
                }
                const el = processDialogueItem(lines[i]);
                if (dead && el) el.classList.add('branch-dead');
                i++;
                branchTimer = setTimeout(step, 950);
            };
            step();
        }

        function confirmAsk() {
            if (!askOpen || branchPlaying) return;
            const seq = slotValues.map(v => v ? v.text : null);
            if (seq.some(v => v === null)) {
                askPanel.classList.remove('shake');
                void askPanel.offsetWidth;          // 强制重排，让动画能重播
                askPanel.classList.add('shake');
                progressHint.textContent = '⚠️ 还有空着的槽。';
                return;
            }
            const cfg = currentAsk;
            // 先看有没有命中真实分支；命中才算过关
            const hit = (cfg.branches || []).find(b => matchBranch(b.match, seq));

            const afterDone = () => {
                setControlsStowed(false);
                if (currentIndex >= DIALOGUE_DATA.length) {
                    stopAutoPlay();
                    updateAutoPlayUI('completed');
                    autoResumeAfterAsk = false;
                    return;
                }
                // 进来时开着自动播放 → 直接接回去，不用玩家再点；否则切成手动一条一条
                if (autoResumeAfterAsk) {
                    autoResumeAfterAsk = false;
                    controlsStowTimer = setTimeout(() => {
                        controlsStowTimer = null;
                        updateAutoPlayUI('playing');
                        setTimeout(autoPlayNext, 200);
                    }, 320);   // 等控制条放回来再跑起来
                    return;
                }
                stopAutoPlay();
                updateAutoPlayUI('idle');
                btnContinue.disabled = false;
                btnContinue.textContent = '▶ 继续';
                progressHint.textContent = `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
            };

            if (hit) {
                const tag = (hit && hit.tag) || '支线';
                markBranchSeen(currentAskId, tag);
                closeAsk();
                if (hit.egg) {
                    // 彩蛋：演出也算"没回答正确"，演完回到上一问重新提问，主线一步都不往前走
                    const askId = currentAskId;
                    progressHint.textContent = `🥚 彩蛋：${tag}　——　演出中……`;
                    playBranchLines(hit.lines, () => {
                        btnSkipAll.disabled = true;
                        askReopenTimer = setTimeout(() => { askReopenTimer = null; openAsk(askId, true); }, 900);
                    });
                    return;
                }
                progressHint.textContent = `🕵️ 分支：${tag}　——　演出中……`;
                // 回答正确：先放一张"从中心爆开"的庆祝大字，演完再接分支对话。
                // 文字/副标/颜色都可自定义：在 asks 配置里给该问加 success:{ text, sub, color } 即可。
                const sc = (cfg.success && typeof cfg.success === 'object') ? cfg.success : {};
                playTitleCard({
                    text: sc.text || '推理成立',
                    sub: sc.sub || '',
                    color: sc.color || '#8fbf7a',
                    se: sc.se
                }, 'burst', () => {
                    playBranchLines(hit.lines, afterDone);
                });
                return;
            }

            // ---- 没拼对：不算过关。演出对手的反应（当线索），然后回到这一问重新提问 ----
            const askId = currentAskId;
            askRetries[askId] = (askRetries[askId] || 0) + 1;
            const steps = getFallbackSteps(cfg);
            const step = steps.length
                ? steps[Math.min(askRetries[askId], steps.length) - 1]   // 错得越多，线索给得越明
                : null;
            closeAsk();
            progressHint.textContent = '🕵️ 推理有问题。可以试着换种拼法。';
            playBranchLines(step && step.lines, () => {
                // 主线一步都不推进，直接重开同一问，让玩家自己推断出该问的那句话
                btnSkipAll.disabled = true;
                askReopenTimer = setTimeout(() => { askReopenTimer = null; openAsk(askId, true); }, 900);
            }, true);
        }

        askConfirm.addEventListener('click', (e) => { e.stopPropagation(); confirmAsk(); });
        askClear.addEventListener('click', (e) => { e.stopPropagation(); clearAllSlots(); });
        askRefresh.addEventListener('click', (e) => { e.stopPropagation(); location.reload(); });

        function init() {
            loadCustomNames();
            const firstSpeaker = DIALOGUE_DATA[0]?.speaker || involvedKeys[0];
            renderRoles(firstSpeaker);
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            dialogueWrap.appendChild(dialogueEmpty);
            stepIndicator.innerHTML = `<em>0</em> / <span>${DIALOGUE_DATA.length}</span>`;
            progressHint.textContent = `点击下方按钮推进对话 · 共 ${DIALOGUE_DATA.length} 句`;

            btnContinue.addEventListener('click', function() {
                if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                    stopAutoPlay();
                    updateAutoPlayUI('idle');
                    if (currentIndex < DIALOGUE_DATA.length) {
                        btnContinue.disabled = false;
                        btnContinue.textContent = '▶ 继续';
                        btnSkipAll.disabled = false;
                        btnSkipAll.textContent = '⏩ 回顾全部';
                        progressHint.textContent = `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                    }
                }
                advanceDialogue();
            });
            btnSkipAll.addEventListener('click', skipAllDialogue);
            btnAutoPlay.addEventListener('click', toggleAutoPlay);
            btnReset.addEventListener('click', resetDialogue);

            document.addEventListener('keydown', (e) => {
                // 演出期间：空格 / 回车只用来跳过演出，不推进对话
                if (titleCardPlaying) {
                    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); finishTitleCard(); }
                    return;
                }
                if (e.key === ' ' || e.key === 'Enter') {
                    if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        if (autoPlayState === 'playing') { pauseAutoPlay(); return; }
                        else if (autoPlayState === 'paused') { resumeAutoPlay(); return; }
                        if (!btnContinue.disabled) advanceDialogue();
                    }
                }
            });

            document.querySelector('.rough-card').addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                if (autoPlayState === 'playing' || autoPlayState === 'paused') return;
                if (!btnContinue.disabled) advanceDialogue();
            });

            console.log(`📜 播放器加载档案: ${storyId}，共 ${DIALOGUE_DATA.length} 句`);
            console.log('📁 角色图片路径: ' + IMAGE_BASE);
            console.log('🖼️ 消息图片路径: ' + MESSAGE_IMAGE_BASE);

            // 已完整播放过的档案，再次打开时直接展示全部文段
            if (isReviewed(storyId)) showAllInstant();

            // 开场演出（只有配置了 TITLE_CARDS 的档案才会播）
            const tcCfg = TITLE_CARDS[storyId];
            if (tcCfg) playTitleCard(tcCfg);
        }

        // ---------- 窗口 resize 重定位角色 ----------
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (currentSpeaker) renderRoles(currentSpeaker); }, 200);
        });

        document.addEventListener('DOMContentLoaded', init);

        // =================================================================
        //  🆕 CRT 滤镜开关（与其他页面共享同一 localStorage 键）
        // =================================================================
        const CRT_KEY = 'crt_filter_enabled';
        const crtEl = document.getElementById('crtFilter');
        const crtToggle = document.getElementById('crtToggle');

        function setCRT(enabled) {
            crtEl.classList.toggle('on', enabled);
            document.body.classList.toggle('crt-on', enabled);
            crtToggle.textContent = enabled ? 'CRT ON' : 'CRT OFF';
            crtToggle.classList.toggle('active', enabled);
            try { localStorage.setItem(CRT_KEY, enabled ? '1' : '0'); } catch (e) {}
        }

        crtToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setCRT(!crtEl.classList.contains('on'));
        });

        // 默认开启，除非用户手动关过
        setCRT(localStorage.getItem(CRT_KEY) !== '0');
        console.log('📺 CRT 滤镜已就绪。右上角按钮可切换。');

        // =================================================================
        //  🆕 返回主页按钮（可拖动，位置记忆，双击复位）
        // =================================================================
        const HOME_URL = '../../index.html';        // ← 若路径不同请修改
        const BACK_POS_KEY = 'back_btn_pos_v1';     // 与其他页面共享的位置存储键
        const BACK_DEFAULT = { x: 14, y: 14 };      // 默认位置：距左、距上（px）

        const backBtn = document.getElementById('backBtn');

        function applyBackPos(x, y) {
            backBtn.style.left = x + 'px';
            backBtn.style.top = y + 'px';
            backBtn.style.right = 'auto';
            backBtn.style.bottom = 'auto';
        }

        // 从 localStorage 恢复位置
        (function restoreBackPos() {
            let pos = null;
            try {
                const raw = localStorage.getItem(BACK_POS_KEY);
                if (raw) pos = JSON.parse(raw);
            } catch (e) {}
            if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') {
                const maxX = window.innerWidth - 100;
                const maxY = window.innerHeight - 40;
                applyBackPos(Math.max(0, Math.min(maxX, pos.x)), Math.max(0, Math.min(maxY, pos.y)));
            } else {
                applyBackPos(BACK_DEFAULT.x, BACK_DEFAULT.y);
            }
        })();

        // ---------- 拖动逻辑 ----------
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let startX = 0, startY = 0;
        let hasMoved = false;

        function beginDrag(clientX, clientY) {
            const rect = backBtn.getBoundingClientRect();
            dragOffsetX = clientX - rect.left;
            dragOffsetY = clientY - rect.top;
            startX = clientX;
            startY = clientY;
            hasMoved = false;
            isDragging = true;
            backBtn.classList.add('dragging');
        }

        function moveDrag(clientX, clientY) {
            if (!isDragging) return;
            const dx = clientX - startX;
            const dy = clientY - startY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
            let newLeft = clientX - dragOffsetX;
            let newTop = clientY - dragOffsetY;
            const maxX = window.innerWidth - backBtn.offsetWidth;
            const maxY = window.innerHeight - backBtn.offsetHeight;
            newLeft = Math.max(0, Math.min(maxX, newLeft));
            newTop = Math.max(0, Math.min(maxY, newTop));
            applyBackPos(newLeft, newTop);
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            backBtn.classList.remove('dragging');
            if (hasMoved) {
                const rect = backBtn.getBoundingClientRect();
                try {
                    localStorage.setItem(BACK_POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
                } catch (e) {}
            }
        }

        // 鼠标事件
        backBtn.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            e.preventDefault();
            beginDrag(e.clientX, e.clientY);
        });
        document.addEventListener('mousemove', (e) => { if (isDragging) moveDrag(e.clientX, e.clientY); });
        document.addEventListener('mouseup', () => { if (isDragging) endDrag(); });

        // 触屏事件
        backBtn.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            beginDrag(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const t = e.touches[0];
                moveDrag(t.clientX, t.clientY);
            }
        }, { passive: true });
        document.addEventListener('touchend', () => { if (isDragging) endDrag(); });

        // ---------- 点击返回（拖动过则不触发）----------
        function goHome() {
            // 暂停所有进行中的操作，释放资源
            try {
                if (typeof stopAutoPlay === 'function') stopAutoPlay();
                if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            } catch (err) { /* 忽略 */ }

            // 尝试关闭当前标签页（若是被 window.open 打开，则能成功）
            try { window.close(); } catch (err) { /* 忽略 */ }

            // 若关闭失败，则延迟跳转回主页
            // （如果 close 成功，下面的代码不会执行）
            setTimeout(() => {
                window.location.replace(HOME_URL);
            }, 200);
        }

        backBtn.addEventListener('click', (e) => {
            if (hasMoved) {
                e.preventDefault();
                e.stopPropagation();
                hasMoved = false;
                return;
            }
            e.stopPropagation();
            goHome();
        });

        // ---------- 双击复位到默认位置 ----------
        backBtn.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            try { localStorage.removeItem(BACK_POS_KEY); } catch (err) {}
            applyBackPos(BACK_DEFAULT.x, BACK_DEFAULT.y);
        });

        // ---------- Esc 也能返回 ----------
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' &&
                document.activeElement?.tagName !== 'INPUT' &&
                document.activeElement?.tagName !== 'TEXTAREA') {
                e.preventDefault();
                goHome();
            }
        });

        // ---------- 窗口变化时确保按钮不越界 ----------
        window.addEventListener('resize', () => {
            const rect = backBtn.getBoundingClientRect();
            const maxX = window.innerWidth - backBtn.offsetWidth;
            const maxY = window.innerHeight - backBtn.offsetHeight;
            const newX = Math.max(0, Math.min(maxX, rect.left));
            const newY = Math.max(0, Math.min(maxY, rect.top));
            if (newX !== rect.left || newY !== rect.top) applyBackPos(newX, newY);
        });

        console.log('🏠 返回按钮已就绪：拖动移动，双击复位，位置自动保存。');
    </script>
</body>
