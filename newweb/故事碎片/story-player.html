<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事碎片 · 播放器</title>
    <style>
        /* ---------- 基础样式（与您原文件一致） ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
        }
        .rough-card {
            max-width: 960px;
            width: 100%;
            padding: 28px 24px 32px;
            background: #111;
            border: 2px solid #2a2a2a;
            box-shadow: 0 8px 0 #1a1a1a, 0 12px 40px rgba(0,0,0,0.8);
            position: relative;
        }
        .rough-card::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px dashed #2a2a2a;
            pointer-events: none;
            opacity: 0.3;
        }
        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #c0b8a8;
            text-shadow: 0 0 6px rgba(200,180,150,0.1);
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
            margin-bottom: 4px;
        }
        .title span { margin-right: 6px; font-size: 1.6rem; }
        .sub-hint {
            text-align: center;
            color: #5a5a5a;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #222;
            margin-bottom: 16px;
        }
        .sub-hint .progress { color: #7a7a6a; }

        .stage {
            display: flex;
            gap: 16px;
            min-height: 460px;
            align-items: stretch;
        }
        .role-column {
            flex: 0 0 150px;
            background: #0d0d0d;
            border: 2px solid #222;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }
        .role-column.left-column { border-right: 3px solid #2a1f1a; }
        .role-column.right-column { border-left: 3px solid #1a222a; }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 200px;
        }
        .role-item {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(0px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.34,1.2,0.64,1),
                        opacity 0.4s ease;
            will-change: transform;
            padding: 4px 0;
            width: auto;
        }
        .role-item .avatar-wrap {
            width: 92px;
            height: 92px;
            border: 3px solid #333;
            border-radius: 2px;
            overflow: hidden;
            background: #0a0a0a;
            transition: border-color 0.4s, box-shadow 0.4s, transform 0.4s,
                        opacity 0.4s, filter 0.4s;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
            flex-shrink: 0;
            position: relative;
            opacity: 0.5;
            filter: grayscale(0.6);
        }
        .role-item .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
        }
        .role-item .avatar-wrap .placeholder-avatar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            font-size: 1.5rem;
            background: #2a1a1a;
        }
        .role-item .role-name {
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-top: 4px;
            color: #6a6a5a;
            transition: color 0.4s;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }
        .role-item.active .avatar-wrap {
            border-color: #8a7a6a;
            box-shadow: 0 0 28px rgba(120,100,80,0.3);
            transform: scale(1.10);
            opacity: 1;
            filter: grayscale(0);
        }
        .role-item.active .role-name { color: #d0c0a8; }

        .dialogue-wrap {
            flex: 1;
            background: #0a0a0a;
            border: 2px solid #222;
            border-bottom: none;
            padding: 14px 16px;
            min-height: 380px;
            max-height: 480px;
            overflow-y: auto;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            position: relative;
        }
        .dialogue-wrap::-webkit-scrollbar { width: 4px; }
        .dialogue-wrap::-webkit-scrollbar-track { background: #0a0a0a; }
        .dialogue-wrap::-webkit-scrollbar-thumb { background: #333; }
        .dialogue-empty {
            color: #3a3a3a;
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
            margin: auto;
            letter-spacing: 1px;
        }

        .msg-item {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            padding: 10px 16px;
            border: 2px solid #2a2a2a;
            background: #111;
            box-shadow: 0 2px 0 #1a1a1a;
            opacity: 0;
            transform: scale(0.7) rotate(var(--rot,0deg));
            transform-origin: var(--origin, center);
            animation: msgPopIn 0.45s cubic-bezier(0.22,0.9,0.36,1.1) forwards;
            word-break: break-word;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #b8b0a0;
            border-left-width: 4px;
            border-right-width: 4px;
        }
        .msg-item .msg-speaker {
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: 0.8;
        }
        .msg-item .msg-text { font-size: 1.1rem; line-height: 1.6; }
        .msg-item .msg-image {
            margin-top: 10px;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            background: #0a0a0a;
            line-height: 0;
            position: relative;
        }
        .msg-item .msg-image img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: contain;
            display: block;
            background: #0a0a0a;
            transition: opacity 0.3s ease;
        }
        .msg-item .msg-image .img-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            color: #5a5a5a;
            font-size: 0.8rem;
            background: #141414;
            padding: 16px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        .msg-item .msg-image .img-placeholder .icon { margin-right: 8px; font-size: 1.2rem; opacity: 0.5; }

        .msg-item.from-left {
            align-self: flex-start;
            border-left-color: #b05a3a;
            --origin: left center;
            --rot: -3deg;
            animation-name: msgPopInLeft;
        }
        .msg-item.from-left .msg-speaker { text-align: left; }
        .msg-item.from-right {
            align-self: flex-end;
            border-right-color: #3a7a9a;
            --origin: right center;
            --rot: 3deg;
            animation-name: msgPopInRight;
        }
        .msg-item.from-right .msg-speaker { text-align: right; }

        @keyframes msgPopInLeft {
            0% { opacity:0; transform: translateX(-40px) scale(0.7) rotate(-3deg); }
            60% { opacity:1; transform: translateX(8px) scale(1.02) rotate(1deg); }
            100% { opacity:1; transform: translateX(0) scale(1) rotate(0deg); }
        }
        @keyframes msgPopInRight {
            0% { opacity:0; transform: translateX(40px) scale(0.7) rotate(3deg); }
            60% { opacity:1; transform: translateX(-8px) scale(1.02) rotate(-1deg); }
            100% { opacity:1; transform: translateX(0) scale(1) rotate(0deg); }
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #222;
            flex-wrap: wrap;
        }
        .controls-row button {
            background: #1a1a1a;
            border: 2px solid #444;
            color: #b0a898;
            padding: 10px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .controls-row button:hover {
            background: #222;
            border-color: #666;
            color: #d0c8b8;
        }
        .controls-row button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }
        .controls-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .controls-row .btn-continue { min-width: 100px; }
        .controls-row .btn-skip { border-color: #3a4a3a; color: #8aaa8a; }
        .controls-row .btn-skip:hover { border-color: #5a7a5a; color: #aacaaa; }
        .controls-row .btn-auto {
            border-color: #4a3a3a;
            color: #b08a7a;
            min-width: 120px;
        }
        .controls-row .btn-auto:hover { border-color: #6a4a3a; color: #d0aa8a; }
        .controls-row .btn-auto.playing { border-color: #6a5a3a; color: #d0b08a; background: #1e1a14; }
        .controls-row .btn-auto.paused { border-color: #4a5a3a; color: #8aaa7a; background: #141a14; }
        .controls-row .btn-auto.completed { border-color: #3a4a3a; color: #5a7a5a; }
        .controls-row .btn-reset {
            border: 1px solid #333;
            color: #5a5a5a;
            font-size: 0.8rem;
            padding: 6px 20px;
        }
        .controls-row .btn-reset:hover { border-color: #5a3a3a; color: #8a6a6a; }
        .controls-row .step-indicator {
            color: #5a5a5a;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
            min-width: 80px;
            text-align: center;
        }
        .controls-row .step-indicator em { color: #8a7a6a; font-style: normal; }

        @media (max-width:720px) {
            .rough-card { padding: 16px 12px 20px; }
            .title { font-size:1.4rem; }
            .stage { flex-direction:column; gap:12px; min-height:auto; }
            .role-column {
                flex:0 0 auto;
                flex-direction:row;
                justify-content:center;
                padding:8px 4px;
                min-height:90px;
                border:2px solid #222;
            }
            .role-column.left-column { border-right:2px solid #222; border-left:4px solid #b05a3a; }
            .role-column.right-column { border-left:2px solid #222; border-right:4px solid #3a7a9a; }
            .avatar-container {
                display:flex;
                flex-direction:row;
                flex-wrap:wrap;
                justify-content:center;
                gap:6px;
                padding:2px 0;
                min-height:unset;
                height:auto;
            }
            .role-item {
                position:static !important;
                transform:none !important;
                padding:2px 4px;
                flex-shrink:0;
                transition:none;
                width:auto;
            }
            .role-item .avatar-wrap { width:48px; height:48px; opacity:0.5; filter:grayscale(0.6); }
            .role-item.active .avatar-wrap { opacity:1; filter:grayscale(0); }
            .role-item .role-name { font-size:0.5rem; margin-top:2px; }
            .dialogue-wrap { max-height:320px; min-height:180px; padding:10px 12px; border-bottom:none; }
            .msg-item { max-width:92%; font-size:0.85rem; padding:8px 12px; }
            .msg-item .msg-image img { max-height:180px; }
            .controls-row { gap:10px; }
            .controls-row button { padding:8px 16px; font-size:0.8rem; }
            .controls-row .btn-continue { padding:8px 20px; }
            .controls-row .btn-auto { min-width:100px; }
            .controls-row .step-indicator { font-size:0.7rem; min-width:60px; }
        }
        @media (max-width:460px) {
            .role-item .avatar-wrap { width:40px; height:40px; }
            .dialogue-wrap { max-height:240px; min-height:140px; padding:6px 8px; gap:8px; }
            .msg-item { font-size:0.75rem; padding:6px 10px; max-width:96%; }
            .msg-item .msg-speaker { font-size:0.6rem; }
            .msg-item .msg-image img { max-height:120px; }
            .controls-row button { padding:6px 12px; font-size:0.7rem; }
            .controls-row .btn-continue { padding:6px 14px; }
            .controls-row .btn-auto { min-width:80px; }
            .title { font-size:1.2rem; }
            .sub-hint { font-size:0.65rem; }
            .role-column { min-height:70px; }
        }
    </style>
</head>
<body>
    <div class="rough-card" id="app">
        <div class="title"><span>📜</span> <span id="storyTitle">故事碎片</span></div>
        <div class="sub-hint">
            <span class="progress" id="progressHint">点击「继续」推进 · 共 <em id="totalCount">0</em> 句</span>
        </div>

        <div class="stage">
            <div class="role-column left-column" id="leftColumn">
                <div class="avatar-container" id="leftContainer"></div>
            </div>
            <div class="dialogue-wrap" id="dialogueWrap">
                <div class="dialogue-empty" id="dialogueEmpty">💬 点击「继续」开始阅读……</div>
            </div>
            <div class="role-column right-column" id="rightColumn">
                <div class="avatar-container" id="rightContainer"></div>
            </div>
        </div>

        <div class="controls-row">
            <button class="btn-continue" id="btnContinue">▶ 继续</button>
            <button class="btn-skip" id="btnSkipAll">⏩ 回顾全部</button>
            <button class="btn-auto" id="btnAutoPlay">▶ 自动播放</button>
            <span class="step-indicator" id="stepIndicator"><em>0</em> / <span id="totalDisplay">0</span></span>
            <button class="btn-reset" id="btnReset">⟲ 重来</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  📁  图片基础路径（可根据实际调整）
        // ================================================================
        const IMAGE_BASE = '../../pic/character/';        // 角色头像
        const MESSAGE_IMAGE_BASE = '../../pic/img/';     // 消息配图

        function getImagePath(file) { return IMAGE_BASE + file; }
        function getMessageImagePath(src) {
            if (!src) return '';
            if (/^https?:\/\//i.test(src) || src.startsWith('/')) return src;
            return MESSAGE_IMAGE_BASE + src;
        }

        // ================================================================
        //  📖  所有故事数据（按 id 索引）
        // ================================================================
        const STORY_DATA = {
            // ----- TE-0 -----
            'TE-0': {
                title: 'TE-0 · Teach',
                characters: {
                    '旁观者': { id:0, name:'旁观者', defaultAvatar:'旁观者/旁观者.png', color:'#6a8a4a', side:'left', order:0 },
                    // 可按需添加其他角色
                },
                dialogue: [
                    { speaker: '旁观者', text: '每个故事都需要一个讲述祂的人……' },
                    { speaker: '旁观者', text: '而我，我的朋友……我只是一个纯粹的，观察这一切的人。' },
                    { speaker: '旁观者', text: '信得过我也好，信不过也罢。' },
                    { speaker: '旁观者', text: '这是您的故事，独属于您的故事。' },
                    { speaker: '旁观者', text: '试着疏导吧，我们最初的谜题，就是这段故事如何发展。' },
                    { speaker: '旁观者', text: '觉得眼熟？……哈哈，是的，眼熟。' },
                    { speaker: '旁观者', text: '正因此，有哪里不一样的时候，您才会振奋，不是吗？' },
                    { speaker: '旁观者', text: '其他看不懂的，莫名其妙的东西，就放在那里吧。' },
                    { speaker: '旁观者', text: '会有人和您一起解开她的、我们的谜题的。' },
                    { speaker: '旁观者', text: '第一个时间代码是：D1H17M15-GA-1-2' },
                    { speaker: '旁观者', text: '回头吧！如果您需要改写众人的名，就在提问框里输入“改写”二字。' }
                ]
            },
            // ----- D1H17M15-GA-1-2 -----
            'D1H17M15-GA-1-2': {
                title: 'D1H17M15-GA-1-2 · Gate',
                characters: {
                    '旁观者': { id:0, name:'旁观者', defaultAvatar:'旁观者/旁观者.png', color:'#6a8a4a', side:'left', order:0 },
                    '识人鱼': { id:1, name:'识人鱼', defaultAvatar:'识人鱼/识人鱼.png', color:'#3a7a9a', side:'left', order:0},
                    '根系管家': { id:2, name:'根系管家', defaultAvatar:'根系管家/根系管家.png', color:'#8B7355', side:'right', order:1 }
                },
                dialogue: [
                    { speaker: '旁观者', text: '“咔嚓——咔嚓——咔嚓——”没有别的动作，他只是机械地拧着钥匙。' },
                    { speaker: '旁观者', text: '一下又一下，像是在做着永远没有停歇的工作。' },
                    { speaker: '识人鱼', text: '（明明还有电……为什么“驱动石”点不着呢？）' },
                    { speaker: '识人鱼', text: '（就算是因为天气寒冷，暴雪不停，也不至于这个时候把发动机冻上吧？明明“驱动石”已经泡在防冻液里了。）' },
                    { speaker: '旁观者', text: '第四次拧动，“咳咳咳咳……”，发动机喘着粗气，它的那一口浓痰终于快要被吐出来了。' },
                    { speaker: '旁观者', text: '第五次。' },
                    { speaker: '旁观者', text: '“翁！——”它终于醒了。' },
                    { speaker: '识人鱼', text: '（只差这一丁点路了，前面就是个不知名的庄园，马上就能稍微休息一下了。）' },
                    { speaker: '旁观者', text: '寒风盘踞在整个车的表面，试图从缝隙里见缝插针，将他缭绕束缚。' },
                    { speaker: '识人鱼', text: '（这样下去怕不是制热器也要坏掉了……）' },
                    { speaker: '旁观者', text: '挂挡，他把车开到庄园铁门之前。熄火，拉手刹，拔掉钥匙，下车。' },
                    { speaker: '旁观者', text: '雪落在他的肩头，暗声低语，促使他抬头看向面前这黑沉沉的古老建筑。' },
                    { speaker: '识人鱼', text: '（虽然不能确认这扇铁门是否愿意为我敞开，但是，也只能试试运气了。）' },
                    { speaker: '旁观者', text: '“哐啷——”' },
                    { speaker: '旁观者', text: '他还没有靠近，枯树一般的老妇人就突然立在门内了。' },
                    { speaker: '旁观者', text: '她扫描着男子的模样，笔直、沉默，没有什么多余的表情。' },
                    { speaker: '识人鱼', text: '（看她的服饰，大概率能确定是老管家。）' },
                    { speaker: '识人鱼', text: '（虽然让人不适，但是不得不说，她似乎很是负责：）' },
                    { speaker: '根系管家', text: '“庄园不对外开放。”' },
                    { speaker: '旁观者', text: '铿锵有力，只有这七个字。' },
                    { speaker: '旁观者', text: '比一切人情冷暖都更有说服力。' },
                    { speaker: '识人鱼', text: '（只是我真的很冷，没有办法这个时候回去的。）' },
                    { speaker: '识人鱼', text: '“哦？这里是个庄园啊？”（所以我这么问了。）' },
                    { speaker: '旁观者', text: '她稍稍迟疑，随即严肃起来，重复说：' },
                    { speaker: '根系管家', text: '“这里不开放！”' },
                    { speaker: '识人鱼', text: '（我回应她：）“您不用担心的，我没想要进去。我只是趁着大学假期，来到这附近云游的。”' },
                    { speaker: '根系管家', text: '“云游去别的地方！这里可是私人领地！”' },
                    { speaker: '旁观者', text: '她的声音更加聒噪，像是枯木上的老鸦。' },
                    { speaker: '识人鱼', text: '（干这一行还真是不容易啊……）' },
                    { speaker: '识人鱼', text: '“好的。打扰您了，我这就离开。”' },
                    { speaker: '旁观者', text: '他笑一笑，拉了拉领子和围巾，抽开车门，坐回座位。' },
                    { speaker: '旁观者', text: '插上钥匙，开始点火。' },
                    { speaker: '旁观者', text: '只是每次都不拧到底。' },
                    { speaker: '旁观者', text: '“翁！——”' },
                    { speaker: '识人鱼', text: '（如果点着了火呢？）' },

        function loadCustomNames() {

                    // 遍历所有故事中的角色
                    for (const storyId in STORY_DATA) {
                        const chars = STORY_DATA[storyId].characters;
                        for (const key in chars) {
                            const idx = defaultOrder.indexOf(key);
                            if (idx !== -1 && names[idx] && names[idx].trim()) {
                                chars[key].name = names[idx].trim();
                            }
                        }
                    }
                } catch (e) { console.warn('读取改写名字失败:', e); }
            }
        }

        const story = STORY_DATA[storyId];

            document.body.innerHTML = `<div style="color:#b8b0a0;padding:40px;text-align:center;">❌ 未找到档案：${storyId}</div>`;
            throw new Error('故事不存在');
        }

        const CHARACTERS = story.characters;

        const involvedKeys = [];

            if (!seen.has(item.speaker)) {
                seen.add(item.speaker);
                involvedKeys.push(item.speaker);
            }

        for (const key of involvedKeys) {
            if (!CHARACTERS[key]) {
                CHARACTERS[key] = {

        const roleElements = {};

            img.src = getImagePath(currentPortraits[key] || char.defaultAvatar);

                this.style.display = 'none';

            layoutContainer(leftContainer, leftKeys, speakerKey);

            for (const key of involvedKeys) {

            const centerIndex = (activeIndex !== -1) ? activeIndex : 0;
            const centerOffset = (containerHeight - itemHeight) / 2;

                const targetParent = container;

            renderRoles(speaker);

            const char = CHARACTERS[speaker];
            const side = roleState[speaker].side || 'left';
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg-item from-${side}`;
            msgDiv.style.borderLeftColor = side === 'left' ? char.color : '#2a2a2a';
            msgDiv.style.borderRightColor = side === 'right' ? char.color : '#2a2a2a';

            const nameSpan = document.createElement('div');
            nameSpan.className = 'msg-speaker';
            nameSpan.textContent = getDisplayName(char);
            nameSpan.style.color = char.color;

            const textSpan = document.createElement('div');
            textSpan.className = 'msg-text';
            textSpan.textContent = text;

            msgDiv.appendChild(nameSpan);
            msgDiv.appendChild(textSpan);

            if (image) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'msg-image';
                const imgEl = document.createElement('img');
                imgEl.src = getMessageImagePath(image);
                imgEl.alt = '配图';
                imgEl.loading = 'lazy';
                imgEl.onerror = function() {
                    this.style.display = 'none';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'img-placeholder';
                    placeholder.innerHTML = `<span class="icon">🖼️</span> 图片加载失败：${image}`;
                    imgContainer.appendChild(placeholder);
                };
                imgContainer.appendChild(imgEl);
                msgDiv.appendChild(imgContainer);
            }

            if (dialogueEmpty && dialogueEmpty.parentNode === dialogueWrap) {
                dialogueWrap.removeChild(dialogueEmpty);
            }
            dialogueWrap.appendChild(msgDiv);
            dialogueWrap.scrollTop = dialogueWrap.scrollHeight;
        }

        // ---------- 推进 ----------
        function advanceDialogue() {
            if (isAnimating) return;
            if (currentIndex >= DIALOGUE_DATA.length) return;
            isAnimating = true;
            try {
                const item = DIALOGUE_DATA[currentIndex];
                processDialogueItem(item);
                currentIndex++;
                stepIndicator.innerHTML = `<em>${currentIndex}</em> / <span>${DIALOGUE_DATA.length}</span>`;
                if (currentIndex >= DIALOGUE_DATA.length) {
                    btnContinue.disabled = true;
                    btnContinue.textContent = '✓ 已读完';
                    btnSkipAll.disabled = true;
                    btnSkipAll.textContent = '✓ 已回顾';
                    progressHint.textContent = '📖 故事碎片已完整呈现。';
                    if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                        stopAutoPlay();
                        updateAutoPlayUI('completed');
                    }
                } else {
                    btnContinue.disabled = false;
                    btnContinue.textContent = '▶ 继续';
                    progressHint.textContent = `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                }
            } catch (e) { console.error(e); }
            finally { setTimeout(() => { isAnimating = false; }, 400); }
        }

        // ---------- 自动播放 ----------
        function updateAutoPlayUI(state) {
            autoPlayState = state;
            btnAutoPlay.classList.remove('playing','paused','completed');
            switch (state) {
                case 'idle': btnAutoPlay.textContent = '▶ 自动播放'; btnAutoPlay.disabled = false; break;
                case 'playing': btnAutoPlay.textContent = '⏸ 暂停'; btnAutoPlay.disabled = false; btnAutoPlay.classList.add('playing'); break;
                case 'paused': btnAutoPlay.textContent = '▶ 继续播放'; btnAutoPlay.disabled = false; btnAutoPlay.classList.add('paused'); break;
                case 'completed': btnAutoPlay.textContent = '✓ 已播放'; btnAutoPlay.disabled = true; btnAutoPlay.classList.add('completed'); break;
            }
            const isAuto = (state === 'playing' || state === 'paused');
            btnContinue.disabled = isAuto || (currentIndex >= DIALOGUE_DATA.length);
            btnSkipAll.disabled = isAuto || (currentIndex >= DIALOGUE_DATA.length);
            if (isAuto) {
                btnContinue.textContent = '⏸ 自动中';
                btnSkipAll.textContent = '⏸ 自动中';
            } else if (currentIndex >= DIALOGUE_DATA.length) {
                btnContinue.textContent = '✓ 已读完';
                btnSkipAll.textContent = '✓ 已回顾';
            } else {
                btnContinue.textContent = '▶ 继续';
                btnSkipAll.textContent = '⏩ 回顾全部';
            }
            if (state === 'playing') progressHint.textContent = `▶ 自动播放中 · ${currentIndex}/${DIALOGUE_DATA.length}`;
            else if (state === 'paused') progressHint.textContent = `⏸ 已暂停 · ${currentIndex}/${DIALOGUE_DATA.length}`;
            else if (state === 'completed') progressHint.textContent = '📖 故事碎片已完整呈现。';
            else progressHint.textContent = currentIndex >= DIALOGUE_DATA.length ? '📖 故事碎片已完整呈现。' : `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
        }

        function startAutoPlay() {
            if (autoPlayTimer) return;
            if (currentIndex >= DIALOGUE_DATA.length) { updateAutoPlayUI('completed'); return; }
            updateAutoPlayUI('playing');
            setTimeout(autoPlayNext, 100);
        }

        function autoPlayNext() {
            if (autoPlayState !== 'playing') return;
            if (currentIndex >= DIALOGUE_DATA.length) { stopAutoPlay(); updateAutoPlayUI('completed'); return; }
            advanceDialogue();
            if (currentIndex >= DIALOGUE_DATA.length) { stopAutoPlay(); updateAutoPlayUI('completed'); return; }
            autoPlayTimer = setTimeout(autoPlayNext, AUTO_INTERVAL);
        }

        function pauseAutoPlay() {
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            if (autoPlayState === 'playing') updateAutoPlayUI('paused');
        }

        function resumeAutoPlay() {
            if (autoPlayState === 'paused' && currentIndex < DIALOGUE_DATA.length) {
                updateAutoPlayUI('playing');
                setTimeout(autoPlayNext, 200);
            } else if (currentIndex >= DIALOGUE_DATA.length) updateAutoPlayUI('completed');
        }

        function stopAutoPlay() {
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
        }

        function toggleAutoPlay() {
            if (autoPlayState === 'idle') startAutoPlay();
            else if (autoPlayState === 'playing') pauseAutoPlay();
            else if (autoPlayState === 'paused') resumeAutoPlay();
        }

        // ---------- 回顾全部 ----------
        async function skipAllDialogue() {
            if (isAnimating) return;
            if (currentIndex >= DIALOGUE_DATA.length) return;
            if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                stopAutoPlay();
                updateAutoPlayUI('idle');
            }
            isAnimating = true;
            btnContinue.disabled = true;
            btnSkipAll.disabled = true;
            btnAutoPlay.disabled = true;
            btnReset.disabled = true;
            btnSkipAll.textContent = '⏳ 回顾中…';
            try {
                while (currentIndex < DIALOGUE_DATA.length) {
                    const item = DIALOGUE_DATA[currentIndex];
                    processDialogueItem(item);
                    currentIndex++;
                    stepIndicator.innerHTML = `<em>${currentIndex}</em> / <span>${DIALOGUE_DATA.length}</span>`;
                    progressHint.textContent = `⏩ 回顾中 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                    await new Promise(r => setTimeout(r, 60));
                }
                btnContinue.disabled = true;
                btnContinue.textContent = '✓ 已读完';
                btnSkipAll.disabled = true;
                btnSkipAll.textContent = '✓ 已回顾';
                btnAutoPlay.disabled = true;
                btnAutoPlay.textContent = '✓ 已播放';
                btnAutoPlay.classList.add('completed');
                btnReset.disabled = false;
                progressHint.textContent = '📖 故事碎片已完整呈现。';
                updateAutoPlayUI('completed');
            } catch (e) { console.error(e); }
            finally {
                isAnimating = false;
                btnSkipAll.disabled = false;
                btnAutoPlay.disabled = false;
                btnReset.disabled = false;
                if (currentIndex < DIALOGUE_DATA.length) {
                    btnContinue.disabled = false;
                    btnContinue.textContent = '▶ 继续';
                    btnSkipAll.textContent = '⏩ 回顾全部';
                    updateAutoPlayUI('idle');
                }
            }
        }

        // ---------- 重置 ----------
        function resetDialogue() {
            if (isAnimating) return;
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            for (const key of involvedKeys) {
                roleState[key].side = CHARACTERS[key].side;
                roleState[key].order = CHARACTERS[key].order;
                currentPortraits[key] = CHARACTERS[key].defaultAvatar;
                const el = roleElements[key];
                const img = el.querySelector('img');
                if (img) {
                    const placeholder = el.querySelector('.placeholder-avatar');
                    if (placeholder) placeholder.remove();
                    img.style.display = '';
                    img.src = getImagePath(currentPortraits[key]);
                }
            }
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            dialogueWrap.appendChild(dialogueEmpty);
            currentIndex = 0;
            btnContinue.disabled = false;
            btnContinue.textContent = '▶ 继续';
            btnSkipAll.disabled = false;
            btnSkipAll.textContent = '⏩ 回顾全部';
            btnReset.disabled = false;
            stepIndicator.innerHTML = `<em>0</em> / <span>${DIALOGUE_DATA.length}</span>`;
            progressHint.textContent = `点击下方按钮推进对话 · 共 ${DIALOGUE_DATA.length} 句`;
            updateAutoPlayUI('idle');
            const firstSpeaker = DIALOGUE_DATA[0]?.speaker || involvedKeys[0];
            renderRoles(firstSpeaker);
            dialogueWrap.scrollTop = 0;
        }

        // ---------- 初始化 ----------
        function init() {
            loadCustomNames(); // 重新加载，确保名字最新
            const firstSpeaker = DIALOGUE_DATA[0]?.speaker || involvedKeys[0];
            renderRoles(firstSpeaker);
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            dialogueWrap.appendChild(dialogueEmpty);
            stepIndicator.innerHTML = `<em>0</em> / <span>${DIALOGUE_DATA.length}</span>`;
            progressHint.textContent = `点击下方按钮推进对话 · 共 ${DIALOGUE_DATA.length} 句`;

            btnContinue.addEventListener('click', function() {
                if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                    stopAutoPlay();
                    updateAutoPlayUI('idle');
                    if (currentIndex < DIALOGUE_DATA.length) {
                        btnContinue.disabled = false;
                        btnContinue.textContent = '▶ 继续';
                        btnSkipAll.disabled = false;
                        btnSkipAll.textContent = '⏩ 回顾全部';
                        progressHint.textContent = `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                    }
                }
                advanceDialogue();
            });
            btnSkipAll.addEventListener('click', skipAllDialogue);
            btnAutoPlay.addEventListener('click', toggleAutoPlay);
            btnReset.addEventListener('click', resetDialogue);

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        if (autoPlayState === 'playing') { pauseAutoPlay(); return; }
                        else if (autoPlayState === 'paused') { resumeAutoPlay(); return; }
                        if (!btnContinue.disabled) advanceDialogue();
                    }
                }
            });

            // 点击卡片空白处推进（与原来一致）
            document.querySelector('.rough-card').addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                if (autoPlayState === 'playing' || autoPlayState === 'paused') return;
                if (!btnContinue.disabled) advanceDialogue();
            });

            console.log(`📜 播放器加载档案: ${storyId}，共 ${DIALOGUE_DATA.length} 句`);
            console.log('📁 角色图片路径: ' + IMAGE_BASE);
            console.log('🖼️ 消息图片路径: ' + MESSAGE_IMAGE_BASE);
        }

        // ---------- 窗口 resize 重定位角色 ----------
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (currentSpeaker) renderRoles(currentSpeaker); }, 200);
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
