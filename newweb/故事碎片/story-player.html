    <title>故事碎片 · 播放器</title>
    <style>
        /* ---------- 基础样式（与您原文件一致） ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;

        .rough-card {

            width: 100%;
            padding: 28px 24px 32px;
            background: #111;
            border: 2px solid #2a2a2a;
            box-shadow: 0 8px 0 #1a1a1a, 0 12px 40px rgba(0,0,0,0.8);
            position: relative;
        }
        .rough-card::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px dashed #2a2a2a;
            pointer-events: none;
            opacity: 0.3;
        }
        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #c0b8a8;
            text-shadow: 0 0 6px rgba(200,180,150,0.1);
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
            margin-bottom: 4px;
        }
        .title span { margin-right: 6px; font-size: 1.6rem; }
        .sub-hint {
            text-align: center;
            color: #5a5a5a;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #222;
            margin-bottom: 16px;
        }
        .sub-hint .progress { color: #7a7a6a; }

        .stage {
            display: flex;
            gap: 16px;
            min-height: 460px;
            align-items: stretch;
        }
        .role-column {
            flex: 0 0 150px;
            background: #0d0d0d;
            border: 2px solid #222;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }
        .role-column.left-column { border-right: 3px solid #2a1f1a; }
        .role-column.right-column { border-left: 3px solid #1a222a; }

        .avatar-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 200px;
        }
        .role-item {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(0px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.34,1.2,0.64,1),
                        opacity 0.4s ease;
            will-change: transform;
            padding: 4px 0;
            width: auto;
        }
        .role-item .avatar-wrap {
            width: 92px;
            height: 92px;
            border: 3px solid #333;
            border-radius: 2px;
            overflow: hidden;
            background: #0a0a0a;
            transition: border-color 0.4s, box-shadow 0.4s, transform 0.4s,
                        opacity 0.4s, filter 0.4s;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
            flex-shrink: 0;
            position: relative;
            opacity: 0.5;
            filter: grayscale(0.6);
        }
        .role-item .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: pixelated;
        }
        .role-item .avatar-wrap .placeholder-avatar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            font-size: 1.5rem;
            background: #2a1a1a;
        }
        .role-item .role-name {
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-top: 4px;
            color: #6a6a5a;
            transition: color 0.4s;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }
        .role-item.active .avatar-wrap {
            border-color: #8a7a6a;
            box-shadow: 0 0 28px rgba(120,100,80,0.3);
            transform: scale(1.10);
            opacity: 1;
            filter: grayscale(0);
        }
        .role-item.active .role-name { color: #d0c0a8; }

        .dialogue-wrap {
            flex: 1;
            background: #0a0a0a;
            border: 2px solid #222;
            border-bottom: none;
            padding: 14px 16px;
            min-height: 380px;
            max-height: 480px;
            overflow-y: auto;
            overflow-x: hidden;          /* 右侧气泡贴边时不再冒出横向滚动条 */
            scrollbar-gutter: stable;    /* 竖向滚动条出现/消失时不再挤压内容宽度 */
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            position: relative;
        }
        .dialogue-wrap::-webkit-scrollbar { width: 4px; }
        .dialogue-wrap::-webkit-scrollbar-track { background: #0a0a0a; }
        .dialogue-wrap::-webkit-scrollbar-thumb { background: #333; }
        .dialogue-empty {
            color: #3a3a3a;
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
            margin: auto;
            letter-spacing: 1px;
        }

        .msg-item {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            padding: 10px 16px;
            border: 2px solid #2a2a2a;
            background: #111;
            box-shadow: 0 2px 0 #1a1a1a;
            opacity: 0;
            transform: scale(0.7) rotate(var(--rot,0deg));
            transform-origin: var(--origin, center);
            animation: msgPopIn 0.45s cubic-bezier(0.22,0.9,0.36,1.1) forwards;
            word-break: break-word;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #b8b0a0;
            border-left-width: 4px;
            border-right-width: 4px;
        }
        .msg-item .msg-speaker {
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: 0.8;
        }
        .msg-item .msg-text { font-size: 1.1rem; line-height: 1.6; }
        .msg-item .msg-image {
            margin-top: 10px;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            background: #0a0a0a;
            line-height: 0;
            position: relative;
        }
        .msg-item .msg-image img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: contain;
            display: block;
            background: #0a0a0a;
            transition: opacity 0.3s ease;
        }
        .msg-item .msg-image .img-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            color: #5a5a5a;
            font-size: 0.8rem;
            background: #141414;
            padding: 16px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        .msg-item .msg-image .img-placeholder .icon { margin-right: 8px; font-size: 1.2rem; opacity: 0.5; }

        .msg-item.from-left {
            align-self: flex-start;
            border-left-color: #b05a3a;
            --origin: left center;
            --rot: -3deg;
            animation-name: msgPopInLeft;
        }
        .msg-item.from-left .msg-speaker { text-align: left; }
        .msg-item.from-right {
            align-self: flex-end;
            border-right-color: #3a7a9a;
            --origin: right center;
            --rot: 3deg;
            animation-name: msgPopInRight;
        }
        .msg-item.from-right .msg-speaker { text-align: right; }
        .msg-item.no-anim { animation: none !important; opacity: 1 !important; transform: none !important; }

        @keyframes msgPopInLeft {
            0% { opacity:0; transform: translateX(-40px) scale(0.7) rotate(-3deg); }
            60% { opacity:1; transform: translateX(8px) scale(1.02) rotate(1deg); }
            100% { opacity:1; transform: translateX(0) scale(1) rotate(0deg); }
        }
        @keyframes msgPopInRight {
            0% { opacity:0; transform: translateX(40px) scale(0.7) rotate(3deg); }
            60% { opacity:1; transform: translateX(-8px) scale(1.02) rotate(-1deg); }
            100% { opacity:1; transform: translateX(0) scale(1) rotate(0deg); }
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #222;
            flex-wrap: wrap;
        }
        .controls-row button {
            background: #1a1a1a;
            border: 2px solid #444;
            color: #b0a898;
            padding: 10px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .controls-row button:hover {
            background: #222;
            border-color: #666;
            color: #d0c8b8;
        }
        .controls-row button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }
        .controls-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .controls-row .btn-continue { min-width: 100px; }
        .controls-row .btn-skip { border-color: #3a4a3a; color: #8aaa8a; }
        .controls-row .btn-skip:hover { border-color: #5a7a5a; color: #aacaaa; }
        .controls-row .btn-auto {
            border-color: #4a3a3a;
            color: #b08a7a;
            min-width: 120px;
        }
        .controls-row .btn-auto:hover { border-color: #6a4a3a; color: #d0aa8a; }
        .controls-row .btn-auto.playing { border-color: #6a5a3a; color: #d0b08a; background: #1e1a14; }
        .controls-row .btn-auto.paused { border-color: #4a5a3a; color: #8aaa7a; background: #141a14; }
        .controls-row .btn-auto.completed { border-color: #3a4a3a; color: #5a7a5a; }
        .controls-row .btn-reset {
            border: 1px solid #333;
            color: #5a5a5a;
            font-size: 0.8rem;
            padding: 6px 20px;
        }
        .controls-row .btn-reset:hover { border-color: #5a3a3a; color: #8a6a6a; }
        .controls-row .step-indicator {
            color: #5a5a5a;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
            min-width: 80px;
            text-align: center;
        }
        .controls-row .step-indicator em { color: #8a7a6a; font-style: normal; }

        @media (max-width:720px) {
            .rough-card { padding: 16px 12px 20px; }
            .title { font-size:1.4rem; }
            .stage { flex-direction:column; gap:12px; min-height:auto; }
            .role-column {
                flex:0 0 auto;
                flex-direction:row;
                justify-content:center;
                padding:8px 4px;
                min-height:90px;
                border:2px solid #222;
            }
            .role-column.left-column { border-right:2px solid #222; border-left:4px solid #b05a3a; }
            .role-column.right-column { border-left:2px solid #222; border-right:4px solid #3a7a9a; }
            .avatar-container {
                display:flex;
                flex-direction:row;
                flex-wrap:wrap;
                justify-content:center;
                gap:6px;
                padding:2px 0;
                min-height:unset;
                height:auto;
            }
            .role-item {
                position:static !important;
                transform:none !important;
                padding:2px 4px;
                flex-shrink:0;
                transition:none;
                width:auto;
            }
            .role-item .avatar-wrap { width:48px; height:48px; opacity:0.5; filter:grayscale(0.6); }
            .role-item.active .avatar-wrap { opacity:1; filter:grayscale(0); }
            .role-item .role-name { font-size:0.5rem; margin-top:2px; }
            .dialogue-wrap { max-height:320px; min-height:180px; padding:10px 12px; border-bottom:none; }
            .msg-item { max-width:92%; font-size:0.85rem; padding:8px 12px; }
            .msg-item .msg-image img { max-height:180px; }
            .controls-row { gap:10px; }
            .controls-row button { padding:8px 16px; font-size:0.8rem; }
            .controls-row .btn-continue { padding:8px 20px; }
            .controls-row .btn-auto { min-width:100px; }
            .controls-row .step-indicator { font-size:0.7rem; min-width:60px; }
        }
        @media (max-width:460px) {
            .role-item .avatar-wrap { width:40px; height:40px; }
            .dialogue-wrap { max-height:240px; min-height:140px; padding:6px 8px; gap:8px; }
            .msg-item { font-size:0.75rem; padding:6px 10px; max-width:96%; }
            .msg-item .msg-speaker { font-size:0.6rem; }
            .msg-item .msg-image img { max-height:120px; }
            .controls-row button { padding:6px 12px; font-size:0.7rem; }
            .controls-row .btn-continue { padding:6px 14px; }
            .controls-row .btn-auto { min-width:80px; }
            .title { font-size:1.2rem; }
            .sub-hint { font-size:0.65rem; }
            .role-column { min-height:70px; }
        }

        /* ================= CRT 复古滤镜 ================= */
        .crt { position: fixed; inset: 0; pointer-events: none; z-index: 999998; opacity: 0; transition: opacity .45s ease; overflow: hidden; }
        .crt.on { opacity: 1; }

        .crt-scanlines {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0.32) 3px,
                rgba(0,0,0,0.32) 4px
            );
            animation: crtJitter 7s linear infinite;
        }
        @keyframes crtJitter { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }

        .crt-aperture {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                to right,
                rgba(255,0,0,0.05) 0px,
                rgba(0,255,0,0.05) 1px,
                rgba(0,0,255,0.05) 2px,
                rgba(0,0,0,0) 3px
            );
        }

        .crt-vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 42%,
                rgba(0,0,0,0.32) 78%,
                rgba(0,0,0,0.85) 100%);
            box-shadow: inset 0 0 90px 30px rgba(0,0,0,0.65),
                        inset 0 0 14px 2px rgba(140,200,255,0.06);
        }

        .crt-flicker {
            position: absolute; inset: 0;
            background: rgba(170,200,255,0.05);
            mix-blend-mode: screen;
            animation: crtFlicker .9s steps(6) infinite;
        }
        @keyframes crtFlicker {
            0% { opacity: .02; } 20% { opacity: .07; } 40% { opacity: .03; }
            60% { opacity: .09; } 80% { opacity: .04; } 100% { opacity: .02; }
        }

        .crt-beam {
            position: absolute; left: 0; right: 0; height: 140px;
            background: linear-gradient(to bottom,
                rgba(200,225,255,0) 0%,
                rgba(200,225,255,0.035) 40%,
                rgba(210,235,255,0.075) 50%,
                rgba(200,225,255,0.035) 60%,
                rgba(200,225,255,0) 100%);
            animation: crtBeam 7s linear infinite;
        }
        @keyframes crtBeam { 0% { top: -160px; } 100% { top: 100%; } }

        .crt-noise {
            position: absolute; inset: 0;
            opacity: .035;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
            background-size: 140px 140px;
            animation: crtNoiseShift .35s steps(3) infinite;
        }
        @keyframes crtNoiseShift {
            0% { background-position: 0 0; }
            33% { background-position: -30px 20px; }
            66% { background-position: 25px -18px; }
            100% { background-position: 0 0; }
        }

        body.crt-on .rough-card,
        body.crt-on .msg-item,
        body.crt-on .role-item .role-name {
            text-shadow: 0.5px 0 rgba(255,70,70,.35), -0.5px 0 rgba(70,220,255,.35);
        }
        body.crt-on .rough-card {
            box-shadow: 0 8px 0 #1a1a1a, 0 12px 40px rgba(0,0,0,0.8),
                        0 0 26px rgba(110,220,170,0.045);
        }
        body.crt-on .role-item .avatar-wrap img {
            filter: contrast(1.05) saturate(0.92);
        }

        /* ================= 通用悬浮按钮 ================= */
        .crt-toggle, .back-btn {
            position: fixed; z-index: 999999;
            background: #1a1a1a; border: 2px solid #333; color: #8a8a7a;
            padding: 10px 20px; font-family: 'Courier New', monospace;
            font-size: 0.92rem; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 3px 0 #0a0a0a;
            transition: background .15s, border-color .15s, color .15s, opacity .15s;
            opacity: .6;
        }
        .crt-toggle:hover, .back-btn:hover { opacity: 1; border-color: #555; color: #c0b8a8; }
        .crt-toggle:active, .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0a0a; }
        .crt-toggle.active { border-color: #5a7a5a; color: #8aba8a; opacity: .8; }

        .crt-toggle { top: 14px; right: 14px; }
        .back-btn {
            top: 14px; left: 14px;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .back-btn:hover { border-color: #6a5a4a; color: #d0b8a8; }
        .back-btn.dragging {
            cursor: grabbing;
            opacity: .9;
            box-shadow: 0 3px 12px rgba(0,0,0,0.8);
            transition: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .crt-flicker, .crt-beam, .crt-noise, .crt-scanlines { animation: none !important; }
        }
    </style>

                    { speaker: '旁观者', text: '针织的帽子上标着英文字母，男孩头上的是【Maku】，女孩头上的是【Aki】。' },

            'D1H17M30-GRG-1-8': {
                title: 'D1H17M30-GRG-1-8 · Garage',
                characters: {
                    '旁观者': { id:0, name:'旁观者', defaultAvatar:'旁观者/旁观者.png', color:'#6a8a4a', side:'left', order:0 },
                    '识人鱼': { id:1, name:'识人鱼', defaultAvatar:'识人鱼/识人鱼.png', color:'#3a7a9a', side:'left', order:1 },
                    '辣妹': { id:8, name:'辣妹', defaultAvatar:'辣妹/辣妹.png', color:'#8B8B00', side:'right', order:0 }
                },
                dialogue: [
                    { speaker: '旁观者', text: '车库大门敞开着，里面停了好几辆车。' },
                    { speaker: '识人鱼', text: '（与其说是车库，不如说是个地下停车场……）' },
					{ speaker: '识人鱼', text: '（居然还有向下坡道，好夸张的规模……）' },
                    { speaker: '旁观者', text: '停在最前方的是三辆车。' },
					{ speaker: '旁观者', text: '一辆黑色桑特纳，一辆白色奔马，一辆皮卡车。' },
                    { speaker: '识人鱼', text: '（为什么……会有皮卡车？）' },
                    { speaker: '旁观者', text: '这之中还有给自行车和电动车划定的停车区域。' },
					{ speaker: '旁观者', text: '电动车区域还附有着【驱动石充电桩】。' },
                    { speaker: '识人鱼', text: '（真是功能齐全……）' },
                    { speaker: '识人鱼', text: '（今晚上……在这里凑合凑合吧……）' },
					{ speaker: '识人鱼', text: '（说不定明天雪就停了呢……）' },
                    { speaker: '旁观者', text: '“忽！——”' },
                    { speaker: '识人鱼', text: '（对面停的车突然地开了灯。）' },
					{ speaker: '识人鱼', text: '（白光扑面，让我无处遁形，也无比刺眼。）' },
                    { speaker: '旁观者', text: '“吱！——”' },
                    { speaker: '识人鱼', text: '（这种情况下也只能踩刹车恢复一下了。）' },
                    { speaker: '识人鱼', text: '（可恶！不可能不鸣笛了。）' },
                    { speaker: '旁观者', text: '“滴！——”' },
                    { speaker: '识人鱼', text: '（怎么会在起步的时候开远光灯啊……）' },
					{ speaker: '识人鱼', text: '（是新手？还是习惯？……）' },
					{ speaker: '识人鱼', text: '（暴风雪天气这样出去也很危险的啊……）' },
                    { speaker: '识人鱼', text: '（等视线略微恢复正常。）' },
					{ speaker: '识人鱼', text: '（我眨了眨眼，好好地看了过去，看看对面的车。）' },
                    { speaker: '识人鱼', text: '（大概是个黄车。）' },
					{ speaker: '识人鱼', text: '（只是黄的不够明显，像是大米一般的黄色。）' },
                    { speaker: '识人鱼', text: '（车是笨田。轻型车。大概率是新手。）' },
					{ speaker: '旁观者', text: '“砰！——”有人急急忙忙打开了车门。' },
					{ speaker: '识人鱼', text: '（下车的是个黄发的、小麦肤色的女性）' },
					{ speaker: '识人鱼', text: '（虽然仍然穿着毛衣羽绒，但是能看出来是个很喜欢穿搭和时尚的人。）' },
                    { speaker: '识人鱼', text: '（她双手合十，来到我的车窗旁，一遍又一遍拜我，以示抱歉。）' },
                    { speaker: '识人鱼', text: '（我摇下车窗，听她的话。）' },
                    { speaker: '辣妹', text: '“对不起对不起抱歉啦～”' },
                    { speaker: '旁观者', text: '她抱歉地笑着，但是嘻嘻地笑，显得自己没有恶意。' },
                    { speaker: '辣妹', text: '“刚买的车，不是很熟悉开法……”' },
					{ speaker: '辣妹', text: '“车灯没搞明白，本来是要开雾灯的。”' },
                    { speaker: '识人鱼', text: '（靠近一看，她原来还做了美甲。）' },
					{ speaker: '识人鱼', text: '（是个很精致的人么……可能她真的是个新手吧。）' },
                    { speaker: '识人鱼', text: '“啊，没有的事……”' },
					{ speaker: '识人鱼', text: '“辛亏我没有开灯，不然就要撞上您了，那才更坏呢。”' },
                    { speaker: '识人鱼', text: '（我微笑着说。）' },
                    { speaker: '识人鱼', text: '（难不成先前的车辙是她的？）' },
                    { speaker: '辣妹', text: '“哈哈哈……还好没什么大事。”' },
                    { speaker: '旁观者', text: '她尴尬地笑着说，在为自己的行为粉饰。' },
                    { speaker: '识人鱼', text: '“雪好像越下越大了，这个时候还要出去吗？”' },
                    { speaker: '辣妹', text: '“欸？”' },
                    { speaker: '旁观者', text: '她愣了一下。' },
                    { speaker: '辣妹', text: '“我不是要出去啊……”' },
                    { speaker: '旁观者', text: '她眨了眨眼。' },
                    { speaker: '识人鱼', text: '“嗯？”' },
                    { speaker: '识人鱼', text: '（我很疑惑。）' },
                    { speaker: '识人鱼', text: '“那是因为什么？”' },
                    { speaker: '辣妹', text: '“诶嘿嘿嘿……”' },
					{ speaker: '辣妹', text: '“我在……呃……练车”' },
					{ speaker: '辣妹', text: '“倒车入库，倒车入库。”' },
                    { speaker: '旁观者', text: '她笑了笑，摆了摆手。' },
                    { speaker: '识人鱼', text: '（果然是个新手啊。）' },
					{ speaker: '识人鱼', text: '（不过……正因此……）' },
                    { speaker: '识人鱼', text: '“那个……刚刚的鸣笛声……”' },
                    { speaker: '识人鱼', text: '（我想确认一件小事。）' },
                    { speaker: '辣妹', text: '“啊！那个也打扰到您了吗？”' },
                    { speaker: '旁观者', text: '她眨眨眼，有些张皇。' },
                    { speaker: '识人鱼', text: '（不用确认了。）' },
                    { speaker: '识人鱼', text: '“不，没有的事。”' },
					{ speaker: '识人鱼', text: '“只是感觉可能会吵到门口玩的那两个孩子……”' },
                    { speaker: '识人鱼', text: '（虽然我知道这么问稍微有点问题。）' },
					{ speaker: '识人鱼', text: '（但……还是挺有必要的。）' },
                    { speaker: '辣妹', text: '“哦……这样……”' },
                    { speaker: '旁观者', text: '她慢慢敛容，不再笑嘻嘻的' },
					{ speaker: '旁观者', text: '只是微笑，吸一吸气，看看别处。' },
                    { speaker: '识人鱼', text: '（看来她不想聊和那两个孩子有关的事。）' },
                    { speaker: '识人鱼', text: '“那我就不打扰您练车了。”' },
                    { speaker: '识人鱼', text: '（我也向她微笑。）' },
                    { speaker: '辣妹', text: '“嗯，好！……”' },
                    { speaker: '旁观者', text: '她尽量笑一笑，点点头，小幅度地，朝我摆摆手，以示再见。' },
                    { speaker: '旁观者', text: '向后退一退，她再挥一挥手，最后作别。' },
                    { speaker: '识人鱼', text: '（我也挥一挥手，以示分别。）' },
                    { speaker: '旁观者', text: '她开门，进入，关上了车门。' },
                    { speaker: '识人鱼', text: '（好了……那就选里面的车位吧……）' },
                    { speaker: '识人鱼', text: '（转向灯，左转方向盘，整个车身再次牵引我转移方位。）' },
                    { speaker: '识人鱼', text: '（直至停稳车子……）' },
					{ speaker: '识人鱼', text: '（我熄了火，拉上手刹，再看一看那个黄发女性。）' },
                    { speaker: '识人鱼', text: '（她还在练倒车停车。）' },
					{ speaker: '识人鱼', text: '（嗯，精神可嘉。）' },
                    { speaker: '识人鱼', text: '（那个贵妇人，要我帮忙停车……）' },
					{ speaker: '识人鱼', text: '（居然还要穿过雪地再走一遍啊。）' },
                    { speaker: '旁观者', text: '“咔——”' },
                    { speaker: '识人鱼', text: '（一打开车门……）' },
					{ speaker: '识人鱼', text: '（“嘶……”寒意就止不住地涌过来。）' },
					{ speaker: '识人鱼', text: '（和大门口那时相比有过之而无不及了。）' },
                    { speaker: '识人鱼', text: '（一边看看她，我一边慢慢往外走。）' },
                    { speaker: '识人鱼', text: '（走出车库的同时，我也得出了其他事的结论：）' },
                    { speaker: '识人鱼', text: '（——之前的车辙不是她留下的。）' },
					{ speaker: '旁观者', text: '这串分镜已经结束。' },
                    { speaker: '旁观者', text: '您已经知道他会去往何处，耗费多久，碰见什么人了……' },
                    { speaker: '旁观者', text: '那么，您可以开始自行推断，我将减少给予您的提示。' }
                ]
            },

                    { speaker: '识人鱼', text: '（我哆哆嗦嗦搓着手，努力维持着身体的温度和大脑的清醒。）' },
                    { speaker: '识人鱼', text: '（远远地，能看见大门处，有两个人。）' },

                    { speaker: '识人鱼', text: '（我看看那两个孩子。）' },

                    { speaker: '旁观者', text: '女孩眨眨大眼睛，握着树枝，一边往雪人身上插，一边回应他。' },
                    { speaker: 'Aki', text: '“都还没有来！”' },

                    { speaker: '识人鱼', text: '（我笑着指一指门口，示意他们我也有事要忙。）' },

                    { speaker: '识人鱼', text: '（戴Aki帽子的女孩点点头，然后不搭理我了。）' },
					{ speaker: '识人鱼', text: '（戴Maku帽子的男孩搓搓手上的雪，也不看我。）' },
                    { speaker: '识人鱼', text: '（当小孩还是好啊……）' },
                    { speaker: '识人鱼', text: '（我双手插兜，希望这样可以稍微暖和一点。）' },
                    { speaker: '识人鱼', text: '（就连我走在路上的时候，门口的他们两个人也一直在聊……）' },

                dialogue: [
                    { speaker: '乌鸦', text: '“他是什么人？”' },
                    { speaker: '旁观者', text: '男人问。' },
					{ speaker: '旁观者', text: '那声音就像留声机里放的那般，只是听……都觉得带着磨损。' },
                    { speaker: '旁观者', text: '浑身上下，他一身漆黑。' },
                    { speaker: '旁观者', text: '锐利的眼直直盯着远处的那个男青年看。' },
					{ speaker: '旁观者', text: '仿佛他是什么侵犯了领地的肥鱼，将要被男人一爪撕碎。' },
					{ speaker: '旁观者', text: '简直就像个黑乌鸦。' },
                    { speaker: '旁观者', text: '老管家颔首低眉，看看他，再看看远处的男青年' },
					{ speaker: '旁观者', text: '想想明白，她终于说话：' },

                    { speaker: '旁观者', text: '黑乌鸦眯起眼睛，表达轻蔑。' },

                    { speaker: '旁观者', text: '黑乌鸦可能是来了兴趣，微微笑着问老管家。' },
                    { speaker: '旁观者', text: '（嗯……）' },
					{ speaker: '旁观者', text: '（他们一家人还是那么爱笑……什么时候都要笑笑。）' },
                    { speaker: '旁观者', text: '老管家努力回忆了一遍，告诉他：' },

        // ================================================================
        //  🔄 改写名字加载（与 index 共享 localStorage 键名）
        // ================================================================
        function loadCustomNames() {
            const saved = localStorage.getItem('custom_character_names');
            if (saved) {
                try {
                    const names = JSON.parse(saved);
                    const defaultOrder = ['旁观者', '识人鱼', '根系管家', '说谎者', '影中人', '贵妇人','Maku','Aki','辣妹','乌鸦'];
                    for (const storyId in STORY_DATA) {
                        const chars = STORY_DATA[storyId].characters;
                        for (const key in chars) {
                            const idx = defaultOrder.indexOf(key);
                            if (idx !== -1 && names[idx] && names[idx].trim()) {
                                chars[key].name = names[idx].trim();
                            }
                        }
                    }
                } catch (e) { console.warn('读取改写名字失败:', e); }
            }
        }
        loadCustomNames();

        function getDisplayName(char) {
            return `[${char.id}]${char.name}`;
        }

        // ================================================================
        //  🚀 播放器核心
        // ================================================================
        const leftContainer = document.getElementById('leftContainer');
        const rightContainer = document.getElementById('rightContainer');
        const dialogueWrap = document.getElementById('dialogueWrap');
        const dialogueEmpty = document.getElementById('dialogueEmpty');
        const btnContinue = document.getElementById('btnContinue');
        const btnSkipAll = document.getElementById('btnSkipAll');
        const btnAutoPlay = document.getElementById('btnAutoPlay');
        const btnReset = document.getElementById('btnReset');
        const stepIndicator = document.getElementById('stepIndicator');
        const totalDisplay = document.getElementById('totalDisplay');
        const totalCount = document.getElementById('totalCount');
        const progressHint = document.getElementById('progressHint');
        const storyTitle = document.getElementById('storyTitle');

        let currentIndex = 0;
        let isAnimating = false;
        let currentSpeaker = null;
        let autoPlayTimer = null;
        let autoPlayState = 'idle'; // idle | playing | paused | completed
        const AUTO_INTERVAL = 1100;
        let fastForwarding = false;   // 快进 / 直接全显时，关闭平滑滚动以保证跟随
        let instantReveal = false;    // 直接全显时，文段不带弹入动画

        // ---------- 获取当前故事数据 ----------
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('id') || 'D1H17M25-DR-1-6-7';
        const story = STORY_DATA[storyId];
        if (!story) {
            document.body.innerHTML = `<div style="color:#b8b0a0;padding:40px;text-align:center;">❌ 未找到档案：${storyId}</div>`;
            throw new Error('故事不存在');
        }

        storyTitle.textContent = story.title;
        const DIALOGUE_DATA = story.dialogue;
        const CHARACTERS = story.characters;

        const involvedKeys = [];
        const seen = new Set();
        for (const item of DIALOGUE_DATA) {
            if (!seen.has(item.speaker)) {
                seen.add(item.speaker);
                involvedKeys.push(item.speaker);
            }
        }
        for (const key of involvedKeys) {
            if (!CHARACTERS[key]) {
                CHARACTERS[key] = {
                    id: 99,
                    name: key,
                    defaultAvatar: `${key}/${key}.png`,
                    color: '#888',
                    side: 'left',
                    order: 0
                };
            }
        }
        if (involvedKeys.length === 0) {
            for (const k in CHARACTERS) involvedKeys.push(k);
        }

        const roleState = {};
        const currentPortraits = {};
        for (const key of involvedKeys) {
            roleState[key] = {
                side: CHARACTERS[key].side || 'left',
                order: CHARACTERS[key].order || 0
            };
            currentPortraits[key] = CHARACTERS[key].defaultAvatar;
        }

        totalDisplay.textContent = DIALOGUE_DATA.length;
        totalCount.textContent = DIALOGUE_DATA.length;

        // ---------- 创建角色 DOM ----------
        const roleElements = {};
        const containerMap = { 'left': leftContainer, 'right': rightContainer };

        function createRoleElement(key) {
            const char = CHARACTERS[key];
            const item = document.createElement('div');
            item.className = 'role-item';
            item.dataset.role = key;

            const avatarWrap = document.createElement('div');
            avatarWrap.className = 'avatar-wrap';
            const img = document.createElement('img');
            img.src = getImagePath(currentPortraits[key] || char.defaultAvatar);
            img.alt = char.name;
            img.onerror = function() {
                this.style.display = 'none';
                let placeholder = this.parentElement.querySelector('.placeholder-avatar');
                if (!placeholder) {
                    placeholder = document.createElement('span');
                    placeholder.className = 'placeholder-avatar';
                    placeholder.textContent = '?';
                    this.parentElement.appendChild(placeholder);
                }
            };
            avatarWrap.appendChild(img);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'role-name';
            nameSpan.textContent = getDisplayName(char);

            item.appendChild(avatarWrap);
            item.appendChild(nameSpan);
            return item;
        }

        for (const key of involvedKeys) {
            const el = createRoleElement(key);
            const side = roleState[key].side;
            (containerMap[side] || leftContainer).appendChild(el);
            roleElements[key] = el;
        }

        // ---------- 渲染角色（居中） ----------
        function renderRoles(speakerKey) {
            const leftKeys = involvedKeys.filter(k => roleState[k].side === 'left');
            const rightKeys = involvedKeys.filter(k => roleState[k].side === 'right');
            leftKeys.sort((a,b) => roleState[a].order - roleState[b].order);
            rightKeys.sort((a,b) => roleState[a].order - roleState[b].order);
            layoutContainer(leftContainer, leftKeys, speakerKey);
            layoutContainer(rightContainer, rightKeys, speakerKey);

            for (const key of involvedKeys) {
                const el = roleElements[key];
                const isActive = (key === speakerKey);
                el.classList.toggle('active', isActive);
                const char = CHARACTERS[key];
                const avatarWrap = el.querySelector('.avatar-wrap');
                const nameSpan = el.querySelector('.role-name');
                nameSpan.textContent = getDisplayName(char);
                if (isActive) {
                    avatarWrap.style.borderColor = char.color;
                    avatarWrap.style.boxShadow = `0 0 30px ${char.color}44`;
                    nameSpan.style.color = char.color;
                } else {
                    avatarWrap.style.borderColor = '#333';
                    avatarWrap.style.boxShadow = '0 0 12px rgba(0,0,0,0.6)';
                    nameSpan.style.color = '#6a6a5a';
                }
            }
            currentSpeaker = speakerKey;
        }

        function layoutContainer(container, keys, speakerKey) {
            if (keys.length === 0) return;
            let containerHeight = container.clientHeight || 400;
            const itemHeight = 92 + 20 + 8;
            const activeIndex = keys.indexOf(speakerKey);
            const centerIndex = (activeIndex !== -1) ? activeIndex : 0;
            const centerOffset = (containerHeight - itemHeight) / 2;
            for (let i=0; i<keys.length; i++) {
                const key = keys[i];
                const el = roleElements[key];
                const targetParent = container;
                if (el.parentNode !== targetParent) targetParent.appendChild(el);
                const offsetY = centerOffset + (i - centerIndex) * itemHeight;
                el.style.transform = `translateX(-50%) translateY(${offsetY}px)`;
            }
        }

        // ---------- 滚动到底部（快进时强制瞬时，避免平滑滚动追不上） ----------
        function scrollToBottom(forceInstant) {
            if (forceInstant) {
                const prev = dialogueWrap.style.scrollBehavior;
                dialogueWrap.style.scrollBehavior = 'auto';
                dialogueWrap.scrollTop = dialogueWrap.scrollHeight;
                dialogueWrap.style.scrollBehavior = prev;
            } else {
                dialogueWrap.scrollTop = dialogueWrap.scrollHeight;
            }
        }

        // ---------- 处理单条对话 ----------
        function processDialogueItem(item) {
            const { speaker, text, portrait, setSide, setOrder, image } = item;
            if (setSide !== undefined) roleState[speaker].side = setSide;
            if (setOrder !== undefined) roleState[speaker].order = setOrder;
            if (portrait) currentPortraits[speaker] = portrait;
            else currentPortraits[speaker] = CHARACTERS[speaker].defaultAvatar;
            const el = roleElements[speaker];
            const img = el.querySelector('img');
            if (img) {
                const placeholder = el.querySelector('.placeholder-avatar');
                if (placeholder) placeholder.remove();
                img.style.display = '';
                img.src = getImagePath(currentPortraits[speaker]);
            }
            renderRoles(speaker);

            const char = CHARACTERS[speaker];
            const side = roleState[speaker].side || 'left';
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg-item from-${side}`;
            if (instantReveal) msgDiv.classList.add('no-anim');
            msgDiv.style.borderLeftColor = side === 'left' ? char.color : '#2a2a2a';
            msgDiv.style.borderRightColor = side === 'right' ? char.color : '#2a2a2a';

            const nameSpan = document.createElement('div');
            nameSpan.className = 'msg-speaker';
            nameSpan.textContent = getDisplayName(char);
            nameSpan.style.color = char.color;

            const textSpan = document.createElement('div');
            textSpan.className = 'msg-text';
            textSpan.textContent = text;

            msgDiv.appendChild(nameSpan);
            msgDiv.appendChild(textSpan);

            if (image) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'msg-image';
                const imgEl = document.createElement('img');
                imgEl.src = getMessageImagePath(image);
                imgEl.alt = '配图';
                imgEl.loading = 'lazy';
                // 图片就绪后才把容器挂进消息里：否则加载期间会在气泡下方留一个空的深色矩形
                imgEl.onload = function() {
                    if (!imgContainer.parentNode) msgDiv.appendChild(imgContainer);
                    if (fastForwarding) scrollToBottom(true);
                };
                imgEl.onerror = function() {
                    this.style.display = 'none';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'img-placeholder';
                    placeholder.innerHTML = `<span class="icon">🖼️</span> 图片加载失败：${image}`;
                    imgContainer.appendChild(placeholder);
                    if (!imgContainer.parentNode) msgDiv.appendChild(imgContainer);
                };
                imgContainer.appendChild(imgEl);
            }

            if (dialogueEmpty && dialogueEmpty.parentNode === dialogueWrap) {
                dialogueWrap.removeChild(dialogueEmpty);
            }
            dialogueWrap.appendChild(msgDiv);
            scrollToBottom(fastForwarding);
        }

        // ---------- 推进 ----------
        function advanceDialogue() {
            if (isAnimating) return;
            if (currentIndex >= DIALOGUE_DATA.length) return;
            isAnimating = true;
            try {
                const item = DIALOGUE_DATA[currentIndex];
                processDialogueItem(item);
                currentIndex++;
                stepIndicator.innerHTML = `<em>${currentIndex}</em> / <span>${DIALOGUE_DATA.length}</span>`;
                if (currentIndex >= DIALOGUE_DATA.length) {
                    markReviewed(storyId);
                    btnContinue.disabled = true;
                    btnContinue.textContent = '✓ 已读完';
                    btnSkipAll.disabled = true;
                    btnSkipAll.textContent = '✓ 已回顾';
                    progressHint.textContent = '📖 故事碎片已完整呈现。';
                    if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                        stopAutoPlay();
                        updateAutoPlayUI('completed');
                    }
                } else {
                    btnContinue.disabled = false;
                    btnContinue.textContent = '▶ 继续';
                    progressHint.textContent = `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                }
            } catch (e) { console.error(e); }
            finally { setTimeout(() => { isAnimating = false; }, 400); }
        }

        // ---------- 自动播放 ----------
        function updateAutoPlayUI(state) {
            autoPlayState = state;
            btnAutoPlay.classList.remove('playing','paused','completed');
            switch (state) {
                case 'idle': btnAutoPlay.textContent = '▶ 自动播放'; btnAutoPlay.disabled = false; break;
                case 'playing': btnAutoPlay.textContent = '⏸ 暂停'; btnAutoPlay.disabled = false; btnAutoPlay.classList.add('playing'); break;
                case 'paused': btnAutoPlay.textContent = '▶ 继续播放'; btnAutoPlay.disabled = false; btnAutoPlay.classList.add('paused'); break;
                case 'completed': btnAutoPlay.textContent = '✓ 已播放'; btnAutoPlay.disabled = true; btnAutoPlay.classList.add('completed'); break;
            }
            const isAuto = (state === 'playing' || state === 'paused');
            btnContinue.disabled = isAuto || (currentIndex >= DIALOGUE_DATA.length);
            btnSkipAll.disabled = isAuto || (currentIndex >= DIALOGUE_DATA.length);
            if (isAuto) {
                btnContinue.textContent = '⏸ 自动中';
                btnSkipAll.textContent = '⏸ 自动中';
            } else if (currentIndex >= DIALOGUE_DATA.length) {
                btnContinue.textContent = '✓ 已读完';
                btnSkipAll.textContent = '✓ 已回顾';
            } else {
                btnContinue.textContent = '▶ 继续';
                btnSkipAll.textContent = '⏩ 回顾全部';
            }
            if (state === 'playing') progressHint.textContent = `▶ 自动播放中 · ${currentIndex}/${DIALOGUE_DATA.length}`;
            else if (state === 'paused') progressHint.textContent = `⏸ 已暂停 · ${currentIndex}/${DIALOGUE_DATA.length}`;
            else if (state === 'completed') progressHint.textContent = '📖 故事碎片已完整呈现。';
            else progressHint.textContent = currentIndex >= DIALOGUE_DATA.length ? '📖 故事碎片已完整呈现。' : `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
        }

        function startAutoPlay() {
            if (autoPlayTimer) return;
            if (currentIndex >= DIALOGUE_DATA.length) { updateAutoPlayUI('completed'); return; }
            updateAutoPlayUI('playing');
            setTimeout(autoPlayNext, 100);
        }

        function autoPlayNext() {
            if (autoPlayState !== 'playing') return;
            if (currentIndex >= DIALOGUE_DATA.length) { stopAutoPlay(); updateAutoPlayUI('completed'); return; }
            advanceDialogue();
            if (currentIndex >= DIALOGUE_DATA.length) { stopAutoPlay(); updateAutoPlayUI('completed'); return; }
            autoPlayTimer = setTimeout(autoPlayNext, AUTO_INTERVAL);
        }

        function pauseAutoPlay() {
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            if (autoPlayState === 'playing') updateAutoPlayUI('paused');
        }

        function resumeAutoPlay() {
            if (autoPlayState === 'paused' && currentIndex < DIALOGUE_DATA.length) {
                updateAutoPlayUI('playing');
                setTimeout(autoPlayNext, 200);
            } else if (currentIndex >= DIALOGUE_DATA.length) updateAutoPlayUI('completed');
        }

        function stopAutoPlay() {
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
        }

        function toggleAutoPlay() {
            if (autoPlayState === 'idle') startAutoPlay();
            else if (autoPlayState === 'playing') pauseAutoPlay();
            else if (autoPlayState === 'paused') resumeAutoPlay();
        }

        // ---------- 回顾全部 ----------
        async function skipAllDialogue() {
            if (isAnimating) return;
            if (currentIndex >= DIALOGUE_DATA.length) return;
            if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                stopAutoPlay();
                updateAutoPlayUI('idle');
            }
            isAnimating = true;
            fastForwarding = true;
            btnContinue.disabled = true;
            btnSkipAll.disabled = true;
            btnAutoPlay.disabled = true;
            btnReset.disabled = true;
            btnSkipAll.textContent = '⏳ 回顾中…';
            try {
                while (currentIndex < DIALOGUE_DATA.length) {
                    const item = DIALOGUE_DATA[currentIndex];
                    processDialogueItem(item);
                    currentIndex++;
                    stepIndicator.innerHTML = `<em>${currentIndex}</em> / <span>${DIALOGUE_DATA.length}</span>`;
                    progressHint.textContent = `⏩ 回顾中 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                    await new Promise(r => setTimeout(r, 60));
                }
                scrollToBottom(true);
                fastForwarding = false;
                btnContinue.disabled = true;
                btnContinue.textContent = '✓ 已读完';
                btnSkipAll.disabled = true;
                btnSkipAll.textContent = '✓ 已回顾';
                btnAutoPlay.disabled = true;
                btnAutoPlay.textContent = '✓ 已播放';
                btnAutoPlay.classList.add('completed');
                btnReset.disabled = false;
                progressHint.textContent = '📖 故事碎片已完整呈现。';
                markReviewed(storyId);
                updateAutoPlayUI('completed');
            } catch (e) { console.error(e); }
            finally {
                isAnimating = false;
                fastForwarding = false;
                btnSkipAll.disabled = false;
                btnAutoPlay.disabled = false;
                btnReset.disabled = false;
                if (currentIndex < DIALOGUE_DATA.length) {
                    btnContinue.disabled = false;
                    btnContinue.textContent = '▶ 继续';
                    btnSkipAll.textContent = '⏩ 回顾全部';
                    updateAutoPlayUI('idle');
                }
            }
        }

        // ---------- 重置 ----------
        function resetDialogue() {
            if (isAnimating) return;
            unmarkReviewed(storyId);
            if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            for (const key of involvedKeys) {
                roleState[key].side = CHARACTERS[key].side || 'left';
                roleState[key].order = CHARACTERS[key].order || 0;
                currentPortraits[key] = CHARACTERS[key].defaultAvatar;
                const el = roleElements[key];
                const img = el.querySelector('img');
                if (img) {
                    const placeholder = el.querySelector('.placeholder-avatar');
                    if (placeholder) placeholder.remove();
                    img.style.display = '';
                    img.src = getImagePath(currentPortraits[key]);
                }
            }
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            dialogueWrap.appendChild(dialogueEmpty);
            currentIndex = 0;
            btnContinue.disabled = false;
            btnContinue.textContent = '▶ 继续';
            btnSkipAll.disabled = false;
            btnSkipAll.textContent = '⏩ 回顾全部';
            btnReset.disabled = false;
            stepIndicator.innerHTML = `<em>0</em> / <span>${DIALOGUE_DATA.length}</span>`;
            progressHint.textContent = `点击下方按钮推进对话 · 共 ${DIALOGUE_DATA.length} 句`;
            updateAutoPlayUI('idle');
            const firstSpeaker = DIALOGUE_DATA[0]?.speaker || involvedKeys[0];
            renderRoles(firstSpeaker);
            dialogueWrap.scrollTop = 0;
        }

        // ---------- 已读标记（播放完一次后，下次跳转直接展示全部） ----------
        const REVIEWED_KEY = 'spg_story_reviewed_v1';
        function getReviewedSet() {
            try { return new Set(JSON.parse(localStorage.getItem(REVIEWED_KEY) || '[]')); }
            catch (e) { return new Set(); }
        }
        function isReviewed(id) { return getReviewedSet().has(id); }
        // 清除某段故事的已读标记（用于「⟲ 重来」，与主界面「清空记录」语义一致）
        function unmarkReviewed(id) {
            try {
                const s = getReviewedSet(); s.delete(id);
                localStorage.setItem(REVIEWED_KEY, JSON.stringify(Array.from(s)));
            } catch (e) {}
        }
        function markReviewed(id) {
            try {
                const s = getReviewedSet(); s.add(id);
                localStorage.setItem(REVIEWED_KEY, JSON.stringify(Array.from(s)));
            } catch (e) {}
        }

        // 直接把全部文段铺出来（无弹入动画、瞬时滚到底），用于「已读过的档案再次打开」
        function showAllInstant() {
            fastForwarding = true;
            instantReveal = true;
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            for (const item of DIALOGUE_DATA) { processDialogueItem(item); }
            currentIndex = DIALOGUE_DATA.length;
            stepIndicator.innerHTML = `<em>${DIALOGUE_DATA.length}</em> / <span>${DIALOGUE_DATA.length}</span>`;
            instantReveal = false;
            fastForwarding = false;
            markReviewed(storyId);
            btnContinue.disabled = true; btnContinue.textContent = '✓ 已读完';
            btnSkipAll.disabled = true; btnSkipAll.textContent = '✓ 已回顾';
            btnAutoPlay.disabled = true; btnAutoPlay.textContent = '✓ 已播放'; btnAutoPlay.classList.add('completed');
            progressHint.textContent = '📖 故事碎片已完整呈现。';
            scrollToBottom(true);
        }

        // ---------- 初始化 ----------
        function init() {
            loadCustomNames();
            const firstSpeaker = DIALOGUE_DATA[0]?.speaker || involvedKeys[0];
            renderRoles(firstSpeaker);
            while (dialogueWrap.firstChild) dialogueWrap.removeChild(dialogueWrap.firstChild);
            dialogueWrap.appendChild(dialogueEmpty);
            stepIndicator.innerHTML = `<em>0</em> / <span>${DIALOGUE_DATA.length}</span>`;
            progressHint.textContent = `点击下方按钮推进对话 · 共 ${DIALOGUE_DATA.length} 句`;

            btnContinue.addEventListener('click', function() {
                if (autoPlayState === 'playing' || autoPlayState === 'paused') {
                    stopAutoPlay();
                    updateAutoPlayUI('idle');
                    if (currentIndex < DIALOGUE_DATA.length) {
                        btnContinue.disabled = false;
                        btnContinue.textContent = '▶ 继续';
                        btnSkipAll.disabled = false;
                        btnSkipAll.textContent = '⏩ 回顾全部';
                        progressHint.textContent = `点击继续 · ${currentIndex}/${DIALOGUE_DATA.length}`;
                    }
                }
                advanceDialogue();
            });
            btnSkipAll.addEventListener('click', skipAllDialogue);
            btnAutoPlay.addEventListener('click', toggleAutoPlay);
            btnReset.addEventListener('click', resetDialogue);

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    if (document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        if (autoPlayState === 'playing') { pauseAutoPlay(); return; }
                        else if (autoPlayState === 'paused') { resumeAutoPlay(); return; }
                        if (!btnContinue.disabled) advanceDialogue();
                    }
                }
            });

            document.querySelector('.rough-card').addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                if (autoPlayState === 'playing' || autoPlayState === 'paused') return;
                if (!btnContinue.disabled) advanceDialogue();
            });

            console.log(`📜 播放器加载档案: ${storyId}，共 ${DIALOGUE_DATA.length} 句`);
            console.log('📁 角色图片路径: ' + IMAGE_BASE);
            console.log('🖼️ 消息图片路径: ' + MESSAGE_IMAGE_BASE);

            // 已完整播放过的档案，再次打开时直接展示全部文段
            if (isReviewed(storyId)) showAllInstant();
        }

        // ---------- 窗口 resize 重定位角色 ----------
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (currentSpeaker) renderRoles(currentSpeaker); }, 200);
        });

        document.addEventListener('DOMContentLoaded', init);

        // =================================================================
        //  🆕 CRT 滤镜开关（与其他页面共享同一 localStorage 键）
        // =================================================================
        const CRT_KEY = 'crt_filter_enabled';
        const crtEl = document.getElementById('crtFilter');
        const crtToggle = document.getElementById('crtToggle');

        function setCRT(enabled) {
            crtEl.classList.toggle('on', enabled);
            document.body.classList.toggle('crt-on', enabled);
            crtToggle.textContent = enabled ? 'CRT ON' : 'CRT OFF';
            crtToggle.classList.toggle('active', enabled);
            try { localStorage.setItem(CRT_KEY, enabled ? '1' : '0'); } catch (e) {}
        }

        crtToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setCRT(!crtEl.classList.contains('on'));
        });

        setCRT(localStorage.getItem(CRT_KEY) !== '0');
        console.log('📺 CRT 滤镜已就绪。右上角按钮可切换。');

        // =================================================================
        //  🆕 返回主页按钮（可拖动，位置记忆，双击复位）
        // =================================================================
        const HOME_URL = '../../index.html';        // ← 若路径不同请修改
        const BACK_POS_KEY = 'back_btn_pos_v1';     // 与其他页面共享的位置存储键
        const BACK_DEFAULT = { x: 14, y: 14 };      // 默认位置：距左、距上（px）

        const backBtn = document.getElementById('backBtn');

        function applyBackPos(x, y) {
            backBtn.style.left = x + 'px';
            backBtn.style.top = y + 'px';
            backBtn.style.right = 'auto';
            backBtn.style.bottom = 'auto';
        }

        // 从 localStorage 恢复位置
        (function restoreBackPos() {
            let pos = null;
            try {
                const raw = localStorage.getItem(BACK_POS_KEY);
                if (raw) pos = JSON.parse(raw);
            } catch (e) {}
            if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') {
                const maxX = window.innerWidth - 100;
                const maxY = window.innerHeight - 40;
                applyBackPos(Math.max(0, Math.min(maxX, pos.x)), Math.max(0, Math.min(maxY, pos.y)));
            } else {
                applyBackPos(BACK_DEFAULT.x, BACK_DEFAULT.y);
            }
        })();

        // ---------- 拖动逻辑 ----------
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let startX = 0, startY = 0;
        let hasMoved = false;

        function beginDrag(clientX, clientY) {
            const rect = backBtn.getBoundingClientRect();
            dragOffsetX = clientX - rect.left;
            dragOffsetY = clientY - rect.top;
            startX = clientX;
            startY = clientY;
            hasMoved = false;
            isDragging = true;
            backBtn.classList.add('dragging');
        }

        function moveDrag(clientX, clientY) {
            if (!isDragging) return;
            const dx = clientX - startX;
            const dy = clientY - startY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
            let newLeft = clientX - dragOffsetX;
            let newTop = clientY - dragOffsetY;
            const maxX = window.innerWidth - backBtn.offsetWidth;
            const maxY = window.innerHeight - backBtn.offsetHeight;
            newLeft = Math.max(0, Math.min(maxX, newLeft));
            newTop = Math.max(0, Math.min(maxY, newTop));
            applyBackPos(newLeft, newTop);
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            backBtn.classList.remove('dragging');
            if (hasMoved) {
                const rect = backBtn.getBoundingClientRect();
                try {
                    localStorage.setItem(BACK_POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
                } catch (e) {}
            }
        }

        // 鼠标事件
        backBtn.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            e.preventDefault();
            beginDrag(e.clientX, e.clientY);
        });
        document.addEventListener('mousemove', (e) => { if (isDragging) moveDrag(e.clientX, e.clientY); });
        document.addEventListener('mouseup', () => { if (isDragging) endDrag(); });

        // 触屏事件
        backBtn.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            beginDrag(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const t = e.touches[0];
                moveDrag(t.clientX, t.clientY);
            }
        }, { passive: true });
        document.addEventListener('touchend', () => { if (isDragging) endDrag(); });

        // ---------- 点击返回（拖动过则不触发）----------
        function goHome() {
            // 暂停所有进行中的操作，释放资源
            try {
                if (typeof stopAutoPlay === 'function') stopAutoPlay();
                if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
            } catch (err) { /* 忽略 */ }

            // 尝试关闭当前标签页（若是被 window.open 打开，则能成功）
            try { window.close(); } catch (err) { /* 忽略 */ }

            // 若关闭失败，则延迟跳转回主页
            // （如果 close 成功，下面的代码不会执行）
            setTimeout(() => {
                window.location.replace(HOME_URL);
            }, 200);
        }

        backBtn.addEventListener('click', (e) => {
            if (hasMoved) {
                e.preventDefault();
                e.stopPropagation();
                hasMoved = false;
                return;
            }
            e.stopPropagation();
            goHome();
        });

        // ---------- 双击复位到默认位置 ----------
        backBtn.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            try { localStorage.removeItem(BACK_POS_KEY); } catch (err) {}
            applyBackPos(BACK_DEFAULT.x, BACK_DEFAULT.y);
        });

        // ---------- Esc 也能返回 ----------
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' &&
                document.activeElement?.tagName !== 'INPUT' &&
                document.activeElement?.tagName !== 'TEXTAREA') {
                e.preventDefault();
                goHome();
            }
        });

        // ---------- 窗口变化时确保按钮不越界 ----------
        window.addEventListener('resize', () => {
            const rect = backBtn.getBoundingClientRect();
            const maxX = window.innerWidth - backBtn.offsetWidth;
            const maxY = window.innerHeight - backBtn.offsetHeight;
            const newX = Math.max(0, Math.min(maxX, rect.left));
            const newY = Math.max(0, Math.min(maxY, rect.top));
            if (newX !== rect.left || newY !== rect.top) applyBackPos(newX, newY);
        });

        console.log('🏠 返回按钮已就绪：拖动移动，双击复位，位置自动保存。');
    </script>
</body>
</html>
