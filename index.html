        .archive-item { display: flex; align-items: center; gap: 8px; background: #1a1a1a; border: 1px solid #333; padding: 8px 12px; cursor: pointer; transition: 0.12s; }
        /* 条目始终横排：备注不占列表空间，改走「悬停时从左侧滑出」的浮层。

        .archive-item .item-copy, .archive-item .item-note-btn { background: none; border: 1px solid #333; color: #7a7a6a; cursor: pointer; font-size: 0.8rem; padding: 2px 7px; font-family: 'Courier New', monospace; transition: 0.12s; flex-shrink: 0; }
        .archive-item .item-copy:hover { border-color: #5a7a5a; color: #8aba8a; }

        /* 已经写过备注的：按钮点亮成琥珀色，一眼能看出哪条有笔记 */

        /* ---------- 备注浮层：悬停条目时从列表背后向左滑出，离开即收回 ---------- */
        .archive-note-pop {
            position: fixed; top: 0; left: 0; z-index: 999996;

            opacity: 0; pointer-events: none;

        /* ================= CRT 复古滤镜 ================= */
        .crt { position: fixed; inset: 0; pointer-events: none; z-index: 999998; opacity: 0; transition: opacity .45s ease; overflow: hidden; }
        .crt.on { opacity: 1; }

        /* 1. 扫描线 */
        .crt-scanlines {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0.32) 3px,
                rgba(0,0,0,0.32) 4px
            );
            animation: crtJitter 7s linear infinite;
        }
        @keyframes crtJitter { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }

        /* 2. RGB 孔径光栅（荫罩竖纹） */
        .crt-aperture {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                to right,
                rgba(255,0,0,0.05) 0px,
                rgba(0,255,0,0.05) 1px,
                rgba(0,0,255,0.05) 2px,
                rgba(0,0,0,0) 3px
            );
        }

        /* 3. 屏幕暗角 */
        .crt-vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 44%,
                rgba(0,0,0,0.28) 79%,
                rgba(0,0,0,0.74) 100%);
            box-shadow: inset 0 0 80px 26px rgba(0,0,0,0.55),
                        inset 0 0 14px 2px rgba(140,200,255,0.06);
        }

        /* 4. 荧光闪烁 */
        .crt-flicker {
            position: absolute; inset: 0;
            background: rgba(170,200,255,0.05);
            mix-blend-mode: screen;
            animation: crtFlicker .9s steps(6) infinite;
        }
        @keyframes crtFlicker {
            0% { opacity: .02; } 20% { opacity: .07; } 40% { opacity: .03; }
            60% { opacity: .09; } 80% { opacity: .04; } 100% { opacity: .02; }
        }

        /* 5. 缓缓下扫的电子束 */
        .crt-beam {
            position: absolute; left: 0; right: 0; height: 140px;
            background: linear-gradient(to bottom,
                rgba(200,225,255,0) 0%,
                rgba(200,225,255,0.035) 40%,
                rgba(210,235,255,0.075) 50%,
                rgba(200,225,255,0.035) 60%,
                rgba(200,225,255,0) 100%);
            animation: crtBeam 7s linear infinite;
        }
        @keyframes crtBeam { 0% { top: -160px; } 100% { top: 100%; } }

        /* 6. 颗粒噪点 */
        .crt-noise {
            position: absolute; inset: 0;
            opacity: .035;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
            background-size: 140px 140px;
            animation: crtNoiseShift .35s steps(3) infinite;
        }
        @keyframes crtNoiseShift {
            0% { background-position: 0 0; }
            33% { background-position: -30px 20px; }
            66% { background-position: 25px -18px; }
            100% { background-position: 0 0; }
        }

        /* 7. 文字轻微 RGB 色散 */
        body.crt-on .rough-card,
        body.crt-on .fly-popup,
        body.crt-on .rewrite-popup,
        body.crt-on .confirm-popup,
        body.crt-on .note-item,
        body.crt-on .archive-window,
        body.crt-on .music-window,
        body.crt-on .music-toast,
        body.crt-on .copy-toast,
        body.crt-on .archive-note-pop {
            text-shadow: 0.5px 0 rgba(255,70,70,.35), -0.5px 0 rgba(70,220,255,.35);
        }

        //  🪟 小窗口通用：右下角把手拖拽缩放（尺寸会记在本地存档里）
        //     用法：setupWindowResize(窗口元素, { minW, minH, maxW, maxH })
        //     双击把手 = 恢复默认尺寸
        // =================================================================
        const WIN_SIZE_KEY = 'spg_window_sizes_v1';
        function loadWinSizes() { try { return JSON.parse(localStorage.getItem(WIN_SIZE_KEY)) || {}; } catch (e) { return {}; } }
        function saveWinSizes(obj) { try { localStorage.setItem(WIN_SIZE_KEY, JSON.stringify(obj)); } catch (e) {} }

        function setupWindowResize(win, opts) {
            if (!win) return;
            opts = opts || {};
            const storeId = opts.id || win.id || ('win_' + Math.random().toString(36).slice(2));
            const minW = opts.minW || 300, minH = opts.minH || 220;
            const maxW = opts.maxW || 1200, maxH = opts.maxH || 900;

            let handle = win.querySelector('.win-resize');
            if (!handle) {
                handle = document.createElement('div');
                handle.className = 'win-resize';
                handle.title = '拖拽调整窗口大小（双击恢复默认）';
                win.appendChild(handle);
            }

            // 读取上次记住的尺寸
            const saved = loadWinSizes()[storeId];
            if (saved && saved.w > 0 && saved.h > 0) {
                win.style.width = saved.w + 'px';
                win.style.height = saved.h + 'px';
                win.style.maxHeight = 'none';
            }

            handle.addEventListener('mousedown', function (e) {
                if (e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();

                const rect = win.getBoundingClientRect();
                const startW = rect.width, startH = rect.height;
                const startX = e.clientX, startY = e.clientY;

                // 缩放前先把居中 transform 去掉，改用像素 left/top 锚定，避免尺寸变化时窗口乱飘
                if (!win.style.left || win.style.transform === 'translate(-50%, -50%)') {
                    win.style.transform = 'none';
                    win.style.left = rect.left + 'px';
                    win.style.top = rect.top + 'px';
                }
                win.style.maxHeight = 'none';
                win.classList.add('resizing');
                document.body.style.userSelect = 'none';

                function onMove(ev) {
                    const w = Math.max(minW, Math.min(maxW, Math.min(startW + (ev.clientX - startX), window.innerWidth - 16)));
                    const h = Math.max(minH, Math.min(maxH, Math.min(startH + (ev.clientY - startY), window.innerHeight - 16)));
                    win.style.width = w + 'px';
                    win.style.height = h + 'px';
                    // 顺手把窗口拉回视口内，别让缩放把它顶出屏幕
                    const left = parseFloat(win.style.left) || 0;
                    const top = parseFloat(win.style.top) || 0;
                    win.style.left = Math.max(0, Math.min(window.innerWidth - w, left)) + 'px';
                    win.style.top = Math.max(0, Math.min(window.innerHeight - h, top)) + 'px';
                }
                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    document.body.style.userSelect = '';
                    win.classList.remove('resizing');
                    const sizes = loadWinSizes();
                    sizes[storeId] = { w: Math.round(win.offsetWidth), h: Math.round(win.offsetHeight) };
                    saveWinSizes(sizes);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            handle.addEventListener('dblclick', function (e) {
                e.stopPropagation();
                win.style.width = '';
                win.style.height = '';
                win.style.maxHeight = '';
                const sizes = loadWinSizes();
                delete sizes[storeId];
                saveWinSizes(sizes);
            });
        }

        // 即可直接引用（作者写 bgm:'Xxx' 时无需再手动登记）。找不到时返回 null。
        function resolveMusicFile(name) {
            if (!name) return null;
            if (musicFileMap.has(name)) return musicFileMap.get(name);
            const guess = 'bgm/' + name + '.mp3';
            musicFileMap.set(name, guess);   // 注册一次，后续去重/收藏/播放都基于它
            return guess;
        }

        // ---------- 历史记录 ----------
        const historyRecords = new Set();

        // ---------- 🎵 已解锁音乐（可排序 / 分组的档案，UI 见文末「音乐收藏」模块） ----------
        let musicArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
        let currentMusicName = 'O';
        let musicPlayMode = 'order'; // 'order' 顺序 | 'random' 随机 | 'loop' 单曲循环
        let bgmFadeIv = null;        // 场景 BGM 淡入淡出用的定时器
        let bgmSwitchingTo = null;  // 正在切换到的目标曲名（防止一次切换因双通道投递被启动两次）

        // 主旋律「O」是开局就有的默认曲目：初始化、读档、清空后都要保证它在收藏里。
        // 注意只在「整份档案里都找不到 O」时才补，避免覆盖玩家自己拖好的排序/分组。
        function ensureDefaultMusic() {
            if (!musicArchive.items['O']) musicArchive.items['O'] = { name: 'O' };
            // 递归查整棵树（含子分组），否则 O 被玩家拖进嵌套分组后会重复补一次
            const exists = !!findOwnerFolder(musicArchive.folders, 'O');
            if (exists) return;
            let def = findFolderDeep(musicArchive.folders, 'default');
            if (!def) { def = { id: 'default', name: '未分类', items: [], folders: [] }; musicArchive.folders.unshift(def); }
            def.items.unshift('O');
        }
        ensureDefaultMusic();

        function addUnlockedMusic(name) {
            if (!name) return;
            if (musicArchive.items[name]) return;            // 同名已收藏，跳过
            // 同曲去重：同一音频文件若已经以别的名字收藏过，就不再重复添加
            // （防止 thinking 与 story 指向同一首 bgm，却因 musicName 写法不同而被加两次）
            const file = resolveMusicFile(name);
            if (file) {
                const dup = Object.keys(musicArchive.items).find(k => musicFileMap.get(k) === file);
                if (dup) return;
            }
            musicArchive.items[name] = { name: name };
            let def = findFolderDeep(musicArchive.folders, DEFAULT_FOLDER_ID);
            if (!def) { def = { id: 'default', name: '未分类', items: [], folders: [] }; musicArchive.folders.unshift(def); }
            if (!def.items.includes(name)) def.items.push(name);
            updateMusicCollectionDisplay();
            saveGame();
        }

        // 按玩家定义的分组顺序，把所有音乐拍平成一个数组（供「顺序/随机」播放使用）
        // 深度优先：先放完一个分组里的曲子，再进它的子分组，最后走到下一个同级分组
        function getMusicOrder() {
            const arr = [];
            const walk = (list) => {
                for (const folder of list) {
                    for (const kid of (folder.items || [])) {
                        if (musicArchive.items[kid]) arr.push(kid);
                    }
                    walk(ensureKids(folder));
                }
            };
            walk(musicArchive.folders);
            return arr;
        }

        function updateMusicCollectionDisplay() {
            musicCount.textContent = `(${Object.keys(musicArchive.items).length})`;
            const np = document.getElementById('nowPlayingName');
            if (np) np.textContent = currentMusicName || 'O';
            updateVinyl();
            renderMusicArchive();
        }

        function playMusic(name) {
            const file = resolveMusicFile(name);
            if (!file) {
                replyBox.innerHTML = `⚠️ 未找到音乐文件：${name}`;
                return;
            }
            bgm.volume = 1;
            bgm.src = file;
            bgm.load();
            bgm.loop = (musicPlayMode === 'loop');
            bgm.play().then(() => {
                isMusicPlaying = true;
                currentMusicName = name;
                updateMusicButton();
                updateMusicCollectionDisplay();
                showNowToast(name);
                console.log(`🎵 切换到：${name}`);
            }).catch(err => {
                console.warn('播放失败:', err);
                if (name !== 'O') {
                    replyBox.innerHTML = `⚠️ 播放失败，尝试恢复默认音乐。`;
                    playMusic('O');
                }
            });
        }

        // 由剧情跳转触发的播放（打开新页面 / 从档案回溯旧页面）：
        // 强制切成「单曲循环」，避免这首放完后按 顺序/随机 跳去别的曲子而破坏场景氛围。
        // 玩家自己在音乐收藏窗口里点的歌不走这里，仍保留他选的播放模式。
        function playSceneMusic(name) {
            if (musicPlayMode !== 'loop') {
                musicPlayMode = 'loop';
                if (typeof syncModeButtons === 'function') syncModeButtons();
                if (typeof saveGame === 'function') saveGame();
            }
            playMusic(name);
        }

        // 剧情/问询中切换场景 BGM，带简短的淡入淡出（由子页面 thinking 跨窗口发命令触发）。
        // fadeMs<=0 或音乐处于暂停态时做即时切换（快进用）；否则先淡出旧曲、再切源、淡入新曲。
        function playSceneMusicFade(name, file, fadeMs) {
            fadeMs = (fadeMs === undefined || fadeMs === null) ? 550 : fadeMs;
            if (file && !musicFileMap.has(name)) musicFileMap.set(name, file);
            const f = resolveMusicFile(name);
            if (!f) { console.warn('🎵 场景 BGM 切换：未找到文件', name); return; }
            if (musicPlayMode !== 'loop') {
                musicPlayMode = 'loop';
                if (typeof syncModeButtons === 'function') syncModeButtons();
                if (typeof saveGame === 'function') saveGame();
            }
            if (bgmSwitchingTo === name) return;                        // 同一次切换的重复投递（postMessage+storage 双通道）
            if (currentMusicName === name && isMusicPlaying) return;   // 同曲在播，不重复切
            bgmSwitchingTo = name;
            if (bgmFadeIv) { clearInterval(bgmFadeIv); bgmFadeIv = null; }
            const baseVol = (bgm.volume && bgm.volume > 0) ? bgm.volume : 1;
            if (fadeMs <= 0 || !isMusicPlaying) {
                // 即时切换（快进 / 音乐暂停态）
                bgm.src = f; bgm.load(); bgm.loop = (musicPlayMode === 'loop');
                currentMusicName = name;
                bgmSwitchingTo = null;
                if (typeof saveGame === 'function') saveGame();
                if (isMusicPlaying) bgm.play().then(() => { updateMusicButton(); updateVinyl(); showNowToast(name); }).catch(() => {});
                else { updateMusicButton(); updateVinyl(); }
                return;
            }
            // 顺序淡出 → 切源 → 淡入
            const steps = Math.max(1, Math.round(fadeMs / 30));
            const dec = baseVol / steps;
            bgmFadeIv = setInterval(() => {
                bgm.volume = Math.max(0, bgm.volume - dec);
                if (bgm.volume <= 0.001) {
                    clearInterval(bgmFadeIv); bgmFadeIv = null;
                    bgm.volume = 0;
                    bgm.src = f; bgm.load(); bgm.loop = (musicPlayMode === 'loop');
                    currentMusicName = name;
                    if (typeof saveGame === 'function') saveGame();
                    bgm.play().then(() => {
                        const inc = baseVol / steps;
                        bgmFadeIv = setInterval(() => {
                            bgm.volume = Math.min(baseVol, bgm.volume + inc);
                            if (bgm.volume >= baseVol - 0.001) {
                                clearInterval(bgmFadeIv); bgmFadeIv = null;
                                bgm.volume = baseVol;
                                bgmSwitchingTo = null;
                                updateMusicButton(); updateVinyl(); showNowToast(name);
                            }
                        }, 30);
                    }).catch(() => {});
                }
            }, 30);
        }

        // 子页面（thinking 等）跨窗口请求切换 BGM：
        //   postMessage(window.opener) 为主，localStorage 的 storage 事件兜底（file:// 下更稳）。
        //   命令同时会把新曲加入音乐收藏（按文件去重，不会重复添加）。
        function handleBgmSwitch(cmd) {
            if (!cmd || !cmd.name) return;
            addUnlockedMusic(cmd.name);
            playSceneMusicFade(cmd.name, cmd.file, cmd.fade ? 550 : 0);
        }
        window.addEventListener('message', (e) => {
            const d = e.data;
            if (d && d.__spg && d.type === 'bgm-switch') handleBgmSwitch(d);
        });
        window.addEventListener('storage', (e) => {
            if (e.key === 'spg_bgm_cmd') {
                try { const c = JSON.parse(e.newValue); if (c && c.name) handleBgmSwitch(c); } catch (_) {}
            }
        });

        // 切到下一首（依据播放模式）
        function nextTrack() {
            const order = getMusicOrder();
            if (order.length === 0) return;
            let next;
            if (musicPlayMode === 'random') {
                next = order[Math.floor(Math.random() * order.length)];
            } else if (musicPlayMode === 'loop') {
                next = currentMusicName;
            } else {
                const i = order.indexOf(currentMusicName);
                next = order[(i + 1) % order.length];
            }
            playMusic(next);
        }
        bgm.addEventListener('ended', () => { if (musicPlayMode !== 'loop') nextTrack(); });

        // ---------- 存档系统 ----------
        let _loading = false;

        function addHistoryRecord(keyword, displayName) {
            if (historyRecords.has(keyword)) return;
            historyRecords.add(keyword);
            if (historyEmpty) historyEmpty.style.display = 'none';
            addArchiveItem(keyword, displayName || keyword);
            if (!_loading) saveGame();
        }

        function saveGame() {
            try {
                const data = {
                    historyRecords: Array.from(historyRecords),
                    archive: archiveState,
                    dialogueState: { ...dialogueState },
                    easterEggStages: {},
                    thoughtArchive: thoughtArchive,
                    musicArchive: musicArchive,
                    currentMusicName: currentMusicName,
                    musicPlayMode: musicPlayMode
                };
                for (const [key, egg] of Object.entries(easterEggStages)) {
                    data.easterEggStages[key] = { count: egg.count, triggered: Array.from(egg.triggered) };
                }
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) { console.warn('保存失败:', e); }
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (!saved) return false;
            try {
                _loading = true;
                const data = JSON.parse(saved);

                if (data.archive && data.archive.folders && data.archive.folders.length) {
                    archiveState = data.archive;
                    const keys = Object.keys(archiveState.items || {});
                    for (const k of keys) historyRecords.add(k);
                    historyEmpty.style.display = keys.length ? 'none' : 'inline';
                } else if (data.historyRecords) {
                    historyEmpty.style.display = 'none';
                    for (const item of data.historyRecords) {
                        historyRecords.add(item);
                        addArchiveItem(item, item);
                    }
                }
                if (data.dialogueState) {
                    for (const [key, val] of Object.entries(data.dialogueState)) {
                        if (dialogueState.hasOwnProperty(key)) dialogueState[key] = val;
                    }
                }
                if (data.easterEggStages) {
                    for (const [key, val] of Object.entries(data.easterEggStages)) {
                        if (easterEggStages.hasOwnProperty(key)) {
                            easterEggStages[key].count = val.count || 0;
                            easterEggStages[key].triggered = new Set(val.triggered || []);
                        }
                    }
                }
                if (data.thoughtArchive && data.thoughtArchive.folders) {
                    thoughtArchive = data.thoughtArchive;
                    if (!thoughtArchive.items) thoughtArchive.items = {};
                    if (!findFolderDeep(thoughtArchive.folders, DEFAULT_FOLDER_ID)) {
                        thoughtArchive.folders.unshift({ id: 'default', name: '未分类', items: [], folders: [] });
                    }
                } else if (data.thoughtBubbles) {
                    // 旧版兼容：字符串数组迁移进档案
                    thoughtArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
                    for (const t of data.thoughtBubbles) {
                        if (!t || thoughtArchive.items[t]) continue;
                        thoughtArchive.items[t] = { text: t };
                        thoughtArchive.folders[0].items.push(t);
                    }
                }
                if (data.musicArchive && data.musicArchive.folders) {
                    musicArchive = data.musicArchive;
                    if (!musicArchive.items) musicArchive.items = {};
                    if (!findFolderDeep(musicArchive.folders, DEFAULT_FOLDER_ID)) {
                        musicArchive.folders.unshift({ id: 'default', name: '未分类', items: [], folders: [] });
                    }
                } else if (data.unlockedMusic) {
                    // 旧版存档兼容：扁平数组迁移为档案
                    musicArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
                    for (const item of data.unlockedMusic) {
                        if (!item || musicArchive.items[item]) continue;
                        musicArchive.items[item] = { name: item };
                        musicArchive.folders[0].items.push(item);
                    }
                }
                // 分组树迁移：老存档的子分组没有 folders / items 字段，读到这里一次性补齐
                normalizeFolders(archiveState.folders);
                normalizeFolders(thoughtArchive.folders);
                normalizeFolders(musicArchive.folders);
                ensureDefaultMusic();
                if (data.musicPlayMode === 'random' || data.musicPlayMode === 'loop' || data.musicPlayMode === 'order') {
                    musicPlayMode = data.musicPlayMode;
                }                if (data.currentMusicName && resolveMusicFile(data.currentMusicName)) {
                    currentMusicName = data.currentMusicName;
                    bgm.src = resolveMusicFile(currentMusicName);
                    bgm.load();
                }
                updateMusicCollectionDisplay();
                _loading = false;
                return true;
            } catch (e) {
                _loading = false;
                console.warn('读取存档失败:', e);
                return false;
            }
        }

        // ---------- 原始清空函数（用于实际执行清空） ----------
        // 跨页面共享的「进度类」localStorage 键。故事播放器等子页面会把进度写在自己的键里
        // （如 spg_story_reviewed_v1 = 已完整播放过的故事），清空主存档时必须一并抹掉，
        // 否则会出现「存档清了、故事却还记得读过」的情况。
        // 注意：纯 UI 偏好不在此列 —— crt_filter_enabled（CRT 滤镜开关）、back_btn_pos_v1（按钮位置）保留。
        const CROSS_PROGRESS_PREFIX = 'spg_';

        function clearCrossPageProgress() {
            try {
                for (const key of Object.keys(localStorage)) {
                    if (key.indexOf(CROSS_PROGRESS_PREFIX) === 0) localStorage.removeItem(key);
                }
            } catch (e) { console.warn('清理跨页进度失败:', e); }
        }

        function performClearGameData() {
            localStorage.removeItem(SAVE_KEY);
            clearCrossPageProgress();
            historyRecords.clear();
            archiveState = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
            historyEmpty.style.display = 'inline';
            renderArchive();
            for (const key in dialogueState) dialogueState[key] = 0;
            for (const key in easterEggStages) {
                easterEggStages[key].count = 0;
                easterEggStages[key].triggered.clear();
            }
            thoughtArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
            musicArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
            ensureDefaultMusic();
            currentMusicName = 'O';
            bgm.src = musicFileMap.get('O');
            bgm.load();
            updateMusicCollectionDisplay();
            resetCustomNames();
            saveCustomNames();
            replyBox.innerHTML = '🗑️ 已清空所有记录（含各页面的阅读进度），角色名字恢复默认。';
            saveGame();
            closeConfirmPopup();
        }

        // ---------- 自定义清空确认弹窗 ----------
        const confirmOverlay = document.getElementById('confirmOverlay');
        const confirmPopup = document.getElementById('confirmPopup');
        const confirmCloseBtn = document.getElementById('confirmCloseBtn');
        const confirmCancel = document.getElementById('confirmCancel');
        const confirmOk = document.getElementById('confirmOk');

        function openConfirmPopup() {
            confirmOverlay.classList.add('active');
            confirmPopup.classList.remove('animate-in');
            void confirmPopup.offsetWidth;
            confirmPopup.classList.add('animate-in');
        }

        function closeConfirmPopup() {
            confirmOverlay.classList.remove('active');
            confirmPopup.classList.remove('animate-in');
        }

        confirmCloseBtn.addEventListener('click', closeConfirmPopup);
        confirmCancel.addEventListener('click', closeConfirmPopup);
        confirmOk.addEventListener('click', performClearGameData);
        confirmOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeConfirmPopup();
        });

        function clearGameData() {
            openConfirmPopup();
        }

        clearHistoryBtn.removeEventListener('click', clearGameData);
        clearHistoryBtn.addEventListener('click', clearGameData);

        // ---------- 对话队列 ----------
        const dialogueChains = {
            '你在哪|你在哪里|where': [
                { ask: '你在哪|where', reply: '我就在这里。', next: '这里|here' },
                { ask: '这里|here', reply: '这里就是您的所在。', next: '所在|place' },
                { ask: '所在|place', reply: '别处。', next: null }
            ],
            '加密怎么解？|加密怎么解|加密|解码': [
                { ask: '加密怎么解？|加密怎么解|加密|解码', reply: '提问解码的用具', next: '什么用具|什么|怎么问|用具' },
                { ask: '什么用具|什么|怎么问|用具', reply: '提问是：解码器。', next: null }
            ],
            '凯撒|caesar|凯撒密码|凯撒大帝': [
                { ask: '凯撒|caesar|凯撒密码', reply: '是的，凯撒，凯撒密码。', next: '密码|password|凯撒密码' },
                { ask: '密码|password|凯撒密码', reply: '密码不止一个', next: '告诉我|tellme|不止一个？|不止一个' },
                { ask: '告诉我|tellme|不止一个？|不止一个', reply: '提问是：我该怎么见你', next: null }
            ],
            '密码是什么|密码是啥|whatispassword': [
                { ask: '密码是什么|whatispassword', reply: '密码是：数字。', next: '数字|number' },
                { ask: '数字|number', reply: '数字是答案的所在。', next: '所在|place' },
                { ask: '所在|place', reply: '提问是：凯撒掩码-K0', next: null }
            ],
            '我该怎么见你|怎么见你|howtoseeyou': [
                { ask: '我该怎么见你|howtoseeyou', reply: '您真的想见？', next: '真的|really' },
                { ask: '真的|really', reply: '再为我说一遍吧', next: '真的|really|真的啊' },
                { ask: '真的|really|真的啊', reply: '值得注意的是：2026824948', next: null }
            ],
        };
        const stepAliasMap = {};
        for (const [chainName, steps] of Object.entries(dialogueChains)) {
            stepAliasMap[chainName] = [];
            for (let i = 0; i < steps.length; i++) {
                const askAliases = steps[i].ask.split('|').map(s => s.trim().toLowerCase());
                stepAliasMap[chainName].push({ aliases: askAliases, index: i });
            }
        }
        const dialogueState = {};
        for (const chainName in dialogueChains) dialogueState[chainName] = 0;

        function checkDialogue(input) {
            const lower = input.toLowerCase();
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                if (currentIdx > 0 && currentIdx < steps.length) {
                    const curAliases = stepAliasMap[chainName][currentIdx]?.aliases || [];
                    if (curAliases.includes(lower)) {
                        dialogueState[chainName] = currentIdx + 1;
                        saveGame();
                        return { reply: steps[currentIdx].reply, chainName, stepIndex: currentIdx, isNewChain: false, repeat: false };
                    }
                }
            }
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                if (currentIdx >= steps.length) continue;
                const curAliases = stepAliasMap[chainName][currentIdx]?.aliases || [];
                if (curAliases.includes(lower)) {
                    dialogueState[chainName] = currentIdx + 1;
                    saveGame();
                    return { reply: steps[currentIdx].reply, chainName, stepIndex: currentIdx, isNewChain: (currentIdx === 0), repeat: false };
                }
            }
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                for (let i = currentIdx - 1; i >= 0; i--) {
                    const prevAliases = stepAliasMap[chainName][i]?.aliases || [];
                    if (prevAliases.includes(lower)) {
                        return { reply: steps[i].reply, chainName, stepIndex: i, isNewChain: false, repeat: true };
                    }
                }
            }
            return null;
        }

        // ---------- 思维碎片（可排序 / 分组的档案，UI 见文末「思维档案」模块） ----------
        let thoughtArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };

        function addThoughtBubble(text) {
            if (!text || thoughtArchive.items[text]) return;
            thoughtArchive.items[text] = { text: text };
            let def = findFolderDeep(thoughtArchive.folders, DEFAULT_FOLDER_ID);
            if (!def) { def = { id: 'default', name: '未分类', items: [], folders: [] }; thoughtArchive.folders.unshift(def); }
            def.items.push(text);
            saveGame();
        }

        // ---------- 漂浮笔记 ----------
        let noteSpeed = 3;
        const noteItems = [];
        speedSlider.addEventListener('input', function() {
            noteSpeed = parseFloat(this.value);
            speedDisplay.textContent = noteSpeed;
        });

        function clearAllNotes() {
            return new Promise(resolve => {
                const items = noteContainer.querySelectorAll('.note-item');
                if (items.length === 0) { resolve(); return; }
                for (const el of items) el.classList.add('scale-out');
                setTimeout(() => {
                    const remaining = noteContainer.querySelectorAll('.note-item');
                    for (const el of remaining) if (el.parentNode) el.parentNode.removeChild(el);
                    noteItems.length = 0;
                    resolve();
                }, 600);
            });
        }

        function spawnNote(text, duration = 15000, groupName) {
            const el = document.createElement('div');
            el.className = 'note-item';
            if (groupName) {
                const tag = document.createElement('div');
                tag.className = 'note-group';
                tag.textContent = '📁 ' + groupName;
                el.appendChild(tag);
            }
            const body = document.createElement('div');
            body.className = 'note-text';
            body.textContent = text;
            el.appendChild(body);
            const maxX = window.innerWidth - 260, maxY = window.innerHeight - 100;
            const x = 20 + Math.random() * (maxX - 40);
            const y = 20 + Math.random() * (maxY - 40);
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            const rot = (Math.random() - 0.5) * 12;
            el.style.setProperty('--rot', rot + 'deg');
            noteContainer.appendChild(el);

        // 从候选菜名里挑一道：近 FOOD_REPEAT_WINDOW 次内出现次数已达上限的先排除，
        // 并尽量避开上一次；若候选全被限流，则退到“出现次数最少”的那一档
        function pickFoodName(candidates) {
            if (!candidates || !candidates.length) return '';
            let hist = loadFoodHistory().slice(-FOOD_REPEAT_WINDOW);
            const buildCounts = h => { const c = {}; for (const n of h) c[n] = (c[n] || 0) + 1; return c; };
            const lastOf = h => (h.length ? h[h.length - 1] : null);
            // 存在「没触限、且不是上一道」的候选才算有得挑
            const hasGood = c => {
                const last = lastOf(hist);
                return candidates.some(n => n !== last && (c[n] || 0) < FOOD_REPEAT_LIMIT);
            };

            // 否则把最老的记录挤出窗口，腾出名额，保证「不超过 3 次」是硬上限
            let counts = buildCounts(hist);
            while (hist.length && !hasGood(counts)) {
                hist.shift();
                counts = buildCounts(hist);
            }

            let pool = candidates.filter(n => (counts[n] || 0) < FOOD_REPEAT_LIMIT);
            if (!pool.length) pool = candidates.slice();
            // 顺带避开上一次，连着问两次不会拿到同一道
            const last = lastOf(hist);
            if (last && pool.length > 1) {
                const withoutLast = pool.filter(n => n !== last);
                if (withoutLast.length) pool = withoutLast;
            }
            const name = pickRandom(pool);
            hist.push(name);
            saveFoodHistory(hist.slice(-FOOD_REPEAT_WINDOW));
            return name;
        }

            const list = (data && data.list) || [];

            for (const item of list) {
                const title = String((item && item.title) || '');
                if (!title) continue;
                let best = null;
                for (const kw of FOOD_POOL) {
                    if (title.indexOf(kw) !== -1 && (!best || kw.length > best.length)) best = kw;
                }
                if (best) hits.push({ name: best, hot: Number(item && item.hot_value) || 0, source: sourceName });
            }
            if (!hits.length) return null;
            hits.sort((a, b) => b.hot - a.hot);
            return hits.slice(0, 8);
        }

            all.sort((a, b) => b.hot - a.hot);
            // 按菜名去重，只留热度最高的那条，避免出现一堆同名候选
            const seen = {};

            return { picks: picks.slice(0, 10), ts: Date.now() };

        function sampleFrom(arr, n, exclude) {
            if (!arr || !arr.length) return [];
            const copy = arr.filter(x => !exclude || exclude.indexOf(x) === -1);
            const out = [];
            while (out.length < n && copy.length) {
                out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
            }
            return out;

        // 数据集是 GBK 编码，浏览器要用 ArrayBuffer + TextDecoder('gbk') 才能不乱码
        function fetchBufferWithTimeout(url, ms) {
            return new Promise((resolve, reject) => {
                let ctrl = null;
                if (typeof AbortController !== 'undefined') ctrl = new AbortController();
                const timer = setTimeout(() => { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, ms);
                const opts = { cache: 'no-store' };
                if (ctrl) opts.signal = ctrl.signal;
                fetch(url, opts).then(r => {
                    clearTimeout(timer);
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.arrayBuffer();
                }).then(resolve).catch(e => { clearTimeout(timer); reject(e); });
            });
        }

        function parseRecipeCsv(text) {
            const rows = [];
            const lines = text.split(/\r?\n/);
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if (parts.length < 5) continue;
                const name = (parts[1] || '').trim();
                if (!/^[一-龥·]{2,8}$/.test(name)) continue;   // 只要纯中文菜名，2~8 字
                rows.push({ name: name, fav: parseInt(String(parts[3]).replace(/[^0-9]/g, ''), 10) || 0 });
            }
            const seen = {};
            const uniq = [];
            for (const r of rows) {
                if (seen[r.name]) continue;
                seen[r.name] = 1;
                uniq.push(r);
            }
            uniq.sort((a, b) => b.fav - a.fav);            // 按收藏数降序 = 按人气降序
            return uniq.slice(0, FOOD_RECIPE_KEEP).map(r => r.name);
        }

        async function ensureRecipePool() {
            const cached = loadRecipePool();
            if (cached) return cached;
            try {
                const buf = await fetchBufferWithTimeout(FOOD_RECIPE_URL, FOOD_RECIPE_FETCH_TIMEOUT);
                let text = null;
                try { text = new TextDecoder('gbk').decode(buf); } catch (e) { text = new TextDecoder('utf-8').decode(buf); }
                const items = parseRecipeCsv(text);
                if (items.length) { saveRecipePool(items); return items; }
            } catch (e) {}
            return [];
        }

        async function getFoodReply() {
            const cache = loadFoodCache();
            const usable = cache && cache.picks && cache.picks.length > 0;
            const fresh = usable && (Date.now() - (cache.ts || 0) < FOOD_CACHE_TTL);

            // 榜单优先用新鲜的；过期就现抓，抓不到才退回旧榜单
            const recipePromise = ensureRecipePool();   // 与抓榜单并行，避免叠加等待
            let hot = null;
            if (fresh) {
                hot = cache;
            } else {
                const live = await fetchHotFood().catch(() => null);
                if (live && live.picks.length) {
                    hot = live;
                    saveFoodCache(live);
                } else {
                    hot = usable ? cache : null;
                    // 后台再试一次，下次提问就能用上新榜单
                    fetchHotFood().then(l => { if (l && l.picks.length) saveFoodCache(l); }).catch(() => {});
                }
            }

            // 关键：单靠榜单命中通常只有一两道，防雷同是无解的。
            // 所以把本地流行词库 + 菜谱区人气榜一起混进候选池抽签，抽中谁就用谁的口吻回答。
            const recipePool = await recipePromise;
            const useHot = !!hot && Math.random() < FOOD_HOT_CHANCE;
            const hotNames = useHot ? hot.picks.map(p => p.name) : [];
            const localNames = sampleFrom(FOOD_POOL, FOOD_LOCAL_SAMPLE, hotNames);
            const recipeNames = sampleFrom(recipePool, FOOD_RECIPE_SAMPLE, hotNames.concat(localNames));
            const candidates = hotNames.concat(localNames, recipeNames);
            const name = pickFoodName(candidates);
            const hotPick = hotNames.indexOf(name) !== -1 ? hot.picks.filter(p => p.name === name)[0] : null;
            // 统一输出形式：「今天吃：菜名。」+（榜单来源，若有）+ 一句彩蛋台词
            const lines = [`今天吃：${name}。`];
            if (hotPick) lines.push(pickRandom(FOOD_HOT_PHRASES)(hotPick.source));
            lines.push(pickRandom(FOOD_TAILS));
            return lines.join('\n');
        }

        function handleUserInput() {
            const rawText = userInput.value.trim();
            if (rawText === '') { replyBox.innerHTML = '📝 请写下您的疑问……'; return; }
            const lowerText = rawText.toLowerCase();

            if (lowerText === '改写') {
                openRewriteModal();
                userInput.value = '';
                userInput.focus();
                return;
            }

            const dialogueResult = checkDialogue(rawText);
            if (dialogueResult !== null) {
                if (dialogueResult.isNewChain && !dialogueResult.repeat) {
                    let hasOtherActive = false;
                    for (const chainName in dialogueChains) {
                        if (chainName !== dialogueResult.chainName && dialogueState[chainName] > 0) {
                            hasOtherActive = true;
                            break;
                        }
                    }
                    if (hasOtherActive) {
                        for (const chainName in dialogueChains) dialogueState[chainName] = 0;
                        dialogueState[dialogueResult.chainName] = 1;
                        saveGame();
                    }
                }
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${dialogueResult.reply}`;
                if (dialogueResult.reply.includes('值得注意的是')) {
                    spawnNote('💭 ' + dialogueResult.reply, 15000);
                    addThoughtBubble(dialogueResult.reply);
                    saveGame();
                }
                userInput.value = ''; userInput.focus(); return;
            }

            let hasActive = false;
            for (const chainName in dialogueChains) {
                if (dialogueState[chainName] > 0) { hasActive = true; break; }
            }
            if (hasActive) {
                for (const chainName in dialogueChains) dialogueState[chainName] = 0;
                saveGame();
            }

            let matchedKey = null;
            let normalReply = null;
            for (const [key, value] of Object.entries(flatResponses)) {
                if (lowerText === key.toLowerCase()) {
                    matchedKey = key;
                    // 值可以是字符串，也可以是函数（动态回答，如时间/今天吃什么）
                    normalReply = (typeof value === 'function') ? value(rawText) : value;
                    break;
                }
            }
            if (matchedKey) {
                let eggKey = eggAliasMap[lowerText] || null;
                let eggReply = null, triggeredThisTime = false;
                if (eggKey && easterEggStages.hasOwnProperty(eggKey)) {
                    const egg = easterEggStages[eggKey];
                    if (egg.triggered.size === egg.stages.length) { egg.count = 0; egg.triggered.clear(); }
                    egg.count += 1;
                    const sortedStages = [...egg.stages].sort((a, b) => a.at - b.at);
                    for (const stage of sortedStages) {
                        if (egg.count >= stage.at && !egg.triggered.has(stage.at)) {
                            eggReply = stage.reply;
                            egg.triggered.add(stage.at);
                            triggeredThisTime = true;
                            saveGame();
                            break;
                        }
                    }
                }
                const finalReply = triggeredThisTime && eggReply ? eggReply : normalReply;
                if (finalReply && typeof finalReply.then === 'function') {
                    // 异步回答：先给一句占位，拿到结果后再覆盖（用 token 防止旧请求盖掉新回答）
                    const token = ++asyncReplyToken;
                    renderReply(rawText, '……让我翻一翻。');
                    finalReply.then(text => {
                        if (token !== asyncReplyToken) return;
                        renderReply(rawText, text);
                    }).catch(() => {
                        if (token !== asyncReplyToken) return;
                        renderReply(rawText, '我翻不到今天的榜单……吃您爱吃的吧。');
                    });
                } else {
                    renderReply(rawText, finalReply);
                }
                const popupMatch = flatPopupMap[lowerText];
                if (popupMatch) {
                    const { key, config } = popupMatch;
                    const displayName = popupDisplayNames[key] || key;
                    setTimeout(() => createFlyPopup(key, config, displayName), 300);
                } else {
                    if (activePopup) closeFlyPopup(activePopup);
                }
                userInput.value = ''; userInput.focus(); return;
            }

            const popupMatch = flatPopupMap[lowerText];
            if (popupMatch) {
                const { key, config } = popupMatch;
                const displayName = popupDisplayNames[key] || key;
                const replyText = '您唤醒了某个碎片。';
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${replyText}`;
                if (replyText.includes('值得注意的是')) {
                    spawnNote('💭 ' + replyText, 15000);
                    addThoughtBubble(replyText);
                    saveGame();
                }
                setTimeout(() => createFlyPopup(key, config, displayName), 300);
                userInput.value = ''; userInput.focus(); return;
            }

            replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${defaultReply}`;
            if (activePopup) closeFlyPopup(activePopup);
            userInput.value = ''; userInput.focus();
        }

        function loadCustomNames() {
            const saved = localStorage.getItem(REWRITE_KEY);
            if (saved) {
                try {
                    const names = JSON.parse(saved);
                    if (Array.isArray(names) && names.length === DEFAULT_CHARACTERS.length) {
                        const fixedNames = names.map((name, index) => {
                            if (typeof name !== 'string' ||
                                name.includes('�') ||

                            }

                            id: def.id,
                            name: fixedNames[i] || def.name,
                            color: def.color
                        }));
                        // 如果数据被修复了，自动保存干净数据
                        if (JSON.stringify(fixedNames) !== JSON.stringify(names)) {
                            localStorage.setItem(REWRITE_KEY, JSON.stringify(fixedNames));

                } catch (e) {}
            }

        // 🔧 修复：保存前验证，防止写入乱码
        function saveCustomNames() {

                const def = DEFAULT_CHARACTERS.find(d => d.id === char.id);
