        function ensureDefaultMusic() {
            if (!musicArchive.items['O']) musicArchive.items['O'] = { name: 'O' };

            if (exists) return;
            let def = musicArchive.folders.find(f => f.id === 'default');

            def.items.unshift('O');

            if (!name) return;

            if (!def) { def = { id: 'default', name: '未分类', items: [] }; musicArchive.folders.push(def); }

            saveGame();

            for (const folder of musicArchive.folders) {
                for (const kid of folder.items) {
                    if (musicArchive.items[kid]) arr.push(kid);

            return arr;

                if (typeof syncModeButtons === 'function') syncModeButtons();
                if (typeof saveGame === 'function') saveGame();
            }
            playMusic(name);
        }

        // 切到下一首（依据播放模式）
        function nextTrack() {
            const order = getMusicOrder();
            if (order.length === 0) return;
            let next;
            if (musicPlayMode === 'random') {
                next = order[Math.floor(Math.random() * order.length)];
            } else if (musicPlayMode === 'loop') {
                next = currentMusicName;
            } else {
                const i = order.indexOf(currentMusicName);
                next = order[(i + 1) % order.length];
            }
            playMusic(next);
        }
        bgm.addEventListener('ended', () => { if (musicPlayMode !== 'loop') nextTrack(); });

        // ---------- 存档系统 ----------
        let _loading = false;

        function addHistoryRecord(keyword, displayName) {
            if (historyRecords.has(keyword)) return;
            historyRecords.add(keyword);
            if (historyEmpty) historyEmpty.style.display = 'none';
            addArchiveItem(keyword, displayName || keyword);
            if (!_loading) saveGame();
        }

        function saveGame() {
            try {
                const data = {
                    historyRecords: Array.from(historyRecords),
                    archive: archiveState,
                    dialogueState: { ...dialogueState },
                    easterEggStages: {},
                    thoughtArchive: thoughtArchive,
                    musicArchive: musicArchive,
                    currentMusicName: currentMusicName,
                    musicPlayMode: musicPlayMode
                };
                for (const [key, egg] of Object.entries(easterEggStages)) {
                    data.easterEggStages[key] = { count: egg.count, triggered: Array.from(egg.triggered) };
                }
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) { console.warn('保存失败:', e); }
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (!saved) return false;
            try {
                _loading = true;
                const data = JSON.parse(saved);

                if (data.archive && data.archive.folders && data.archive.folders.length) {
                    archiveState = data.archive;
                    const keys = Object.keys(archiveState.items || {});
                    for (const k of keys) historyRecords.add(k);
                    historyEmpty.style.display = keys.length ? 'none' : 'inline';
                } else if (data.historyRecords) {
                    historyEmpty.style.display = 'none';
                    for (const item of data.historyRecords) {
                        historyRecords.add(item);
                        addArchiveItem(item, item);
                    }
                }
                if (data.dialogueState) {
                    for (const [key, val] of Object.entries(data.dialogueState)) {
                        if (dialogueState.hasOwnProperty(key)) dialogueState[key] = val;
                    }
                }
                if (data.easterEggStages) {
                    for (const [key, val] of Object.entries(data.easterEggStages)) {
                        if (easterEggStages.hasOwnProperty(key)) {
                            easterEggStages[key].count = val.count || 0;
                            easterEggStages[key].triggered = new Set(val.triggered || []);
                        }
                    }
                }
                if (data.thoughtArchive && data.thoughtArchive.folders) {
                    thoughtArchive = data.thoughtArchive;
                    if (!thoughtArchive.items) thoughtArchive.items = {};
                    if (!thoughtArchive.folders.find(f => f.id === 'default')) {
                        thoughtArchive.folders.unshift({ id: 'default', name: '未分类', items: [] });
                    }
                } else if (data.thoughtBubbles) {
                    // 旧版兼容：字符串数组迁移进档案
                    thoughtArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
                    for (const t of data.thoughtBubbles) {
                        if (!t || thoughtArchive.items[t]) continue;
                        thoughtArchive.items[t] = { text: t };
                        thoughtArchive.folders[0].items.push(t);
                    }
                }
                if (data.musicArchive && data.musicArchive.folders) {
                    musicArchive = data.musicArchive;
                    if (!musicArchive.items) musicArchive.items = {};
                    if (!musicArchive.folders.find(f => f.id === 'default')) {
                        musicArchive.folders.unshift({ id: 'default', name: '未分类', items: [] });
                    }
                } else if (data.unlockedMusic) {
                    // 旧版存档兼容：扁平数组迁移为档案
                    musicArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
                    for (const item of data.unlockedMusic) {
                        if (!item || musicArchive.items[item]) continue;
                        musicArchive.items[item] = { name: item };
                        musicArchive.folders[0].items.push(item);
                    }
                }
                ensureDefaultMusic();
                if (data.musicPlayMode === 'random' || data.musicPlayMode === 'loop' || data.musicPlayMode === 'order') {
                    musicPlayMode = data.musicPlayMode;
                }
                if (data.currentMusicName && musicFileMap.has(data.currentMusicName)) {
                    currentMusicName = data.currentMusicName;
                    bgm.src = musicFileMap.get(currentMusicName);
                    bgm.load();
                }
                updateMusicCollectionDisplay();
                _loading = false;
                return true;
            } catch (e) {
                _loading = false;
                console.warn('读取存档失败:', e);
                return false;
            }
        }

        // ---------- 原始清空函数（用于实际执行清空） ----------
        // 跨页面共享的「进度类」localStorage 键。故事播放器等子页面会把进度写在自己的键里
        // （如 spg_story_reviewed_v1 = 已完整播放过的故事），清空主存档时必须一并抹掉，
        // 否则会出现「存档清了、故事却还记得读过」的情况。
        // 注意：纯 UI 偏好不在此列 —— crt_filter_enabled（滤镜开关）、back_btn_pos_v1（按钮位置）保留。
        const CROSS_PROGRESS_PREFIX = 'spg_';

        function clearCrossPageProgress() {
            try {
                for (const key of Object.keys(localStorage)) {
                    if (key.indexOf(CROSS_PROGRESS_PREFIX) === 0) localStorage.removeItem(key);
                }
            } catch (e) { console.warn('清理跨页进度失败:', e); }
        }

        function performClearGameData() {
            localStorage.removeItem(SAVE_KEY);
            clearCrossPageProgress();
            historyRecords.clear();
            archiveState = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
            historyEmpty.style.display = 'inline';
            renderArchive();
            for (const key in dialogueState) dialogueState[key] = 0;
            for (const key in easterEggStages) {
                easterEggStages[key].count = 0;
                easterEggStages[key].triggered.clear();
            }
            thoughtArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
            musicArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };
            ensureDefaultMusic();
            currentMusicName = 'O';
            bgm.src = musicFileMap.get('O');
            bgm.load();
            updateMusicCollectionDisplay();
            resetCustomNames();
            saveCustomNames();
            replyBox.innerHTML = '🗑️ 已清空所有记录（含各页面的阅读进度），角色名字恢复默认。';
            saveGame();
            closeConfirmPopup();

        // ---------- 自定义清空确认弹窗 ----------
        const confirmOverlay = document.getElementById('confirmOverlay');
        const confirmPopup = document.getElementById('confirmPopup');
        const confirmCloseBtn = document.getElementById('confirmCloseBtn');
        const confirmCancel = document.getElementById('confirmCancel');
        const confirmOk = document.getElementById('confirmOk');

        function openConfirmPopup() {

        confirmCloseBtn.addEventListener('click', closeConfirmPopup);

        clearHistoryBtn.removeEventListener('click', clearGameData);

        // ---------- 对话队列 ----------
        const dialogueChains = {
            '你在哪|你在哪里|where': [
                { ask: '你在哪|where', reply: '我就在这里。', next: '这里|here' },
                { ask: '这里|here', reply: '这里就是您的所在。', next: '所在|place' },
                { ask: '所在|place', reply: '别处。', next: null }
            ],
            '加密怎么解？|加密怎么解|加密|解码': [
                { ask: '加密怎么解？|加密怎么解|加密|解码', reply: '提问解码的用具', next: '什么用具|什么|怎么问|用具' },
                { ask: '什么用具|什么|怎么问|用具', reply: '提问是：解码器。', next: null }
            ],
            '凯撒|caesar|凯撒密码|凯撒大帝': [
                { ask: '凯撒|caesar|凯撒密码', reply: '是的，凯撒，凯撒密码。', next: '密码|password|凯撒密码' },
                { ask: '密码|password|凯撒密码', reply: '密码不止一个', next: '告诉我|tellme|不止一个？|不止一个' },
                { ask: '告诉我|tellme|不止一个？|不止一个', reply: '提问是：我该怎么见你', next: null }
            ],
            '密码是什么|密码是啥|whatispassword': [
                { ask: '密码是什么|whatispassword', reply: '密码是：数字。', next: '数字|number' },
                { ask: '数字|number', reply: '数字是答案的所在。', next: '所在|place' },
                { ask: '所在|place', reply: '提问是：凯撒掩码-K0', next: null }
            ],
            '我该怎么见你|怎么见你|howtoseeyou': [
                { ask: '我该怎么见你|howtoseeyou', reply: '您真的想见？', next: '真的|really' },
                { ask: '真的|really', reply: '再为我说一遍吧', next: '真的|really|真的啊' },
                { ask: '真的|really|真的啊', reply: '值得注意的是：2026824948', next: null }
            ],
        };
        const stepAliasMap = {};
        for (const [chainName, steps] of Object.entries(dialogueChains)) {
            stepAliasMap[chainName] = [];
            for (let i = 0; i < steps.length; i++) {
                const askAliases = steps[i].ask.split('|').map(s => s.trim().toLowerCase());
                stepAliasMap[chainName].push({ aliases: askAliases, index: i });
            }
        }
        const dialogueState = {};
        for (const chainName in dialogueChains) dialogueState[chainName] = 0;

        function checkDialogue(input) {
            const lower = input.toLowerCase();
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                if (currentIdx > 0 && currentIdx < steps.length) {
                    const curAliases = stepAliasMap[chainName][currentIdx]?.aliases || [];
                    if (curAliases.includes(lower)) {
                        dialogueState[chainName] = currentIdx + 1;
                        saveGame();
                        return { reply: steps[currentIdx].reply, chainName, stepIndex: currentIdx, isNewChain: false, repeat: false };
                    }
                }
            }
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                if (currentIdx >= steps.length) continue;
                const curAliases = stepAliasMap[chainName][currentIdx]?.aliases || [];
                if (curAliases.includes(lower)) {
                    dialogueState[chainName] = currentIdx + 1;
                    saveGame();
                    return { reply: steps[currentIdx].reply, chainName, stepIndex: currentIdx, isNewChain: (currentIdx === 0), repeat: false };
                }
            }
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                for (let i = currentIdx - 1; i >= 0; i--) {
                    const prevAliases = stepAliasMap[chainName][i]?.aliases || [];
                    if (prevAliases.includes(lower)) {
                        return { reply: steps[i].reply, chainName, stepIndex: i, isNewChain: false, repeat: true };
                    }
                }
            }
            return null;
        }

        // ---------- 思维碎片（可排序 / 分组的档案，UI 见文末「思维档案」模块） ----------
        let thoughtArchive = { folders: [{ id: 'default', name: '未分类', items: [] }], items: {} };

        function addThoughtBubble(text) {
            if (!text || thoughtArchive.items[text]) return;
            thoughtArchive.items[text] = { text: text };
            let def = thoughtArchive.folders.find(f => f.id === 'default');
            if (!def) { def = { id: 'default', name: '未分类', items: [] }; thoughtArchive.folders.push(def); }
            def.items.push(text);
            saveGame();
        }

        // ---------- 漂浮笔记 ----------
        let noteSpeed = 3;
        const noteItems = [];
        speedSlider.addEventListener('input', function() {
            noteSpeed = parseFloat(this.value);
            speedDisplay.textContent = noteSpeed;
        });

        function clearAllNotes() {
            return new Promise(resolve => {
                const items = noteContainer.querySelectorAll('.note-item');
                if (items.length === 0) { resolve(); return; }
                for (const el of items) el.classList.add('scale-out');
                setTimeout(() => {
                    const remaining = noteContainer.querySelectorAll('.note-item');
                    for (const el of remaining) if (el.parentNode) el.parentNode.removeChild(el);
                    noteItems.length = 0;
                    resolve();
                }, 600);
            });
        }

        function spawnNote(text, duration = 15000, groupName) {
            const el = document.createElement('div');
            el.className = 'note-item';
            if (groupName) {
                const tag = document.createElement('div');
                tag.className = 'note-group';
                tag.textContent = '📁 ' + groupName;
                el.appendChild(tag);
            }
            const body = document.createElement('div');
            body.className = 'note-text';
            body.textContent = text;
            el.appendChild(body);
            const maxX = window.innerWidth - 260, maxY = window.innerHeight - 100;
            const x = 20 + Math.random() * (maxX - 40);
            const y = 20 + Math.random() * (maxY - 40);
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            const rot = (Math.random() - 0.5) * 12;
            el.style.setProperty('--rot', rot + 'deg');
            noteContainer.appendChild(el);
            noteItems.push({ el, x, y, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8, rot, angleSpeed: (Math.random() - 0.5) * 0.02, life: duration, born: Date.now() });
            setTimeout(() => {
                el.classList.add('scale-out');
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                    const idx = noteItems.findIndex(n => n.el === el);
                    if (idx !== -1) noteItems.splice(idx, 1);
                }, 600);
            }, duration);
            if (noteItems.length > 25) {
                const oldest = noteItems.shift();
                if (oldest.el.parentNode) oldest.el.parentNode.removeChild(oldest.el);
            }
        }

        function animateNotes() {
            const speedFactor = noteSpeed * 0.15;
            for (const n of noteItems) {
                n.x += n.vx * speedFactor;
                n.y += n.vy * speedFactor;
                const maxX = window.innerWidth - 260, maxY = window.innerHeight - 100;
                if (n.x < 0 || n.x > maxX) n.vx *= -1;
                if (n.y < 0 || n.y > maxY) n.vy *= -1;
                n.x = Math.max(0, Math.min(maxX, n.x));
                n.y = Math.max(0, Math.min(maxY, n.y));
                n.rot += n.angleSpeed * speedFactor * 0.5;
                n.el.style.left = n.x + 'px';
                n.el.style.top = n.y + 'px';
                n.el.style.transform = `rotate(${n.rot}deg)`;
            }
            requestAnimationFrame(animateNotes);
        }
        animateNotes();

        // ---------- 飞行弹窗系统 ----------
        let activePopup = null;

        function getRandomFlightPath() {
            return {
                startX: -60 + Math.random() * 120,
                startY: -80 + Math.random() * 40,
                midX: (Math.random() - 0.5) * 300,
                midY: -120 - Math.random() * 100,
                startRotate: -12 + Math.random() * 24,
                midRotate: 6 + Math.random() * 12,
                endRotate: -2 + Math.random() * 4
            };
        }

        function createFlyPopup(keyword, config, displayName) {
            if (activePopup) closeFlyPopup(activePopup);
            const popup = document.createElement('div');
            popup.className = 'fly-popup';
            popup.dataset.keyword = keyword;
            popup.innerHTML = `
                <button class="popup-close">✕</button>
                <div class="popup-title">✦ 页面碎片 · ${displayName}</div>
                <div class="popup-text">${config.text}</div>
                <button class="popup-btn">${config.buttonText || '继续'}</button>
            `;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const popupWidth = Math.min(380, viewportWidth - 40);
            const popupHeight = 200;
            const centerX = (viewportWidth - popupWidth) / 2;
            const centerY = (viewportHeight - popupHeight) / 2;
            popup.style.left = centerX + 'px';
            popup.style.top = centerY + 'px';
            popup.style.width = popupWidth + 'px';
            popup.style.opacity = '0';
            popup.style.transform = 'scale(0.5) rotate(-10deg)';
            document.body.appendChild(popup);

            const path = getRandomFlightPath();
            popup.style.setProperty('--start-x', path.startX + 'px');
            popup.style.setProperty('--start-y', path.startY + 'px');
            popup.style.setProperty('--start-rotate', path.startRotate + 'deg');
            popup.style.setProperty('--mid-x', path.midX + 'px');
            popup.style.setProperty('--mid-y', path.midY + 'px');
            popup.style.setProperty('--mid-rotate', path.midRotate + 'deg');
            popup.style.setProperty('--end-rotate', path.endRotate + 'deg');

            requestAnimationFrame(() => {
                popup.classList.add('animate-in');
                popup.style.opacity = '1';
            });

            const closeBtn = popup.querySelector('.popup-close');
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeFlyPopup(popup);
            });

            const btn = popup.querySelector('.popup-btn');
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (config.musicName && config.musicFile) {
                    addUnlockedMusic(config.musicName);
                    playSceneMusic(config.musicName);
                }
                if (config.action && typeof config.action === 'function') {
                    config.action(popup);
                } else if (config.url) {
                    window.open(config.url, '_blank');
                    closeFlyPopup(popup);
                } else {
                    closeFlyPopup(popup);
                }
            });

            popup.addEventListener('click', function(e) {
                if (e.target === popup) closeFlyPopup(popup);
            });

            activePopup = popup;
            addHistoryRecord(keyword, displayName);

            setTimeout(() => {
                if (popup && popup.parentNode) closeFlyPopup(popup);
            }, 12000);

            return popup;
        }

        function closeFlyPopup(popup) {
            if (!popup || popup.classList.contains('fade-out')) return;
            popup.classList.remove('animate-in');
            popup.classList.add('fade-out');
            setTimeout(() => {
                if (popup.parentNode) popup.parentNode.removeChild(popup);
                if (activePopup === popup) activePopup = null;
            }, 350);
        }

        // ---------- 思维流淌 ----------
        let bubblingActive = false;
        let bubbleTimer = null;
        let bubbleQueue = [];
        let bubbleIntervalMs = 600;
        bubbleInterval.addEventListener('input', function() {
            bubbleIntervalMs = parseInt(this.value);
            intervalDisplay.textContent = bubbleIntervalMs + 'ms';
        });

        function toggleBubbling() {
            if (bubblingActive) {
                bubblingActive = false;
                if (bubbleTimer) clearTimeout(bubbleTimer);
                bubbleBtn.textContent = '💭 流淌思维';
                bubbleBtn.classList.remove('active');

            }
            if (Object.keys(thoughtArchive.items).length === 0) {
                replyBox.innerHTML = '⚠️ 还没有任何“值得注意的是”的思考碎片，请思考，并且提问。';
                return;
            }
            clearAllNotes().then(() => {
                bubbleQueue = getThoughtOrder();
                bubblingActive = true;
                bubbleBtn.textContent = '⏹️ 停止流淌';
                bubbleBtn.classList.add('active');
                function nextBubble() {
                    if (!bubblingActive || bubbleQueue.length === 0) {
                        if (bubbleQueue.length === 0 && bubblingActive) replyBox.innerHTML = '💭 所有思维碎片已流淌完毕。';
                        bubblingActive = false;
                        bubbleBtn.textContent = '💭 流淌思维';

                    }
                    const text = bubbleQueue.shift();
                    const folder = findThoughtFolder(text);

                    bubbleTimer = setTimeout(nextBubble, bubbleIntervalMs);
                }
                nextBubble();
            });
        }
        bubbleBtn.addEventListener('click', toggleBubbling);

        // ---------- 处理输入 ----------
        function handleUserInput() {
            const rawText = userInput.value.trim();
            if (rawText === '') { replyBox.innerHTML = '📝 请写下您的疑问……'; return; }
            const lowerText = rawText.toLowerCase();

            if (lowerText === '改写') {
                openRewriteModal();
                userInput.value = '';
                userInput.focus();
                return;
            }

            const dialogueResult = checkDialogue(rawText);
            if (dialogueResult !== null) {
                if (dialogueResult.isNewChain && !dialogueResult.repeat) {
                    let hasOtherActive = false;
                    for (const chainName in dialogueChains) {
                        if (chainName !== dialogueResult.chainName && dialogueState[chainName] > 0) {
                            hasOtherActive = true;
                            break;
                        }
                    }
                    if (hasOtherActive) {
                        for (const chainName in dialogueChains) dialogueState[chainName] = 0;
                        dialogueState[dialogueResult.chainName] = 1;
                        saveGame();
                    }
                }
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${dialogueResult.reply}`;
                if (dialogueResult.reply.includes('值得注意的是')) {
                    spawnNote('💭 ' + dialogueResult.reply, 15000);
                    addThoughtBubble(dialogueResult.reply);
                    saveGame();
                }
                userInput.value = ''; userInput.focus(); return;
            }

            let hasActive = false;
            for (const chainName in dialogueChains) {
                if (dialogueState[chainName] > 0) { hasActive = true; break; }
            }
            if (hasActive) {
                for (const chainName in dialogueChains) dialogueState[chainName] = 0;
                saveGame();
            }

            let matchedKey = null;
            let normalReply = null;
            for (const [key, value] of Object.entries(flatResponses)) {
                if (lowerText === key.toLowerCase()) {
                    matchedKey = key;
                    normalReply = value;
                    break;
                }
            }
            if (matchedKey) {
                let eggKey = eggAliasMap[lowerText] || null;
                let eggReply = null, triggeredThisTime = false;
                if (eggKey && easterEggStages.hasOwnProperty(eggKey)) {
                    const egg = easterEggStages[eggKey];
                    if (egg.triggered.size === egg.stages.length) { egg.count = 0; egg.triggered.clear(); }
                    egg.count += 1;
                    const sortedStages = [...egg.stages].sort((a, b) => a.at - b.at);
                    for (const stage of sortedStages) {
                        if (egg.count >= stage.at && !egg.triggered.has(stage.at)) {
                            eggReply = stage.reply;
                            egg.triggered.add(stage.at);
                            triggeredThisTime = true;
                            saveGame();
                            break;
                        }
                    }
                }
                const finalReply = triggeredThisTime && eggReply ? eggReply : normalReply;
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${finalReply}`;
                if (finalReply.includes('值得注意的是')) {
                    spawnNote('💭 ' + finalReply, 15000);
                    addThoughtBubble(finalReply);
                    saveGame();
                }

        function loadCustomNames() {

            if (saved) {
                try {
                    const names = JSON.parse(saved);
                    if (Array.isArray(names) && names.length === DEFAULT_CHARACTERS.length) {
                        const fixedNames = names.map((name, index) => {
                            if (typeof name !== 'string' ||
                                name.includes('�') ||

                            }
                            return name;

                        currentCharacters = DEFAULT_CHARACTERS.map((def, i) => ({
                            id: def.id,
                            name: fixedNames[i] || def.name,
                            color: def.color
                        }));
                        // 如果数据被修复了，自动保存干净数据
                        if (JSON.stringify(fixedNames) !== JSON.stringify(names)) {
                            localStorage.setItem(REWRITE_KEY, JSON.stringify(fixedNames));
                        }
                        return;

                } catch (e) {}
            }

        // 🔧 修复：保存前验证，防止写入乱码
        function saveCustomNames() {

                    c.name.includes('�') ||
                    c.name.includes('?') ||
                    c.name.trim() === '') {
                    return DEFAULT_CHARACTERS[index].name;
                }
                return c.name;

        function addArchiveItem(keyword, displayName) {
            if (!keyword) return;
            if (archiveState.items[keyword]) return;
            archiveState.items[keyword] = { keyword: keyword, displayName: displayName || keyword };
            let def = archiveState.folders.find(f => f.id === 'default');

        function findFolderOf(keyword) {

        function moveItem(keyword, targetFolderId, beforeKeyword) {
            const src = findFolderOf(keyword);
            if (!src) return;
            src.items = src.items.filter(k => k !== keyword);
            const tgt = archiveState.folders.find(f => f.id === targetFolderId);
            if (!tgt) return;
            let idx = tgt.items.length;
            if (beforeKeyword != null) {
                const bi = tgt.items.indexOf(beforeKeyword);
                if (bi >= 0) idx = bi;
            }
            tgt.items.splice(idx, 0, keyword);
        }

        function copyCode(keyword) {
            const done = () => showCopyToast('📋 已复制：' + keyword);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(keyword).then(done).catch(() => fallbackCopy(keyword, done));
            } else {
                fallbackCopy(keyword, done);

        }
        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(ta);

        function getDragAfterElement(container, y) {
            const els = Array.from(container.querySelectorAll('.archive-item:not(.dragging)'));
            let closest = null, closestOffset = -Infinity;
            for (const el of els) {
                const box = el.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = el; }
            }
            return closest;
        }

        function buildArchiveItem(item) {

            copy.dataset.keyword = item.keyword;

                openUnlockedPage(item.keyword, item.displayName || item.keyword);

            el.addEventListener('dragstart', () => { dragKeyword = item.keyword; el.classList.add('dragging'); });

        // 档案窗口拖拽（标题栏拖动位置）
        (function makeArchiveDraggable() {
            const title = document.getElementById('archiveTitle');
            let dragging = false, offX = 0, offY = 0;
            title.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                dragging = true;
                const rect = archiveWindow.getBoundingClientRect();
                // 拖拽前先把居中 transform 去掉，用实际像素 left/top 固定当前位置，避免闪烁
                archiveWindow.style.transform = 'none';
                archiveWindow.style.right = 'auto';
                archiveWindow.style.left = rect.left + 'px';
                archiveWindow.style.top = rect.top + 'px';
                offX = e.clientX - rect.left; offY = e.clientY - rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                e.preventDefault();
            });
            function onMove(e) {
                if (!dragging) return;
                let x = e.clientX - offX, y = e.clientY - offY;
                x = Math.max(0, Math.min(window.innerWidth - archiveWindow.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - 40, y));
                archiveWindow.style.left = x + 'px';
                archiveWindow.style.top = y + 'px';
            }
            function onUp() { dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        })();

        console.log('🗂️ 页面档案已就绪（可拖拽 / 新建目录 / 编码复制）。');

        // =================================================================
        //  🧠 思维档案（与页面档案同款交互：可拖拽排序 / 分组，但没有复制功能）
        // =================================================================
        const thoughtOpenBtn = document.getElementById('thoughtOpenBtn');
        const thoughtWindow = document.getElementById('thoughtWindow');
        const thoughtCloseBtn = document.getElementById('thoughtCloseBtn');
        const thoughtBody = document.getElementById('thoughtBody');
        const thoughtNewFolder = document.getElementById('thoughtNewFolder');
        let dragThought = null;

        // 按玩家定义的分组顺序，把所有思维拍平成一个数组（供「流淌思维」使用）
        function getThoughtOrder() {
            const arr = [];
            for (const folder of thoughtArchive.folders) {
                for (const kid of folder.items) {
                    const it = thoughtArchive.items[kid];
                    if (it) arr.push(it.text);
                }
            }
            return arr;
        }

        function findThoughtFolder(text) {
            return thoughtArchive.folders.find(f => f.items.includes(text));
        }
        function moveThought(text, targetFolderId, beforeText) {
            const src = findThoughtFolder(text);
            if (!src) return;
            src.items = src.items.filter(k => k !== text);
            const tgt = thoughtArchive.folders.find(f => f.id === targetFolderId);
            if (!tgt) return;
            let idx = tgt.items.length;
            if (beforeText != null) {
                const bi = tgt.items.indexOf(beforeText);
                if (bi >= 0) idx = bi;
            }
            tgt.items.splice(idx, 0, text);
        }

        function buildThoughtItem(item) {
            const el = document.createElement('div');
            el.className = 'archive-item';
            el.draggable = true;
            el.dataset.keyword = item.text;   // 供 getDragAfterElement 识别落点

            const handle = document.createElement('span');
            handle.className = 'item-drag'; handle.textContent = '⋮⋮';
            const name = document.createElement('span');
            name.className = 'item-name'; name.textContent = item.text;

            el.appendChild(handle); el.appendChild(name);

            el.addEventListener('dragstart', () => { dragThought = item.text; el.classList.add('dragging'); });
            el.addEventListener('dragend', () => { dragThought = null; el.classList.remove('dragging'); });
            return el;
        }

        function renderThoughtArchive() {
            thoughtBody.innerHTML = '';
            if (!thoughtArchive.folders.length) {
                const empty = document.createElement('div');
                empty.className = 'archive-empty';
                empty.textContent = '暂无思维碎片，触发“值得注意的是”后会出现在这里';
                thoughtBody.appendChild(empty);
                return;
            }
            for (const folder of thoughtArchive.folders) {
                const fEl = document.createElement('div');
                fEl.className = 'archive-folder';

                const head = document.createElement('div');
                head.className = 'folder-head';
                const nameEl = document.createElement('span');
                nameEl.className = 'folder-name'; nameEl.textContent = folder.name;
                const actions = document.createElement('div');
                actions.className = 'folder-actions';
                const renameBtn = document.createElement('button');
                renameBtn.className = 'folder-rename'; renameBtn.textContent = '✎'; renameBtn.title = '重命名分组';
                const delBtn = document.createElement('button');
                delBtn.className = 'folder-del'; delBtn.textContent = '🗑'; delBtn.title = '删除分组';
                actions.appendChild(renameBtn); actions.appendChild(delBtn);
                head.appendChild(nameEl); head.appendChild(actions);

                const list = document.createElement('div');
                list.className = 'folder-items';
                list.dataset.folderId = folder.id;

                if (!folder.items.length) {
                    const ph = document.createElement('div');
                    ph.className = 'folder-placeholder';
                    ph.textContent = '拖拽思维到此处';
                    list.appendChild(ph);
                }
                for (const kid of folder.items) {
                    const item = thoughtArchive.items[kid];
                    if (!item) continue;
                    list.appendChild(buildThoughtItem(item));
                }

                list.addEventListener('dragover', (e) => { e.preventDefault(); list.classList.add('drop-target'); });
                list.addEventListener('dragleave', () => list.classList.remove('drop-target'));
                list.addEventListener('drop', (e) => {
                    e.preventDefault();
                    list.classList.remove('drop-target');
                    if (!dragThought) return;
                    const after = getDragAfterElement(list, e.clientY);
                    const before = after ? after.dataset.keyword : null;
                    moveThought(dragThought, folder.id, before);
                    renderThoughtArchive(); saveGame();
                });

                renameBtn.addEventListener('click', () => {
                    showNameModal('重命名分组', folder.name, (name) => {
                        folder.name = name; renderThoughtArchive(); saveGame();
                    });
                });
                delBtn.addEventListener('click', () => {
                    if (folder.id === 'default') { showAlertModal('无法删除', '默认分组「未分类」不可删除。'); return; }
                    showConfirmModal('删除分组', '删除分组「' + folder.name + '」？其中的思维将移回「未分类」。', () => {
                        const def = thoughtArchive.folders.find(f => f.id === 'default') || thoughtArchive.folders[0];
                        for (const kid of folder.items) def.items.push(kid);
                        thoughtArchive.folders = thoughtArchive.folders.filter(f => f.id !== folder.id);
                        renderThoughtArchive(); saveGame();
                    });
                });

                fEl.appendChild(head); fEl.appendChild(list);
                thoughtBody.appendChild(fEl);
            }
        }

        function openThoughtArchive() { thoughtWindow.classList.add('open'); renderThoughtArchive(); }
        function closeThoughtArchive() { thoughtWindow.classList.remove('open'); }

        thoughtOpenBtn.addEventListener('click', openThoughtArchive);
        thoughtCloseBtn.addEventListener('click', closeThoughtArchive);
        thoughtNewFolder.addEventListener('click', () => {
            showNameModal('新建分组', '新分组', (name) => {
                thoughtArchive.folders.push({ id: 'f' + Date.now(), name: name, items: [] });
                renderThoughtArchive(); saveGame();
            });
        });

        // 思维窗口拖拽（标题栏拖动位置，复用与档案窗口一致的居中逻辑）
        (function makeThoughtDraggable() {
            const title = document.getElementById('thoughtTitle');
            let dragging = false, offX = 0, offY = 0;
            title.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                dragging = true;
                const rect = thoughtWindow.getBoundingClientRect();
                thoughtWindow.style.transform = 'none';
                thoughtWindow.style.right = 'auto';
                thoughtWindow.style.left = rect.left + 'px';
                thoughtWindow.style.top = rect.top + 'px';
                offX = e.clientX - rect.left; offY = e.clientY - rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                e.preventDefault();
            });
            function onMove(e) {
                if (!dragging) return;
                let x = e.clientX - offX, y = e.clientY - offY;
                x = Math.max(0, Math.min(window.innerWidth - thoughtWindow.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - 40, y));
                thoughtWindow.style.left = x + 'px';
                thoughtWindow.style.top = y + 'px';
            }
            function onUp() { dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        })();

        console.log('🧠 思维档案已就绪（可拖拽排序 / 分组，无复制）。');

        // =================================================================
        //  🎵 音乐收藏窗口（唱片旋转 / 进度拖拽 / 播放模式 / 分组排序 / 切换提示）
        // =================================================================
        const musicWindow = document.getElementById('musicWindow');
        const musicTitle = document.getElementById('musicTitle');
        const musicCloseBtn = document.getElementById('musicCloseBtn');
        const musicNewFolder = document.getElementById('musicNewFolder');
        const musicSeek = document.getElementById('musicSeek');
        const musicToastEl = document.getElementById('musicToast');
        const musicPlayPauseBtn = document.getElementById('musicPlayPauseBtn');
        let dragMusic = null;

        function updateVinyl() {
            const v = document.getElementById('vinyl');
            if (v) v.classList.toggle('paused', !isMusicPlaying);
        }

        let toastTimer = null;
        function showNowToast(name) {
            if (!musicToastEl) return;
            const folder = findMusicFolder(name);
            const groupLabel = folder ? folder.name : '未分类';
            musicToastEl.textContent = '🎵 当前播放音乐：' + name + '　　📁 ' + groupLabel;
            musicToastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => musicToastEl.classList.remove('show'), 2600);
        }

        function syncModeButtons() {
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === musicPlayMode);
            });
        }

        function findMusicFolder(name) {
            return musicArchive.folders.find(f => f.items.includes(name));
        }
        function moveMusic(name, targetFolderId, beforeName) {
            const src = findMusicFolder(name);
            if (!src) return;
            src.items = src.items.filter(k => k !== name);
            const tgt = musicArchive.folders.find(f => f.id === targetFolderId);
            if (!tgt) return;
            let idx = tgt.items.length;
            if (beforeName != null) { const bi = tgt.items.indexOf(beforeName); if (bi >= 0) idx = bi; }
            tgt.items.splice(idx, 0, name);
        }

        function renderMusicArchive() {
            const list = document.getElementById('musicCollectionList');
            if (!list) return;
            list.innerHTML = '';
            if (!musicArchive.folders.length) {
                const empty = document.createElement('div');
                empty.className = 'music-empty';
                empty.textContent = '暂无音乐，触发对应剧情后会自动收藏';
                list.appendChild(empty);
                return;
            }
            for (const folder of musicArchive.folders) {
                const fEl = document.createElement('div');
                fEl.className = 'archive-folder';
                const head = document.createElement('div');
                head.className = 'folder-head';
                const nameEl = document.createElement('span');
                nameEl.className = 'folder-name'; nameEl.textContent = folder.name;
                const actions = document.createElement('div');
                actions.className = 'folder-actions';
                const renameBtn = document.createElement('button');
                renameBtn.className = 'folder-rename'; renameBtn.textContent = '✎'; renameBtn.title = '重命名分组';
                const delBtn = document.createElement('button');
                delBtn.className = 'folder-del'; delBtn.textContent = '🗑'; delBtn.title = '删除分组';
                actions.appendChild(renameBtn); actions.appendChild(delBtn);
                head.appendChild(nameEl); head.appendChild(actions);

                const flist = document.createElement('div');
                flist.className = 'folder-items';
                flist.dataset.folderId = folder.id;

                if (!folder.items.length) {
                    const ph = document.createElement('div');
                    ph.className = 'folder-placeholder'; ph.textContent = '拖拽音乐到此处';
                    flist.appendChild(ph);
                }
                for (const kid of folder.items) {
                    const item = musicArchive.items[kid];
                    if (!item) continue;
                    const el = document.createElement('div');
                    el.className = 'archive-item';
                    el.draggable = true;
                    el.dataset.keyword = item.name;
                    const handle = document.createElement('span');
                    handle.className = 'item-drag'; handle.textContent = '⋮⋮';
                    const nm = document.createElement('span');
                    nm.className = 'item-name'; nm.textContent = item.name;
                    el.appendChild(handle); el.appendChild(nm);
                    if (item.name === currentMusicName) {
                        el.classList.add('playing');
                        const pl = document.createElement('span');
                        pl.className = 'item-playing'; pl.textContent = '♪';
                        el.appendChild(pl);
                    }
                    el.addEventListener('click', () => playMusic(item.name));
                    el.addEventListener('dragstart', () => { dragMusic = item.name; el.classList.add('dragging'); });
                    el.addEventListener('dragend', () => { dragMusic = null; el.classList.remove('dragging'); });
                    flist.appendChild(el);
                }

                flist.addEventListener('dragover', (e) => { e.preventDefault(); flist.classList.add('drop-target'); });
                flist.addEventListener('dragleave', () => flist.classList.remove('drop-target'));
                flist.addEventListener('drop', (e) => {
                    e.preventDefault(); flist.classList.remove('drop-target');
                    if (!dragMusic) return;
                    const after = getDragAfterElement(flist, e.clientY);
                    const before = after ? after.dataset.keyword : null;
                    moveMusic(dragMusic, folder.id, before);
                    renderMusicArchive(); saveGame();
                });

                renameBtn.addEventListener('click', () => {
                    showNameModal('重命名分组', folder.name, (name) => {
                        folder.name = name; renderMusicArchive(); saveGame();
                    });
                });
                delBtn.addEventListener('click', () => {
                    if (folder.id === 'default') { showAlertModal('无法删除', '默认分组「未分类」不可删除。'); return; }
                    showConfirmModal('删除分组', '删除分组「' + folder.name + '」？其中的音乐将移回「未分类」。', () => {
                        const def = musicArchive.folders.find(f => f.id === 'default') || musicArchive.folders[0];
                        for (const kid of folder.items) def.items.push(kid);
                        musicArchive.folders = musicArchive.folders.filter(f => f.id !== folder.id);
                        renderMusicArchive(); saveGame();
                    });
                });

                fEl.appendChild(head); fEl.appendChild(flist);
                list.appendChild(fEl);
            }
        }

        function openMusicWindow() { musicWindow.classList.add('open'); renderMusicArchive(); updateMusicCollectionDisplay(); syncModeButtons(); }
        function closeMusicWindow() { musicWindow.classList.remove('open'); }
        musicCollectionBtn.addEventListener('click', () => {
            if (musicWindow.classList.contains('open')) closeMusicWindow(); else openMusicWindow();
        });
        musicCloseBtn.addEventListener('click', closeMusicWindow);

        // 音乐窗口内的播放/暂停按钮
        musicPlayPauseBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
                updateMusicButton();
                updateVinyl();
            } else {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicButton();
                    updateVinyl();
                }).catch(() => {});
            }
        });

        // 窗口拖拽（标题栏拖动位置，居中定位改成 fixed left/top）
        (function makeMusicDraggable() {
            let dragging = false, offX = 0, offY = 0;
            musicTitle.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                dragging = true;
                const rect = musicWindow.getBoundingClientRect();
                musicWindow.style.transform = 'none';
                musicWindow.style.right = 'auto';
                musicWindow.style.left = rect.left + 'px';
                musicWindow.style.top = rect.top + 'px';
                offX = e.clientX - rect.left; offY = e.clientY - rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                e.preventDefault();
            });
            function onMove(e) {
                if (!dragging) return;
                let x = e.clientX - offX, y = e.clientY - offY;
                x = Math.max(0, Math.min(window.innerWidth - musicWindow.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - 40, y));
                musicWindow.style.left = x + 'px';
                musicWindow.style.top = y + 'px';
            }
            function onUp() { dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        })();

        // 播放模式：顺序 / 随机 / 单曲循环
        document.querySelectorAll('.mode-btn').forEach(b => {
            b.addEventListener('click', () => {
                musicPlayMode = b.dataset.mode;
                bgm.loop = (musicPlayMode === 'loop');
                syncModeButtons(); saveGame();
            });
        });

        // 新建分组
        musicNewFolder.addEventListener('click', () => {
            showNameModal('新建分组', '新分组', (name) => {
                musicArchive.folders.push({ id: 'f' + Date.now(), name: name, items: [] });
                renderMusicArchive(); saveGame();
            });
        });

        // 进度条拖拽
        function fmtTime(t) {
            if (!isFinite(t) || t < 0) t = 0;
            t = Math.floor(t);
            const m = Math.floor(t / 60), s = t % 60;
            return m + ':' + (s < 10 ? '0' + s : s);
        }
        let seeking = false;
        bgm.addEventListener('loadedmetadata', () => {
            musicSeek.max = bgm.duration || 0;
            const dt = document.getElementById('durTime');
            if (dt) dt.textContent = fmtTime(bgm.duration);
        });
        bgm.addEventListener('timeupdate', () => {
            if (!seeking) musicSeek.value = bgm.currentTime || 0;
            const ct = document.getElementById('curTime');
            if (ct) ct.textContent = fmtTime(bgm.currentTime);
        });
        musicSeek.addEventListener('input', () => {
            bgm.currentTime = parseFloat(musicSeek.value) || 0;
            const ct = document.getElementById('curTime');
            if (ct) ct.textContent = fmtTime(bgm.currentTime);
        });
        musicSeek.addEventListener('mousedown', () => seeking = true);
        musicSeek.addEventListener('mouseup', () => seeking = false);
        musicSeek.addEventListener('touchstart', () => seeking = true, { passive: true });
        musicSeek.addEventListener('touchend', () => seeking = false);

        console.log('🎵 音乐收藏已就绪（唱片旋转 / 进度拖拽 / 顺序·随机·单曲 / 分组排序 / 切换提示）。');
    </script>
</body>
</html>
