            if (!src) return;
            src.items = (src.items || []).filter(k => k !== keyword);
            const tgt = findFolderDeep(archiveState.folders, targetFolderId);   // 递归找， nested 分组也能放
            if (!tgt) return;
            if (!Array.isArray(tgt.items)) tgt.items = [];
            let idx = tgt.items.length;
            if (beforeKeyword != null) {
                const bi = tgt.items.indexOf(beforeKeyword);
                if (bi >= 0) idx = bi;
            }
            tgt.items.splice(idx, 0, keyword);
        }

        function openUnlockedPage(keyword, displayName) {
            let config = null;
            for (const [key, cfg] of Object.entries(popupConfig)) {
                const aliases = key.split('|').map(s => s.trim());
                if (aliases.includes(displayName) || key === displayName) { config = cfg; break; }
            }
            if (config && config.musicName && config.musicFile) {
                addUnlockedMusic(config.musicName);
                playSceneMusic(config.musicName);
            }
            if (activePopup) closeFlyPopup(activePopup);
            if (config && config.url) {
                window.open(config.url, '_blank');
            } else {
                replyBox.innerHTML = `📖 已解锁页面：${displayName}\n\n（尚未关联新网页）`;
            }
        }

        function copyCode(keyword) {
            const done = () => showCopyToast('📋 已复制：' + keyword);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(keyword).then(done).catch(() => fallbackCopy(keyword, done));
            } else {
                fallbackCopy(keyword, done);
            }
        }
        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(ta);
        }
        let copyToastTimer = null;
        function showCopyToast(msg) {
            let t = document.getElementById('copyToast');
            if (!t) { t = document.createElement('div'); t.id = 'copyToast'; t.className = 'copy-toast'; document.body.appendChild(t); }
            t.textContent = msg; t.classList.add('show');
            clearTimeout(copyToastTimer);
            copyToastTimer = setTimeout(() => t.classList.remove('show'), 1400);
        }

        function getDragAfterElement(container, y) {
            // 只看这一层的直接子条目：嵌套分组里可不能把子分组内部的条目当成落点
            const els = Array.from(container.querySelectorAll(':scope > .archive-item:not(.dragging)'));
            let closest = null, closestOffset = -Infinity;
            for (const el of els) {
                const box = el.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = el; }
            }
            return closest;
        }

        // ---------- 分组（文件夹）通用能力 ----------
        // 页面档案 / 思维档案 / 音乐收藏三个窗口共用 .archive-folder 结构，所以做成通用函数，三处复用。
        // · 折叠状态存在 folder.open（undefined 或 true = 展开，false = 收起），随存档一起持久化。
        // · folder.folders = 子文件夹，支持无限嵌套；老存档没有这个字段，ensureKids() 读的时候顺手补上。
        let dragFolderEl = null;

        // 「未分类」的 id —— 它是兜底目录，永远待在最外层：
        // 既不能被拖进别的分组，删任何分组也不会把它连带删掉（条目因此永远丢不了）。
        const DEFAULT_FOLDER_ID = 'default';

        function isFolderOpen(folder) { return folder.open !== false; }

        // 子文件夹数组（老存档没有这个字段 -> 补成空数组，不需要做数据迁移）
        function ensureKids(folder) {
            if (!Array.isArray(folder.folders)) folder.folders = [];
            if (!Array.isArray(folder.items)) folder.items = [];
            return folder.folders;
        }

        // 存档读进来后把整棵树整理一遍，避免旧数据缺 items / folders 字段
        function normalizeFolders(list) {
            if (!Array.isArray(list)) return list;
            hoistFolderToRoot(list, DEFAULT_FOLDER_ID);   // 嵌套了的「未分类」读档时自动提回最外层
            mergeDuplicateDefault(list);                   // 老存档可能留下重复的「未分类」，合并成一个
            hoistFolderToRoot(list, DEFAULT_FOLDER_ID);
            for (const f of list) { ensureKids(f); normalizeFolders(f.folders); }
            return list;
        }

        // 在整棵树里找某个文件夹所在的「数组」，返回的是原数组引用 -> splice 能直接写回数据
        function findFolderSlot(list, id) {
            const index = list.findIndex(f => f.id === id);
            if (index >= 0) return { list: list, index: index };
            for (const f of list) {
                const kids = ensureKids(f);
                if (!kids.length) continue;
                const hit = findFolderSlot(kids, id);
                if (hit) return hit;
            }
            return null;
        }

        function findFolderDeep(list, id) {
            const slot = findFolderSlot(list, id);
            return slot ? slot.list[slot.index] : null;
        }

        // 把某个分组（通常是「未分类」）整棵提回最外层。
        // 用于：① 老存档/误操作把它嵌套了，读档时扶正；② 删分组前先把它从待删子树里抢救出来。
        function hoistFolderToRoot(root, id) {
            const slot = findFolderSlot(root, id);
            if (!slot || slot.list === root) return false;
            const obj = slot.list[slot.index];
            slot.list.splice(slot.index, 1);
            root.unshift(obj);
            return true;
        }

        // 按对象引用定位（而不是按 id）—— 处理重复 id 时才不会删错
        function findSlotByRef(list, obj) {
            const index = list.indexOf(obj);
            if (index >= 0) return { list: list, index: index };
            for (const f of list) {
                const hit = findSlotByRef(ensureKids(f), obj);
                if (hit) return hit;
            }
            return null;
        }

        // 历史存档可能留下多个「未分类」（嵌套 + 根层各一个）。整棵树只保留一个，
        // 其余的条目和子分组并进保留的那个里，再删掉——条目绝不会丢，也不会重复出现。
        function mergeDuplicateDefault(root) {
            const hits = [];
            (function walk(list) {
                for (const f of list) {
                    if (f.id === DEFAULT_FOLDER_ID) hits.push(f);
                    walk(ensureKids(f));
                }
            })(root);
            if (hits.length <= 1) return false;
            const keep = hits[0];
            ensureKids(keep);
            for (let i = 1; i < hits.length; i++) {
                const extra = hits[i];
                for (const key of collectFolderItems(extra, [])) {
                    if (!keep.items.includes(key)) keep.items.push(key);
                }
                for (const sub of ensureKids(extra)) keep.folders.push(sub);
                const slot = findSlotByRef(root, extra);
                if (slot) slot.list.splice(slot.index, 1);
            }
            return true;
        }

        // 找到装着某个条目的那个文件夹（递归整棵树）
        function findOwnerFolder(list, key) {
            for (const f of list) {
                if ((f.items || []).includes(key)) return f;
                const hit = findOwnerFolder(ensureKids(f), key);
                if (hit) return hit;
            }
            return null;
        }

        // 递归收集一棵子树里的全部条目 key（删除文件夹时把内容抢救回「未分类」用）
        function collectFolderItems(folder, out) {
            for (const kid of (folder.items || [])) out.push(kid);
            for (const sub of ensureKids(folder)) collectFolderItems(sub, out);
            return out;
        }

        // 把一个文件夹挪到另一个文件夹里；parentId = null 表示挪回根层。返回是否真的动了
        function moveFolderTo(root, folderId, parentId, beforeId) {
            if (!folderId || folderId === parentId) return false;
            // 「未分类」只能待在最外层（根层排序没问题，塞进别的分组不行）
            if (folderId === DEFAULT_FOLDER_ID && parentId) return false;
            let targetList = root;
            if (parentId) {
                const parent = findFolderDeep(root, parentId);
                if (!parent) return false;
                // 目标位置在自己的子树里 -> 会形成环，拒绝
                if (parent.id === folderId || findFolderSlot(ensureKids(parent), folderId)) return false;
                targetList = ensureKids(parent);
            }
            const slot = findFolderSlot(root, folderId);
            if (!slot) return false;
            const obj = slot.list[slot.index];
            slot.list.splice(slot.index, 1);
            let idx = beforeId ? targetList.findIndex(f => f.id === beforeId) : -1;
            if (idx >= 0) targetList.splice(idx, 0, obj); else targetList.push(obj);
            return true;
        }

        function getFolderAfterElement(container, y) {
            const els = Array.from(container.querySelectorAll(':scope > .archive-folder:not(.folder-dragging)'));
            let closest = null, closestOffset = -Infinity;
            for (const el of els) {
                const box = el.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = el; }
            }
            return closest;
        }

        // 给单个文件夹挂上：折叠箭头、标题栏拖拽移动、把条目/文件夹拖到标题栏上就能塞进去
        // ctx = { getRoot(), getDraggingItem(), moveItemToFolder(kid, folderId, beforeKey), rerender(), save() }
        function enhanceFolder(fEl, head, folder, ctx) {
            fEl.dataset.folderId = folder.id;

            const arrow = document.createElement('span');
            arrow.className = 'folder-arrow';
            arrow.textContent = isFolderOpen(folder) ? '▾' : '▸';
            head.insertBefore(arrow, head.firstChild);
            head.title = '点击折叠/展开 · 按住拖动可移动分组';
            if (!isFolderOpen(folder)) fEl.classList.add('collapsed');

            head.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                folder.open = !isFolderOpen(folder);
                ctx.rerender(); ctx.save();
            });

            head.draggable = true;
            // 点新建/重命名/删除按钮时不能被 HTML5 拖拽吃掉 click
            head.addEventListener('mousedown', (e) => { head.draggable = !e.target.closest('button'); });
            head.addEventListener('dragstart', (e) => {
                dragFolderEl = fEl;
                fEl.classList.add('folder-dragging');
                try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', folder.id); } catch (err) {}
            });
            head.addEventListener('dragend', () => {
                dragFolderEl = null;
                fEl.classList.remove('folder-dragging');
            });

            head.addEventListener('dragover', (e) => {
                const el = dragFolderEl;
                if (el) {
                    // 拖到自己或自己的子树里没有意义，直接不放
                    if (el === fEl || el.contains(fEl)) return;
                    e.preventDefault(); e.stopPropagation();
                    head.classList.add('drop-target');
                    return;
                }
                if (!ctx.getDraggingItem()) return;
                e.preventDefault();
                head.classList.add('drop-target');
            });
            head.addEventListener('dragleave', () => head.classList.remove('drop-target'));
            head.addEventListener('drop', (e) => {
                head.classList.remove('drop-target');
                const el = dragFolderEl;
                if (el) {
                    if (el === fEl || el.contains(fEl)) return;
                    e.preventDefault(); e.stopPropagation();
                    dragFolderEl = null;
                    if (moveFolderTo(ctx.getRoot(), el.dataset.folderId, folder.id, null)) folder.open = true;
                    else if (el.dataset.folderId === DEFAULT_FOLDER_ID) {
                        showAlertModal('无法移动', '「未分类」是兜底目录，只能待在最外层。');
                    }
                    ctx.rerender(); ctx.save();
                    return;
                }
                const kid = ctx.getDraggingItem();
                if (!kid) return;
                e.preventDefault(); e.stopPropagation();
                ctx.moveItemToFolder(kid, folder.id, null);
                folder.open = true;               // 落到收起的分组里，顺手帮它展开
                ctx.rerender(); ctx.save();
            });
        }

        // 容器层统一入口：既管「条目拖进来 / 排序」，也管「文件夹拖进来 / 同层排序」
        // ctx 在 cfg 的基础上传 parentId（null = 根层）和 getList()（这个容器对应的那层数组）
        function enableFolderDrop(container, ctx) {
            if (!container) return;
            const directFolders = () => Array.from(container.querySelectorAll(':scope > .archive-folder'));

            container.addEventListener('dragover', (e) => {
                const el = dragFolderEl;
                if (el) {
                    // 目标容器在自己身上或自己的子树里 -> 不允许（el.contains 已含 el === container）
                    if (el.contains(container)) return;
                    e.preventDefault();
                    if (el.parentElement !== container) return;   // 跨层：允许落下，但不做实时重排
                    e.stopPropagation();
                    const after = getFolderAfterElement(container, e.clientY);
                    if (after) { if (after !== el.nextElementSibling) container.insertBefore(el, after); }
                    else if (container.lastElementChild !== el) container.appendChild(el);
                    return;
                }
                if (!ctx.getDraggingItem()) return;
                e.preventDefault(); e.stopPropagation();
                container.classList.add('drop-target');
            });
            container.addEventListener('dragleave', (e) => {
                if (e.relatedTarget && container.contains(e.relatedTarget)) return;
                container.classList.remove('drop-target');
            });
            container.addEventListener('drop', (e) => {
                container.classList.remove('drop-target');
                const el = dragFolderEl;
                if (el) {
                    if (el.contains(container)) return;
                    e.preventDefault(); e.stopPropagation();
                    dragFolderEl = null;
                    if (el.parentElement === container) {
                        // 同层排序：dragover 时 DOM 已是最终顺序，按 DOM 顺序写回数据即可
                        const ids = directFolders().map(x => x.dataset.folderId);
                        const list = ctx.getList();
                        list.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
                    } else {
                        // 跨层：把拖着的文件夹放进这个容器
                        const after = getFolderAfterElement(container, e.clientY);
                        const ok = moveFolderTo(ctx.getRoot(), el.dataset.folderId, ctx.parentId, after ? after.dataset.folderId : null);
                        const p = ctx.parentId ? findFolderDeep(ctx.getRoot(), ctx.parentId) : null;
                        if (p && ok) p.open = true;
                        if (!ok && el.dataset.folderId === DEFAULT_FOLDER_ID && ctx.parentId) {
                            showAlertModal('无法移动', '「未分类」是兜底目录，只能待在最外层。');
                        }
                    }
                    ctx.rerender(); ctx.save();
                    return;
                }
                const kid = ctx.getDraggingItem();
                if (!kid) return;
                e.preventDefault(); e.stopPropagation();
                const after = getDragAfterElement(container, e.clientY);
                ctx.moveItemToFolder(kid, ctx.parentId, after ? after.dataset.keyword : null);
                ctx.rerender(); ctx.save();
            });
        }

        // 递归渲染整棵分组树。cfg 提供三个档案各自的差异部分：
        // cfg = { getRoot, getDraggingItem, moveItemToFolder, getItem, buildItem, getDefault,
        //         placeholder, renameTitle, newChildTitle, delConfirm(folder), rerender, save }
        function renderFolderTree(container, rootList, cfg) {
            const withSlot = (parentId, getList) => {
                const c = { parentId: parentId, getList: getList };
                for (const k in cfg) c[k] = cfg[k];
                return c;
            };
            const build = (folder) => {
                ensureKids(folder);
                const fEl = document.createElement('div');
                fEl.className = 'archive-folder';
                fEl.dataset.folderId = folder.id;

                const head = document.createElement('div');
                head.className = 'folder-head';
                const nameEl = document.createElement('span');
                nameEl.className = 'folder-name'; nameEl.textContent = folder.name;
                const actions = document.createElement('div');
                actions.className = 'folder-actions';
                const addBtn = document.createElement('button');
                addBtn.className = 'folder-add'; addBtn.textContent = '＋'; addBtn.title = '在这个分组里新建子分组';
                const renameBtn = document.createElement('button');
                renameBtn.className = 'folder-rename'; renameBtn.textContent = '✎'; renameBtn.title = '重命名';
                const delBtn = document.createElement('button');
                delBtn.className = 'folder-del'; delBtn.textContent = '🗑'; delBtn.title = '删除分组';
                actions.appendChild(addBtn); actions.appendChild(renameBtn); actions.appendChild(delBtn);
                head.appendChild(nameEl); head.appendChild(actions);

                const list = document.createElement('div');
                list.className = 'folder-items';
                list.dataset.folderId = folder.id;

                let hasChild = false;
                for (const kid of folder.items) {
                    const item = cfg.getItem(kid);
                    if (!item) continue;
                    list.appendChild(cfg.buildItem(item)); hasChild = true;
                }
                for (const sub of folder.folders) { list.appendChild(build(sub)); hasChild = true; }
                if (!hasChild) {
                    const ph = document.createElement('div');
                    ph.className = 'folder-placeholder';
                    ph.textContent = cfg.placeholder + '（也可以把分组拖进来）';
                    list.appendChild(ph);
                }

                addBtn.addEventListener('click', () => {
                    showNameModal(cfg.newChildTitle, '新分组', (name) => {
                        ensureKids(folder).push({ id: 'f' + Date.now(), name: name, items: [], folders: [], open: true });
                        folder.open = true;
                        cfg.rerender(); cfg.save();
                    });
                });
                renameBtn.addEventListener('click', () => {
                    showNameModal(cfg.renameTitle, folder.name, (name) => {
                        folder.name = name; cfg.rerender(); cfg.save();
                    });
                });
                delBtn.addEventListener('click', () => {
                    if (folder.id === DEFAULT_FOLDER_ID) { showAlertModal('无法删除', '默认分组「未分类」不可删除。'); return; }
                    showConfirmModal('删除分组', cfg.delConfirm(folder), () => {
                        const root = cfg.getRoot();
                        const def = cfg.getDefault();
                        // 关键：先确保「未分类」在最外层。它若被拖进了这棵待删子树，
                        // 会被整棵提回根层（连它的子分组和条目一起），绝不会跟着一起被删掉。
                        hoistFolderToRoot(root, DEFAULT_FOLDER_ID);
                        // 再把待删子树里剩下的条目（含深层子分组的）回收进「未分类」，不重复添加
                        for (const key of collectFolderItems(folder, [])) {
                            if (!def.items.includes(key)) def.items.push(key);
                        }
                        const slot = findFolderSlot(root, folder.id);
                        if (slot) slot.list.splice(slot.index, 1);
                        cfg.rerender(); cfg.save();
                    });
                });

                enableFolderDrop(list, withSlot(folder.id, () => ensureKids(folder)));
                enhanceFolder(fEl, head, folder, cfg);
                fEl.appendChild(head); fEl.appendChild(list);
                return fEl;
            };
            for (const f of rootList) container.appendChild(build(f));
            enableFolderDrop(container, withSlot(null, () => rootList));
        }

        // ---------- 条目备注：给某个已解开的页面写长句子，并能在列表里直接看到 ----------
        function editArchiveNote(keyword) {
            const item = archiveState.items[keyword];
            if (!item) return;
            const title = '备注 · ' + (item.displayName || item.keyword);
            showNoteModal(title, item.note || '', (val) => {
                if (val) item.note = val;
                else delete item.note;             // 清空 = 删除备注，不留空字段
                renderArchive();
                saveGame();
                showCopyToast(val ? '📝 备注已保存' : '🧹 备注已清除');
            });
        }

        // ---------- 备注浮层：悬停条目时从列表背后向左滑出，离开即收回 ----------
        const notePop = document.getElementById('archiveNotePop');
        const notePopBody = document.getElementById('archiveNotePopBody');
        const notePopEdit = document.getElementById('archiveNotePopEdit');
        let notePopKeyword = null;
        let notePopHideTimer = null;
        let notePopSwitchTimer = null;
        let hoverItemEl = null;              // 鼠标当前停在哪个条目上（null = 不在任何条目上）
        const NOTE_POP_SWITCH_DELAY = 160;  // 换条目时先让上一张彻底收回，再滑出新的

        function hideNotePop() {
            clearTimeout(notePopHideTimer);
            clearTimeout(notePopSwitchTimer);
            notePopKeyword = null;
            notePop.classList.remove('show');
        }
        // 离开时留一点缓冲：鼠标跨过条目与浮层之间的缝隙时不会立刻收回去
        function scheduleHideNotePop() {
            clearTimeout(notePopHideTimer);
            notePopHideTimer = setTimeout(hideNotePop, 180);
        }
        function cancelHideNotePop() {
            clearTimeout(notePopHideTimer);
            clearTimeout(notePopSwitchTimer);
        }

        function showNotePopFor(keyword, anchorEl) {
            const item = archiveState.items[keyword];
            if (!item || !(item.note && item.note.trim())) return;   // 没写备注就不弹
            notePopKeyword = keyword;
            notePopBody.textContent = item.note;

            const r = anchorEl.getBoundingClientRect();
            const pw = notePop.offsetWidth, ph = notePop.offsetHeight;
            // 默认贴在条目左边；左边空间不够（窗口被拖到屏幕最左）时才兜底改到右侧
            let left = r.left - pw - 10;
            if (left < 8) left = Math.min(r.right + 10, window.innerWidth - pw - 8);
            let top = r.top + r.height / 2 - ph / 2;
            top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
            notePop.style.left = Math.max(8, left) + 'px';
            notePop.style.top = top + 'px';
            notePop.classList.add('show');
        }

        // 浮层自己也要能接住鼠标，否则长备注没法滚动查看 / 点编辑
        notePop.addEventListener('mouseenter', cancelHideNotePop);
        notePop.addEventListener('mouseleave', scheduleHideNotePop);
        notePopEdit.addEventListener('click', () => {
            const kw = notePopKeyword;
            hideNotePop();
            if (kw) editArchiveNote(kw);
        });
        // 滚动、缩放、拖拽窗口时浮层会错位，直接收回
        document.addEventListener('scroll', hideNotePop, true);
        window.addEventListener('resize', hideNotePop);
        document.addEventListener('mousedown', (e) => { if (!notePop.contains(e.target)) hideNotePop(); });

        function buildArchiveItem(item) {
            const el = document.createElement('div');
            el.className = 'archive-item page-item';   // page-item：标记这是「页面档案」条目（带备注功能）
            el.draggable = true;
            el.dataset.keyword = item.keyword;

            const hasNote = !!(item.note && item.note.trim());
            if (hasNote) el.classList.add('has-note');

            const main = document.createElement('div');
            main.className = 'item-main';

            const handle = document.createElement('span');
            handle.className = 'item-drag'; handle.textContent = '⋮⋮';
            const name = document.createElement('span');
            name.className = 'item-name'; name.textContent = item.displayName || item.keyword;
            const noteBtn = document.createElement('button');
            noteBtn.className = 'item-note-btn';
            noteBtn.textContent = hasNote ? '📝' : '✎';
            noteBtn.title = hasNote ? '查看 / 编辑备注' : '添加备注';
            noteBtn.dataset.keyword = item.keyword;
            const copy = document.createElement('button');
            copy.className = 'item-copy'; copy.textContent = '📋'; copy.title = '复制编码';
            copy.dataset.keyword = item.keyword;

            main.appendChild(handle); main.appendChild(name); main.appendChild(noteBtn); main.appendChild(copy);
            el.appendChild(main);

            // 悬停：有备注就从条目背后向左滑出浮层（没备注则什么都不做）
            el.addEventListener('mouseenter', () => {
                cancelHideNotePop();
                hoverItemEl = el;
                // 鼠标从「另一个」条目直接移过来时，不判定为延续悬浮：
                // 先让当前浮层彻底收回，再为新条目重新滑出，避免出现浮层瞬移 / 内容直接跳变
                if (notePop.classList.contains('show') && notePopKeyword && notePopKeyword !== item.keyword) {
                    hideNotePop();
                    notePopSwitchTimer = setTimeout(() => {
                        if (hoverItemEl === el) showNotePopFor(item.keyword, el);
                    }, NOTE_POP_SWITCH_DELAY);
                    return;
                }
                showNotePopFor(item.keyword, el);
            });
            el.addEventListener('mouseleave', () => {
                if (hoverItemEl === el) hoverItemEl = null;
                scheduleHideNotePop();
            });

            el.addEventListener('click', (e) => {
                if (e.target === copy || e.target === noteBtn) return;
                openUnlockedPage(item.keyword, item.displayName || item.keyword);
            });
            copy.addEventListener('click', (e) => { e.stopPropagation(); copyCode(item.keyword); });
            noteBtn.addEventListener('click', (e) => { e.stopPropagation(); editArchiveNote(item.keyword); });
            el.addEventListener('dragstart', () => { hideNotePop(); dragKeyword = item.keyword; el.classList.add('dragging'); });
            el.addEventListener('dragend', () => { dragKeyword = null; el.classList.remove('dragging'); });
            return el;
        }

        function renderArchive() {
            hideNotePop();   // 列表要重建了，旧条目已消失，mouseleave 不会再触发
            hoverItemEl = null;
            archiveBody.innerHTML = '';
            if (!archiveState.folders.length) {
                const empty = document.createElement('div');
                empty.className = 'archive-empty';
                empty.textContent = '暂无已解开的页面';
                archiveBody.appendChild(empty);
                return;
            }
            renderFolderTree(archiveBody, archiveState.folders, {
                getRoot: () => archiveState.folders,
                getDraggingItem: () => dragKeyword,
                moveItemToFolder: (kid, fid, before) => moveItem(kid, fid, before),
                getItem: (k) => archiveState.items[k],
                buildItem: (item) => buildArchiveItem(item),
                getDefault: () => {
                    let def = findFolderDeep(archiveState.folders, 'default');
                    if (!def) { def = { id: 'default', name: '未分类', items: [], folders: [] }; archiveState.folders.unshift(def); }
                    return def;
                },
                placeholder: '拖拽页面到此处',
                renameTitle: '重命名目录',
                newChildTitle: '新建子目录',
                delConfirm: (folder) => '删除「' + folder.name + '」？其中的页面（含子分组里的）将移回「未分类」。' +
                    (ensureKids(folder).length ? '子分组会一并删除。' : ''),
                rerender: () => renderArchive(),
                save: () => saveGame()
            });
        }

        function openArchive() { archiveWindow.classList.add('open'); renderArchive(); }
        function closeArchive() { hideNotePop(); archiveWindow.classList.remove('open'); }

        archiveOpenBtn.addEventListener('click', openArchive);
        archiveCloseBtn.addEventListener('click', closeArchive);
        archiveNewFolder.addEventListener('click', () => {
            showNameModal('新建目录', '新目录', (name) => {
                archiveState.folders.push({ id: 'f' + Date.now(), name: name, items: [], folders: [], open: true });
                renderArchive(); saveGame();
            });
        });
        // （分组的拖拽 / 排序 / 嵌套由 renderFolderTree 在每次渲染时挂到各层容器上）

        // 页面档案窗口：右下角拖拽缩放
        setupWindowResize(archiveWindow, { minW: 340, minH: 240, maxW: 900, maxH: 780 });

        // 档案窗口拖拽（标题栏拖动位置）
        (function makeArchiveDraggable() {
            const title = document.getElementById('archiveTitle');
            let dragging = false, offX = 0, offY = 0;
            title.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                dragging = true;
                const rect = archiveWindow.getBoundingClientRect();
                // 拖拽前先把居中 transform 去掉，用实际像素 left/top 固定当前位置，避免闪烁
                archiveWindow.style.transform = 'none';
                archiveWindow.style.right = 'auto';
                archiveWindow.style.left = rect.left + 'px';
                archiveWindow.style.top = rect.top + 'px';
                offX = e.clientX - rect.left; offY = e.clientY - rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                e.preventDefault();
            });
            function onMove(e) {
                if (!dragging) return;
                let x = e.clientX - offX, y = e.clientY - offY;
                x = Math.max(0, Math.min(window.innerWidth - archiveWindow.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - 40, y));
                archiveWindow.style.left = x + 'px';
                archiveWindow.style.top = y + 'px';
            }
            function onUp() { dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        })();

        console.log('🗂️ 页面档案已就绪（可拖拽 / 新建目录 / 编码复制）。');

        // =================================================================
        //  🧠 思维档案（与页面档案同款交互：可拖拽排序 / 分组，但没有复制功能）
        // =================================================================
        const thoughtOpenBtn = document.getElementById('thoughtOpenBtn');
        const thoughtWindow = document.getElementById('thoughtWindow');
        const thoughtCloseBtn = document.getElementById('thoughtCloseBtn');
        const thoughtBody = document.getElementById('thoughtBody');
        const thoughtNewFolder = document.getElementById('thoughtNewFolder');
        let dragThought = null;

        // 按玩家定义的分组顺序，把所有思维拍平成一个数组（供「流淌思维」使用）
        function getThoughtOrder() {
            const arr = [];
            for (const folder of thoughtArchive.folders) {
                for (const kid of folder.items) {
                    const it = thoughtArchive.items[kid];
                    if (it) arr.push(it.text);
                }
            }
            return arr;
        }

        function findThoughtFolder(text) {
            return findOwnerFolder(thoughtArchive.folders, text);
        }
        function moveThought(text, targetFolderId, beforeText) {
            const src = findThoughtFolder(text);
            if (!src) return;
            src.items = (src.items || []).filter(k => k !== text);
            const tgt = findFolderDeep(thoughtArchive.folders, targetFolderId);
            if (!tgt) return;
            if (!Array.isArray(tgt.items)) tgt.items = [];
            let idx = tgt.items.length;
            if (beforeText != null) {
                const bi = tgt.items.indexOf(beforeText);
                if (bi >= 0) idx = bi;
            }
            tgt.items.splice(idx, 0, text);
        }

        function buildThoughtItem(item) {
            const el = document.createElement('div');
            el.className = 'archive-item';
            el.draggable = true;
            el.dataset.keyword = item.text;   // 供 getDragAfterElement 识别落点

            const handle = document.createElement('span');
            handle.className = 'item-drag'; handle.textContent = '⋮⋮';
            const name = document.createElement('span');
            name.className = 'item-name'; name.textContent = item.text;

            el.appendChild(handle); el.appendChild(name);

            el.addEventListener('dragstart', () => { dragThought = item.text; el.classList.add('dragging'); });
            el.addEventListener('dragend', () => { dragThought = null; el.classList.remove('dragging'); });
            return el;
        }

        function renderThoughtArchive() {
            thoughtBody.innerHTML = '';
            if (!thoughtArchive.folders.length) {
                const empty = document.createElement('div');
                empty.className = 'archive-empty';
                empty.textContent = '暂无思维碎片，触发“值得注意的是”后会出现在这里';
                thoughtBody.appendChild(empty);
                return;
            }
            renderFolderTree(thoughtBody, thoughtArchive.folders, {
                getRoot: () => thoughtArchive.folders,
                getDraggingItem: () => dragThought,
                moveItemToFolder: (kid, fid, before) => moveThought(kid, fid, before),
                getItem: (k) => thoughtArchive.items[k],
                buildItem: (item) => buildThoughtItem(item),
                getDefault: () => {
                    let def = findFolderDeep(thoughtArchive.folders, 'default');
                    if (!def) { def = { id: 'default', name: '未分类', items: [], folders: [] }; thoughtArchive.folders.unshift(def); }
                    return def;
                },
                placeholder: '拖拽思维到此处',
                renameTitle: '重命名分组',
                newChildTitle: '新建子分组',
                delConfirm: (folder) => '删除「' + folder.name + '」？其中的思维（含子分组里的）将移回「未分类」。' +
                    (ensureKids(folder).length ? '子分组会一并删除。' : ''),
                rerender: () => renderThoughtArchive(),
                save: () => saveGame()
            });
        }

        function openThoughtArchive() { thoughtWindow.classList.add('open'); renderThoughtArchive(); }
        function closeThoughtArchive() { thoughtWindow.classList.remove('open'); }

        thoughtOpenBtn.addEventListener('click', openThoughtArchive);
        thoughtCloseBtn.addEventListener('click', closeThoughtArchive);
        thoughtNewFolder.addEventListener('click', () => {
            showNameModal('新建分组', '新分组', (name) => {
                thoughtArchive.folders.push({ id: 'f' + Date.now(), name: name, items: [], folders: [], open: true });
                renderThoughtArchive(); saveGame();
            });
        });
        // （分组的拖拽 / 排序 / 嵌套由 renderFolderTree 在每次渲染时挂到各层容器上）

        // 思维档案窗口：右下角拖拽缩放
        setupWindowResize(thoughtWindow, { minW: 340, minH: 240, maxW: 900, maxH: 780 });

        // 思维窗口拖拽（标题栏拖动位置，复用与档案窗口一致的居中逻辑）
        (function makeThoughtDraggable() {
            const title = document.getElementById('thoughtTitle');
            let dragging = false, offX = 0, offY = 0;
            title.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                dragging = true;
                const rect = thoughtWindow.getBoundingClientRect();
                thoughtWindow.style.transform = 'none';
                thoughtWindow.style.right = 'auto';
                thoughtWindow.style.left = rect.left + 'px';
                thoughtWindow.style.top = rect.top + 'px';
                offX = e.clientX - rect.left; offY = e.clientY - rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                e.preventDefault();
            });
            function onMove(e) {
                if (!dragging) return;
                let x = e.clientX - offX, y = e.clientY - offY;
                x = Math.max(0, Math.min(window.innerWidth - thoughtWindow.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - 40, y));
                thoughtWindow.style.left = x + 'px';
                thoughtWindow.style.top = y + 'px';
            }
            function onUp() { dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        })();

        console.log('🧠 思维档案已就绪（可拖拽排序 / 分组，无复制）。');

        // =================================================================
        //  🎵 音乐收藏窗口（唱片旋转 / 进度拖拽 / 播放模式 / 分组排序 / 切换提示）
        // =================================================================
        const musicWindow = document.getElementById('musicWindow');
        const musicTitle = document.getElementById('musicTitle');
        const musicCloseBtn = document.getElementById('musicCloseBtn');
        const musicNewFolder = document.getElementById('musicNewFolder');
        const musicSeek = document.getElementById('musicSeek');
        const musicToastEl = document.getElementById('musicToast');
        const musicPlayPauseBtn = document.getElementById('musicPlayPauseBtn');
        let dragMusic = null;

        function updateVinyl() {
            const v = document.getElementById('vinyl');
            if (v) v.classList.toggle('paused', !isMusicPlaying);
        }

        let toastTimer = null;
        function showNowToast(name) {
            if (!musicToastEl) return;
            const folder = findMusicFolder(name);
            const groupLabel = folder ? folder.name : '未分类';
            musicToastEl.textContent = '🎵 当前播放音乐：' + name + '　　📁 ' + groupLabel;
            musicToastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => musicToastEl.classList.remove('show'), 2600);
        }

        function syncModeButtons() {
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === musicPlayMode);
            });
        }

        function findMusicFolder(name) {
            return findOwnerFolder(musicArchive.folders, name);
        }
        function moveMusic(name, targetFolderId, beforeName) {
            const src = findMusicFolder(name);
            if (!src) return;
            src.items = (src.items || []).filter(k => k !== name);
            const tgt = findFolderDeep(musicArchive.folders, targetFolderId);
            if (!tgt) return;
            if (!Array.isArray(tgt.items)) tgt.items = [];
            let idx = tgt.items.length;
            if (beforeName != null) { const bi = tgt.items.indexOf(beforeName); if (bi >= 0) idx = bi; }
            tgt.items.splice(idx, 0, name);
        }

        function buildMusicItem(item) {
            const el = document.createElement('div');
            el.className = 'archive-item';
            el.draggable = true;
            el.dataset.keyword = item.name;
            const handle = document.createElement('span');
            handle.className = 'item-drag'; handle.textContent = '⋮⋮';
            const nm = document.createElement('span');
            nm.className = 'item-name'; nm.textContent = item.name;
            el.appendChild(handle); el.appendChild(nm);
            if (item.name === currentMusicName) {
                el.classList.add('playing');
                const pl = document.createElement('span');
                pl.className = 'item-playing'; pl.textContent = '♪';
                el.appendChild(pl);
            }
            el.addEventListener('click', () => playMusic(item.name));
            el.addEventListener('dragstart', () => { dragMusic = item.name; el.classList.add('dragging'); });
            el.addEventListener('dragend', () => { dragMusic = null; el.classList.remove('dragging'); });
            return el;
        }

        function renderMusicArchive() {
            const list = document.getElementById('musicCollectionList');
            if (!list) return;
            list.innerHTML = '';
            if (!musicArchive.folders.length) {
                const empty = document.createElement('div');
                empty.className = 'music-empty';
                empty.textContent = '暂无音乐，触发对应剧情后会自动收藏';
                list.appendChild(empty);
                return;
            }
            renderFolderTree(list, musicArchive.folders, {
                getRoot: () => musicArchive.folders,
                getDraggingItem: () => dragMusic,
                moveItemToFolder: (kid, fid, before) => moveMusic(kid, fid, before),
                getItem: (k) => musicArchive.items[k],
                buildItem: (item) => buildMusicItem(item),
                getDefault: () => {
                    let def = findFolderDeep(musicArchive.folders, 'default');
                    if (!def) { def = { id: 'default', name: '未分类', items: [], folders: [] }; musicArchive.folders.unshift(def); }
                    return def;
                },
                placeholder: '拖拽音乐到此处',
                renameTitle: '重命名分组',
                newChildTitle: '新建子分组',
                delConfirm: (folder) => '删除「' + folder.name + '」？其中的音乐（含子分组里的）将移回「未分类」。' +
                    (ensureKids(folder).length ? '子分组会一并删除。' : ''),
                rerender: () => renderMusicArchive(),
                save: () => saveGame()
            });
        }

        function openMusicWindow() { musicWindow.classList.add('open'); renderMusicArchive(); updateMusicCollectionDisplay(); syncModeButtons(); }
        function closeMusicWindow() { musicWindow.classList.remove('open'); }
        musicCollectionBtn.addEventListener('click', () => {
            if (musicWindow.classList.contains('open')) closeMusicWindow(); else openMusicWindow();
        });
        musicCloseBtn.addEventListener('click', closeMusicWindow);

        // 音乐窗口内的播放/暂停按钮
        musicPlayPauseBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
                updateMusicButton();
                updateVinyl();
            } else {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicButton();
                    updateVinyl();
                }).catch(() => {});
            }
        });

        // 音乐收藏窗口：右下角拖拽缩放
        setupWindowResize(musicWindow, { minW: 380, minH: 300, maxW: 1000, maxH: 860 });

        // 窗口拖拽（标题栏拖动位置，居中定位改成 fixed left/top）
        (function makeMusicDraggable() {
            let dragging = false, offX = 0, offY = 0;
            musicTitle.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                dragging = true;
                const rect = musicWindow.getBoundingClientRect();
                musicWindow.style.transform = 'none';
                musicWindow.style.right = 'auto';
                musicWindow.style.left = rect.left + 'px';
                musicWindow.style.top = rect.top + 'px';
                offX = e.clientX - rect.left; offY = e.clientY - rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                e.preventDefault();
            });
            function onMove(e) {
                if (!dragging) return;
                let x = e.clientX - offX, y = e.clientY - offY;
                x = Math.max(0, Math.min(window.innerWidth - musicWindow.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - 40, y));
                musicWindow.style.left = x + 'px';
                musicWindow.style.top = y + 'px';
            }
            function onUp() { dragging = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        })();

        // 播放模式：顺序 / 随机 / 单曲循环
        document.querySelectorAll('.mode-btn').forEach(b => {
            b.addEventListener('click', () => {
                musicPlayMode = b.dataset.mode;
                bgm.loop = (musicPlayMode === 'loop');
                syncModeButtons(); saveGame();
            });
        });

        // 新建分组（根层）
        musicNewFolder.addEventListener('click', () => {
            showNameModal('新建分组', '新分组', (name) => {
                musicArchive.folders.push({ id: 'f' + Date.now(), name: name, items: [], folders: [], open: true });
                renderMusicArchive(); saveGame();
            });
        });
        // （分组的拖拽 / 排序 / 嵌套由 renderFolderTree 在每次渲染时挂到各层容器上）
        // 注意：顺序播放的先后仍然取决于分组树的前后顺序（深度优先，见 getMusicOrder）

        // 进度条拖拽
        function fmtTime(t) {
            if (!isFinite(t) || t < 0) t = 0;
            t = Math.floor(t);
            const m = Math.floor(t / 60), s = t % 60;
            return m + ':' + (s < 10 ? '0' + s : s);
        }
        let seeking = false;
        bgm.addEventListener('loadedmetadata', () => {
            musicSeek.max = bgm.duration || 0;
            const dt = document.getElementById('durTime');
            if (dt) dt.textContent = fmtTime(bgm.duration);
        });
        bgm.addEventListener('timeupdate', () => {
            if (!seeking) musicSeek.value = bgm.currentTime || 0;
            const ct = document.getElementById('curTime');
            if (ct) ct.textContent = fmtTime(bgm.currentTime);
        });
        musicSeek.addEventListener('input', () => {
            bgm.currentTime = parseFloat(musicSeek.value) || 0;
            const ct = document.getElementById('curTime');
            if (ct) ct.textContent = fmtTime(bgm.currentTime);
        });
        musicSeek.addEventListener('mousedown', () => seeking = true);
        musicSeek.addEventListener('mouseup', () => seeking = false);
        musicSeek.addEventListener('touchstart', () => seeking = true, { passive: true });
        musicSeek.addEventListener('touchend', () => seeking = false);

        console.log('🎵 音乐收藏已就绪（唱片旋转 / 进度拖拽 / 顺序·随机·单曲 / 分组排序 / 切换提示）。');
    </script>
</body>
</html>
