<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>您为了什么而来？</title>
    <style>
        /* ---------- 基础样式（和之前保持一致，省略以节省空间） ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #0a0a0a; font-family: 'Courier New', Courier, monospace; padding: 20px; position: relative; }
        .rough-card { max-width: 640px; width: 100%; padding: 40px 32px 44px; background: #111; border: 2px solid #2a2a2a; box-shadow: 0 8px 0 #1a1a1a, 0 12px 40px rgba(0,0,0,0.8); position: relative; z-index: 1; }
        .rough-card::after { content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border: 1px dashed #2a2a2a; pointer-events: none; opacity: 0.3; }
        .title { text-align: center; font-size: 1.8rem; font-weight: 400; letter-spacing: 2px; color: #c0b8a8; text-shadow: 0 0 6px rgba(200,180,150,0.1); margin-bottom: 10px; font-family: 'Courier New', monospace; border-bottom: 1px solid #2a2a2a; padding-bottom: 14px; }
        .title span { margin-right: 6px; font-size: 1.6rem; }
        .hint { text-align: center; color: #5a5a5a; font-size: 0.85rem; letter-spacing: 0.5px; margin-bottom: 28px; font-style: normal; padding-bottom: 10px; border-bottom: 1px dashed #222; }
        .input-area { display: flex; gap: 10px; margin-bottom: 22px; position: relative; z-index: 2; }
        .input-area input { flex: 1; padding: 14px 18px; border: 2px solid #333; background: #0d0d0d; color: #c8c0b0; font-size: 1rem; font-family: 'Courier New', monospace; outline: none; transition: 0.15s; box-shadow: inset 0 2px 6px rgba(0,0,0,0.8); }
        .input-area input:focus { border-color: #666; background: #111; }
        .input-area input::placeholder { color: #3a3a3a; font-style: italic; }
        .input-area button { padding: 14px 28px; border: 2px solid #444; background: #1a1a1a; color: #b0a898; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.1s; font-family: 'Courier New', monospace; letter-spacing: 1px; box-shadow: 0 4px 0 #0a0a0a; }
        .input-area button:hover { background: #222; border-color: #666; color: #d0c8b8; }
        .input-area button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0a0a; }
        .reply-box { background: #0a0a0a; border: 2px solid #222; padding: 18px 20px; min-height: 80px; margin-bottom: 16px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.9); font-size: 1rem; line-height: 1.6; color: #b8b0a0; word-break: break-word; white-space: pre-wrap; font-family: 'Courier New', monospace; position: relative; z-index: 1; }
        .reply-box .placeholder { color: #3a3a3a; font-style: italic; }
        .fly-popup { position: fixed; pointer-events: auto; background: #1a1a1a; border: 2px solid #444; padding: 24px 28px 28px; min-width: 260px; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.04); opacity: 0; transform: scale(0.7) rotate(-8deg); transition: none; font-family: 'Courier New', monospace; z-index: 1000; }
        .fly-popup .popup-title { color: #8a8a7a; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 6px; }
        .fly-popup .popup-text { color: #c8c0b0; font-size: 1.05rem; line-height: 1.6; margin-bottom: 16px; }
        .fly-popup .popup-btn { background: #1a1a1a; border: 2px solid #444; color: #b0a898; padding: 6px 24px; font-size: 0.85rem; cursor: pointer; transition: 0.15s; font-family: 'Courier New', monospace; letter-spacing: 1px; box-shadow: 0 3px 0 #0a0a0a; }
        .fly-popup .popup-btn:hover { background: #222; border-color: #666; color: #d0c8b8; }
        .fly-popup .popup-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0a0a; }
        .fly-popup.animate-in { animation: flyIn 0.9s cubic-bezier(0.22,0.9,0.36,1.1) forwards; }
        @keyframes flyIn { 0% { opacity: 0; transform: scale(0.5) rotate(var(--start-rotate,-10deg)) translate(var(--start-x,0px),var(--start-y,0px)); } 40% { opacity: 0.9; transform: scale(1.05) rotate(var(--mid-rotate,5deg)) translate(var(--mid-x,0px),var(--mid-y,0px)); } 70% { transform: scale(0.98) rotate(var(--end-rotate,-2deg)) translate(0px,0px); } 100% { opacity: 1; transform: scale(1) rotate(0deg) translate(0px,0px); } }
        .fly-popup.fade-out { animation: fadeOut 0.3s ease forwards; }
        @keyframes fadeOut { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(0.8) rotate(10deg); } }
        .history-area { margin-top: 20px; border-top: 1px dashed #222; padding-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .history-label { color: #5a5a5a; font-size: 0.75rem; letter-spacing: 1px; margin-right: 4px; font-family: 'Courier New', monospace; }
        .history-link { background: #1a1a1a; border: 1px solid #333; padding: 4px 14px; color: #8a8a7a; font-size: 0.8rem; font-family: 'Courier New', monospace; text-decoration: none; transition: 0.15s; display: inline-block; cursor: pointer; }
        .history-link:hover { background: #222; border-color: #555; color: #c0b8a8; }
        .history-link .link-icon { margin-right: 4px; opacity: 0.5; }
        .history-empty { color: #3a3a3a; font-size: 0.8rem; font-style: italic; }
        .clear-history-btn { background: #1a1a1a; border: 1px solid #333; color: #5a5a5a; padding: 2px 12px; font-size: 0.7rem; cursor: pointer; transition: 0.15s; font-family: 'Courier New', monospace; margin-left: 6px; }
        .clear-history-btn:hover { background: #2a1a1a; border-color: #5a3a3a; color: #8a6a6a; }
        .music-collection-area { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #222; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .music-collection-btn { background: #1a1a1a; border: 2px solid #333; color: #8a8a7a; padding: 6px 18px; font-size: 0.8rem; cursor: pointer; transition: 0.15s; font-family: 'Courier New', monospace; letter-spacing: 0.5px; box-shadow: 0 3px 0 #0a0a0a; }
        .music-collection-btn:hover { background: #222; border-color: #555; color: #c0b8a8; }
        .music-collection-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0a0a; }
        .music-collection-btn .icon { margin-right: 4px; }
        .music-collection-list { display: none; width: 100%; background: #0a0a0a; border: 1px solid #222; padding: 12px 16px; margin-top: 6px; flex-wrap: wrap; gap: 6px; }
        .music-collection-list.open { display: flex; }
        .music-collection-list .music-item { background: #1a1a1a; border: 1px solid #333; padding: 4px 14px; color: #8a8a7a; font-size: 0.75rem; font-family: 'Courier New', monospace; display: inline-block; cursor: pointer; transition: 0.15s; }
        .music-collection-list .music-item:hover { background: #222; border-color: #555; color: #c0b8a8; }
        .music-collection-list .music-item.active { border-color: #7a6a5a; background: #1f1a15; color: #d0c0a8; box-shadow: 0 0 12px rgba(120,100,80,0.15); }
        .music-collection-list .music-item .status { opacity: 0.4; margin-left: 4px; }
        .music-collection-empty { color: #3a3a3a; font-size: 0.8rem; font-style: italic; padding: 4px 0; width: 100%; }
        .note-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; overflow: hidden; }
        .note-item { position: absolute; background: rgba(20,18,16,0.9); border: 1px solid #3a3a3a; color: #b8b0a0; font-family: 'Courier New', monospace; font-size: 0.9rem; padding: 10px 14px; max-width: 240px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); backdrop-filter: blur(2px); pointer-events: none; white-space: pre-wrap; word-break: break-word; line-height: 1.5; letter-spacing: 0.3px; border-radius: 2px; transform-origin: center; opacity: 0; animation: noteSlideIn 0.6s cubic-bezier(0.34,1.2,0.64,1) forwards; transition: none; }
        @keyframes noteSlideIn { 0% { opacity: 0; transform: scale(0.8) translateY(30px) rotate(var(--rot,0deg)); } 100% { opacity: 0.9; transform: scale(1) translateY(0) rotate(var(--rot,0deg)); } }
        .note-item.scale-out { animation: scaleOut 0.5s ease forwards !important; opacity: 1; }
        @keyframes scaleOut { 0% { transform: scale(1) rotate(var(--rot,0deg)); opacity: 0.9; } 100% { transform: scale(0.1) rotate(calc(var(--rot,0deg) + 20deg)); opacity: 0; } }
        .controls-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 10px; padding-top: 12px; border-top: 1px dashed #222; flex-wrap: wrap; }
        .controls-row label { color: #5a5a5a; font-size: 0.7rem; letter-spacing: 0.5px; font-family: 'Courier New', monospace; }
        .controls-row input[type="range"] { width: 80px; height: 4px; background: #333; outline: none; border: none; -webkit-appearance: none; appearance: none; }
        .controls-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; background: #6a6a5a; border: 1px solid #444; cursor: pointer; border-radius: 0; }
        .controls-row .speed-value { color: #8a8a7a; font-size: 0.75rem; min-width: 24px; text-align: center; }
        .controls-row .btn-bubble { background: #1a1a1a; border: 2px solid #444; color: #b0a898; padding: 6px 18px; font-size: 0.8rem; cursor: pointer; transition: 0.15s; font-family: 'Courier New', monospace; letter-spacing: 0.5px; box-shadow: 0 3px 0 #0a0a0a; }
        .controls-row .btn-bubble:hover { background: #222; border-color: #666; color: #d0c8b8; }
        .controls-row .btn-bubble:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0a0a; }
        .controls-row .btn-bubble.active { border-color: #7a6a5a; background: #1f1a15; color: #d0c0a8; }
        .music-area { display: flex; justify-content: center; margin-top: 6px; }
        .music-btn { background: #1a1a1a; border: 2px solid #333; color: #8a8a7a; padding: 10px 32px; font-size: 0.9rem; cursor: pointer; transition: 0.15s; font-family: 'Courier New', monospace; letter-spacing: 1px; box-shadow: 0 4px 0 #0a0a0a; }
        .music-btn:hover { background: #222; border-color: #555; color: #b0a898; }
        .music-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0a0a; }
        .music-btn .icon { margin-right: 8px; }
        @media (max-width:550px) { .rough-card { padding: 24px 16px 30px; } .title { font-size: 1.4rem; } .input-area { flex-wrap: wrap; } .input-area input { flex: 1 1 100%; } .input-area button { flex: 1 1 100%; justify-content: center; } .reply-box { font-size: 0.9rem; padding: 14px; min-height: 60px; } .fly-popup { min-width: 200px; max-width: 300px; padding: 18px 20px 22px; left: 50% !important; transform: translateX(-50%); } .fly-popup .popup-text { font-size: 0.95rem; } .music-btn { padding: 8px 20px; font-size: 0.8rem; } .history-area { gap: 6px; } .history-link { font-size: 0.7rem; padding: 3px 10px; } .controls-row input[type="range"] { width: 60px; } .controls-row .btn-bubble { padding: 4px 12px; font-size: 0.7rem; } .music-collection-btn { font-size: 0.7rem; padding: 4px 12px; } .music-collection-list .music-item { font-size: 0.65rem; padding: 2px 10px; } }
    </style>
</head>
<body>
    <div class="note-container" id="noteContainer"></div>
    <div class="rough-card">
        <div class="title"><span>❓</span> 您为了什么而来？</div>
        <div class="hint">您可以提问，或者拆开网页代码。</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入你想说的话…" autofocus />
            <button id="sendBtn">询问</button>
        </div>
        <div class="reply-box" id="replyBox"><span class="placeholder">💬 等待您的提问……</span></div>
        <div class="history-area" id="historyArea">
            <span class="history-label">📖 已解开的页面：</span>
            <button class="clear-history-btn" id="clearHistoryBtn">🗑️ 清空</button>
            <span class="history-empty" id="historyEmpty">尚无记录</span>
        </div>
        <div class="music-collection-area">
            <button class="music-collection-btn" id="musicCollectionBtn"><span class="icon">🎵</span> 音乐收藏</button>
            <span style="color:#3a3a3a;font-size:0.7rem;letter-spacing:0.5px;" id="musicCount">(1)</span>
            <div class="music-collection-list" id="musicCollectionList"></div>
        </div>
        <div class="controls-row">
            <label for="speedSlider">💭 速度</label>
            <input type="range" id="speedSlider" min="0" max="10" value="3" step="0.5" />
            <span class="speed-value" id="speedDisplay">3</span>
            <button class="btn-bubble" id="bubbleBtn">💭 流淌思维</button>
            <label for="bubbleInterval">间隔</label>
            <input type="range" id="bubbleInterval" min="200" max="2000" value="600" step="50" />
            <span class="speed-value" id="intervalDisplay">600ms</span>
        </div>
        <div class="music-area">
            <button class="music-btn" id="musicToggle"><span class="icon">🔊</span> 关闭音乐</button>
        </div>
    </div>
    <audio id="bgm" loop><source src="bgm/O.mp3" type="audio/mpeg"></audio>

    <script>
        const SAVE_KEY = 'puzzle_game_save';
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const replyBox = document.getElementById('replyBox');
        const bgm = document.getElementById('bgm');
        const musicToggle = document.getElementById('musicToggle');
        const historyArea = document.getElementById('historyArea');
        const historyEmpty = document.getElementById('historyEmpty');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const noteContainer = document.getElementById('noteContainer');
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const bubbleBtn = document.getElementById('bubbleBtn');
        const bubbleInterval = document.getElementById('bubbleInterval');
        const intervalDisplay = document.getElementById('intervalDisplay');
        const musicCollectionBtn = document.getElementById('musicCollectionBtn');
        const musicCollectionList = document.getElementById('musicCollectionList');
        const musicCount = document.getElementById('musicCount');

        // ---------- 普通问答词典 ----------
        const responses = {
            '你好|hi|hello': '您好……希望您不虚此行。',
            '我|me': '您。',
            '你|you': '您的所见。',
            '什么|what': '如果您不清楚如何寻找线索，可以和我随便聊聊',
            '闹麻了|闹麻|麻了': '我没有和您闹呀……',
            '何意味|啥意思|什么意思': '您或许困惑，但是不必操之过急。',
            '这什么垃圾游戏|垃圾游戏|辣鸡游戏': '您的看法会被重视。',
            '我好|我很好|我挺好的': '我也很好，很高兴再次见到您。',
            '你是谁|你谁|who': '我是回答。',
            '我喜欢你|爱你|love': '能自如表达善意的您……同样值得被喜欢。',
            '池塘|塘': '我们路过了那里。',
            '未来|将来|以后': '未来。',
            '别处|他处|另一边': '是的，别处……',
            'somewhere|某处': 'Yes,somewhere……',
            '你在哪|你在哪里|where': '我就在这里。',
            '钥匙|key': '这里没有钥匙。',
            '分散式凯撒': '它的加密有以下三项：方向，数字，原码。',
            '随机数字': '如果您希望加密某些英文字符串，它们很有用。',
            '书房|书斋': '这里没有书房，但……改天可以有。',
            '秘密|secret': '秘密不在我的答案里，而在我与您相处的每个日夜里。',
            '答案|answer': '答案在此处，您可以掘地三尺。',
            'help|帮助': '回想我们交流里的关键词。',
        };
        const flatResponses = {};
        for (const [key, value] of Object.entries(responses)) {
            const keys = key.split('|').map(s => s.trim());
            for (const k of keys) flatResponses[k.toLowerCase()] = value;
        }
        const defaultReply = '输入 “帮助” 以获得指引。';

        // ---------- 彩蛋阶段系统 ----------
        const easterEggStages = {
            '你好|hi|hello': { count: 0, stages: [{ at: 3, reply: '我感到温暖。' }, { at: 4, reply: '回应的不是我。' }, { at: 5, reply: '在等您，我，或者……' }], triggered: new Set() },
            '为什么|why': { count: 0, stages: [{ at: 3, reply: '因为您在此处。' }, { at: 6, reply: '求知若渴。' }], triggered: new Set() },
            '你在哪|你在哪里|where': { count: 0, stages: [{ at: 2, reply: '我不会离开的。' }, { at: 4, reply: '可能是别处。' }, { at: 6, reply: '值得注意的是：您该怎么见我？' }], triggered: new Set() },
            '我|me': { count: 0, stages: [{ at: 2, reply: '您在……寻找您自己？' }, { at: 4, reply: '自言自语。' }], triggered: new Set() }
        };
        const eggAliasMap = {};
        for (const [key, _] of Object.entries(easterEggStages)) {
            const aliases = key.split('|').map(s => s.trim().toLowerCase());
            for (const alias of aliases) eggAliasMap[alias] = key;
        }

        // ---------- 弹窗配置 ----------
        const popupConfig = {
            '解码器|decoder': {
                text: '您知道怎么做。',
                buttonText: '前往查看',
                url: 'newweb/解码器.html',
                musicName: '解码器',
                musicFile: 'bgm/code.mp3'
            },
            '凯撒掩码-K0': {
                text: '您真的要看？',
                buttonText: '看',
                url: 'newweb/您知道数字是多少.html',
                musicName: '凯撒掩码-K0',
                musicFile: null
            },
            '2026824948': {
                text: '可喜可贺',
                buttonText: '可喜可贺',
                url: 'newweb/我的所在.html',
                musicName: '2026824948',
                musicFile: null
            }
        };
        const flatPopupMap = {};
        const popupDisplayNames = {};
        for (const [key, config] of Object.entries(popupConfig)) {
            const aliases = key.split('|').map(s => s.trim());
            popupDisplayNames[key] = aliases[0];
            for (const alias of aliases) flatPopupMap[alias.toLowerCase()] = { key, config };
        }

        // 🎵 音乐映射
        const musicFileMap = new Map();
        musicFileMap.set('O', 'bgm/O.mp3');
        for (const [key, config] of Object.entries(popupConfig)) {
            if (config.musicName && config.musicFile) musicFileMap.set(config.musicName, config.musicFile);
        }

        // ---------- 历史记录 ----------
        const historyRecords = new Set();

        // ---------- 🎵 已解锁音乐 ----------
        let unlockedMusic = new Set();
        let currentMusicName = 'O';

        function addUnlockedMusic(name) {
            if (!name) return;
            if (unlockedMusic.has(name)) return;
            unlockedMusic.add(name);
            updateMusicCollectionDisplay();
            saveGame();
        }

        function updateMusicCollectionDisplay() {
            musicCount.textContent = `(${unlockedMusic.size})`;
            musicCollectionList.innerHTML = '';
            const sorted = Array.from(unlockedMusic).sort((a, b) => {
                if (a === 'O') return -1;
                if (b === 'O') return 1;
                return a.localeCompare(b);
            });
            for (const name of sorted) {
                const item = document.createElement('span');
                item.className = 'music-item';
                if (name === currentMusicName) item.classList.add('active');
                const icon = name === 'O' ? '' : '▶';
                item.innerHTML = `${name} <span class="status">${icon}</span>`;
                item.addEventListener('click', () => playMusic(name));
                musicCollectionList.appendChild(item);
            }
        }

        function playMusic(name) {
            const file = musicFileMap.get(name);
            if (!file) {
                replyBox.innerHTML = `⚠️ 未找到音乐文件：${name}`;
                return;
            }
            bgm.src = file;
            bgm.load();
            bgm.play().then(() => {
                isMusicPlaying = true;
                currentMusicName = name;
                updateMusicButton();
                updateMusicCollectionDisplay();
                console.log(`🎵 切换到：${name}`);
            }).catch(err => {
                console.warn('播放失败:', err);
                if (name !== 'O') {
                    replyBox.innerHTML = `⚠️ 播放失败，尝试恢复默认音乐。`;
                    playMusic('O');
                }
            });
        }

        // ---------- 存档系统 ----------
        let _loading = false;

        function createHistoryLink(keyword, displayName) {
            const link = document.createElement('span');
            link.className = 'history-link';
            link.innerHTML = `<span class="link-icon">📄</span> ${displayName || keyword}`;
            link.addEventListener('click', function() {
                let config = null;
                for (const [key, cfg] of Object.entries(popupConfig)) {
                    const aliases = key.split('|').map(s => s.trim());
                    if (aliases.includes(displayName) || key === displayName) {
                        config = cfg;
                        break;
                    }
                }
                if (config && config.url) {
                    window.open(config.url, '_blank');
                } else {
                    replyBox.innerHTML = `📖 已解锁页面：${displayName}\n\n（尚未关联新网页）`;
                }
            });
            historyArea.appendChild(link);
        }

        function addHistoryRecord(keyword, displayName) {
            if (historyRecords.has(keyword)) return;
            historyRecords.add(keyword);
            if (historyEmpty) historyEmpty.style.display = 'none';
            createHistoryLink(keyword, displayName || keyword);
            if (!_loading) saveGame();
        }

        function saveGame() {
            try {
                const data = {
                    historyRecords: Array.from(historyRecords),
                    dialogueState: { ...dialogueState },
                    easterEggStages: {},
                    thoughtBubbles: thoughtBubbles,
                    unlockedMusic: Array.from(unlockedMusic),
                    currentMusicName: currentMusicName
                };
                for (const [key, egg] of Object.entries(easterEggStages)) {
                    data.easterEggStages[key] = { count: egg.count, triggered: Array.from(egg.triggered) };
                }
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) { console.warn('保存失败:', e); }
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (!saved) return false;
            try {
                _loading = true;
                const data = JSON.parse(saved);

                if (data.historyRecords) {
                    historyEmpty.style.display = 'none';
                    for (const item of data.historyRecords) {
                        historyRecords.add(item);
                        createHistoryLink(item, item);
                    }
                }
                if (data.dialogueState) {
                    for (const [key, val] of Object.entries(data.dialogueState)) {
                        if (dialogueState.hasOwnProperty(key)) dialogueState[key] = val;
                    }
                }
                if (data.easterEggStages) {
                    for (const [key, val] of Object.entries(data.easterEggStages)) {
                        if (easterEggStages.hasOwnProperty(key)) {
                            easterEggStages[key].count = val.count || 0;
                            easterEggStages[key].triggered = new Set(val.triggered || []);
                        }
                    }
                }
                if (data.thoughtBubbles) {
                    thoughtBubbles.length = 0;
                    for (const item of data.thoughtBubbles) {
                        if (!thoughtBubbles.includes(item)) thoughtBubbles.push(item);
                    }
                }
                if (data.unlockedMusic) {
                    unlockedMusic.clear();
                    unlockedMusic.add('O'); // 始终保留默认
                    for (const item of data.unlockedMusic) {
                        if (item !== 'O') unlockedMusic.add(item);
                    }
                }
                if (data.currentMusicName && musicFileMap.has(data.currentMusicName)) {
                    currentMusicName = data.currentMusicName;
                    bgm.src = musicFileMap.get(currentMusicName);
                    bgm.load();
                }
                updateMusicCollectionDisplay();
                _loading = false;
                return true;
            } catch (e) {
                _loading = false;
                console.warn('读取存档失败:', e);
                return false;
            }
        }

        function clearGameData() {
            if (!confirm('确定要清空所有游戏记录吗？此操作不可撤销。')) return;
            localStorage.removeItem(SAVE_KEY);
            historyRecords.clear();
            const links = historyArea.querySelectorAll('.history-link');
            for (const link of links) link.remove();
            historyEmpty.style.display = 'inline';
            for (const key in dialogueState) dialogueState[key] = 0;
            for (const key in easterEggStages) {
                easterEggStages[key].count = 0;
                easterEggStages[key].triggered.clear();
            }
            thoughtBubbles.length = 0;
            unlockedMusic.clear();
            unlockedMusic.add('O');
            currentMusicName = 'O';
            bgm.src = musicFileMap.get('O');
            bgm.load();
            updateMusicCollectionDisplay();
            replyBox.innerHTML = '🗑️ 已清空所有记录。';
            saveGame();
        }
        clearHistoryBtn.addEventListener('click', clearGameData);

        // ---------- 对话队列 ----------
        const dialogueChains = {
            '你在哪|你在哪里|where': [
                { ask: '你在哪|where', reply: '我就在这里。', next: '这里|here' },
                { ask: '这里|here', reply: '这里就是您的所在。', next: '所在|place' },
                { ask: '所在|place', reply: '别处。', next: null }
            ],
            '加密怎么解？|加密怎么解|加密|解码': [
                { ask: '加密怎么解？|加密怎么解|加密|解码', reply: '提问解码的用具', next: '什么用具|什么|怎么问|用具' },
                { ask: '什么用具|什么|怎么问|用具', reply: '提问是：解码器。', next: null }
            ],
            '凯撒|caesar|凯撒密码|凯撒大帝': [
                { ask: '凯撒|caesar|凯撒密码', reply: '是的，凯撒，凯撒密码。', next: '密码|password|凯撒密码' },
                { ask: '密码|password|凯撒密码', reply: '密码不止一个', next: '告诉我|tellme|不止一个？|不止一个' },
                { ask: '告诉我|tellme|不止一个？|不止一个', reply: '提问是：我该怎么见你', next: null }
            ],
            '密码是什么|密码是啥|whatispassword': [
                { ask: '密码是什么|whatispassword', reply: '密码是：数字。', next: '数字|number' },
                { ask: '数字|number', reply: '数字是答案的所在。', next: '所在|place' },
                { ask: '所在|place', reply: '提问是：数字是多少。', next: null }
            ],
            '我该怎么见你|怎么见你|howtoseeyou': [
                { ask: '我该怎么见你|howtoseeyou', reply: '您真的想见？', next: '真的|really' },
                { ask: '真的|really', reply: '再为我说一遍吧', next: '真的|really|真的啊' },
                { ask: '真的|really|真的啊', reply: '值得注意的是：2026824948', next: null }
            ],
        };
        const stepAliasMap = {};
        for (const [chainName, steps] of Object.entries(dialogueChains)) {
            stepAliasMap[chainName] = [];
            for (let i = 0; i < steps.length; i++) {
                const askAliases = steps[i].ask.split('|').map(s => s.trim().toLowerCase());
                stepAliasMap[chainName].push({ aliases: askAliases, index: i });
            }
        }
        const dialogueState = {};
        for (const chainName in dialogueChains) dialogueState[chainName] = 0;

        function checkDialogue(input) {
            const lower = input.toLowerCase();
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                if (currentIdx > 0 && currentIdx < steps.length) {
                    const curAliases = stepAliasMap[chainName][currentIdx]?.aliases || [];
                    if (curAliases.includes(lower)) {
                        dialogueState[chainName] = currentIdx + 1;
                        saveGame();
                        return { reply: steps[currentIdx].reply, chainName, stepIndex: currentIdx, isNewChain: false, repeat: false };
                    }
                }
            }
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                if (currentIdx >= steps.length) continue;
                const curAliases = stepAliasMap[chainName][currentIdx]?.aliases || [];
                if (curAliases.includes(lower)) {
                    dialogueState[chainName] = currentIdx + 1;
                    saveGame();
                    return { reply: steps[currentIdx].reply, chainName, stepIndex: currentIdx, isNewChain: (currentIdx === 0), repeat: false };
                }
            }
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                let currentIdx = dialogueState[chainName];
                for (let i = currentIdx - 1; i >= 0; i--) {
                    const prevAliases = stepAliasMap[chainName][i]?.aliases || [];
                    if (prevAliases.includes(lower)) {
                        return { reply: steps[i].reply, chainName, stepIndex: i, isNewChain: false, repeat: true };
                    }
                }
            }
            return null;
        }

        // ---------- 思维泡沫 ----------
        const thoughtBubbles = [];

        function addThoughtBubble(text) {
            if (thoughtBubbles.includes(text)) return;
            thoughtBubbles.push(text);
            saveGame();
        }

        // ---------- 漂浮笔记 ----------
        let noteSpeed = 3;
        const noteItems = [];
        speedSlider.addEventListener('input', function() {
            noteSpeed = parseFloat(this.value);
            speedDisplay.textContent = noteSpeed;
        });

        function clearAllNotes() {
            return new Promise(resolve => {
                const items = noteContainer.querySelectorAll('.note-item');
                if (items.length === 0) { resolve(); return; }
                for (const el of items) el.classList.add('scale-out');
                setTimeout(() => {
                    const remaining = noteContainer.querySelectorAll('.note-item');
                    for (const el of remaining) if (el.parentNode) el.parentNode.removeChild(el);
                    noteItems.length = 0;
                    resolve();
                }, 600);
            });
        }

        function spawnNote(text, duration = 15000) {
            const el = document.createElement('div');
            el.className = 'note-item';
            el.textContent = text;
            const maxX = window.innerWidth - 260, maxY = window.innerHeight - 100;
            const x = 20 + Math.random() * (maxX - 40);
            const y = 20 + Math.random() * (maxY - 40);
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            const rot = (Math.random() - 0.5) * 12;
            el.style.setProperty('--rot', rot + 'deg');
            noteContainer.appendChild(el);
            noteItems.push({ el, x, y, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8, rot, angleSpeed: (Math.random() - 0.5) * 0.02, life: duration, born: Date.now() });
            setTimeout(() => {
                el.classList.add('scale-out');
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                    const idx = noteItems.findIndex(n => n.el === el);
                    if (idx !== -1) noteItems.splice(idx, 1);
                }, 600);
            }, duration);
            if (noteItems.length > 25) {
                const oldest = noteItems.shift();
                if (oldest.el.parentNode) oldest.el.parentNode.removeChild(oldest.el);
            }
        }

        function animateNotes() {
            const speedFactor = noteSpeed * 0.15;
            for (const n of noteItems) {
                n.x += n.vx * speedFactor;
                n.y += n.vy * speedFactor;
                const maxX = window.innerWidth - 260, maxY = window.innerHeight - 100;
                if (n.x < 0 || n.x > maxX) n.vx *= -1;
                if (n.y < 0 || n.y > maxY) n.vy *= -1;
                n.x = Math.max(0, Math.min(maxX, n.x));
                n.y = Math.max(0, Math.min(maxY, n.y));
                n.rot += n.angleSpeed * speedFactor * 0.5;
                n.el.style.left = n.x + 'px';
                n.el.style.top = n.y + 'px';
                n.el.style.transform = `rotate(${n.rot}deg)`;
            }
            requestAnimationFrame(animateNotes);
        }
        animateNotes();

        // ---------- 飞行弹窗系统 ----------
        let activePopup = null;

        function getRandomFlightPath() {
            return {
                startX: -60 + Math.random() * 120,
                startY: -80 + Math.random() * 40,
                midX: (Math.random() - 0.5) * 300,
                midY: -120 - Math.random() * 100,
                startRotate: -12 + Math.random() * 24,
                midRotate: 6 + Math.random() * 12,
                endRotate: -2 + Math.random() * 4
            };
        }

        function createFlyPopup(keyword, config, displayName) {
            if (activePopup) closeFlyPopup(activePopup);
            const popup = document.createElement('div');
            popup.className = 'fly-popup';
            popup.dataset.keyword = keyword;
            popup.innerHTML = `
                <div class="popup-title">✦ 页面碎片 · ${displayName}</div>
                <div class="popup-text">${config.text}</div>
                <button class="popup-btn">${config.buttonText || '继续'}</button>
            `;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const popupWidth = Math.min(380, viewportWidth - 40);
            const popupHeight = 200;
            const centerX = (viewportWidth - popupWidth) / 2;
            const centerY = (viewportHeight - popupHeight) / 2;
            popup.style.left = centerX + 'px';
            popup.style.top = centerY + 'px';
            popup.style.width = popupWidth + 'px';
            popup.style.opacity = '0';
            popup.style.transform = 'scale(0.5) rotate(-10deg)';
            document.body.appendChild(popup);

            const path = getRandomFlightPath();
            popup.style.setProperty('--start-x', path.startX + 'px');
            popup.style.setProperty('--start-y', path.startY + 'px');
            popup.style.setProperty('--start-rotate', path.startRotate + 'deg');
            popup.style.setProperty('--mid-x', path.midX + 'px');
            popup.style.setProperty('--mid-y', path.midY + 'px');
            popup.style.setProperty('--mid-rotate', path.midRotate + 'deg');
            popup.style.setProperty('--end-rotate', path.endRotate + 'deg');

            requestAnimationFrame(() => {
                popup.classList.add('animate-in');
                popup.style.opacity = '1';
            });

            const btn = popup.querySelector('.popup-btn');
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                // ✅ 点击按钮时解锁并播放音乐
                if (config.musicName && config.musicFile) {
                    addUnlockedMusic(config.musicName);
                    playMusic(config.musicName);
                }
                if (config.action && typeof config.action === 'function') {
                    config.action(popup);
                } else if (config.url) {
                    window.open(config.url, '_blank');
                    closeFlyPopup(popup);
                } else {
                    closeFlyPopup(popup);
                }
            });

            popup.addEventListener('click', function(e) {
                if (e.target === popup) closeFlyPopup(popup);
            });

            activePopup = popup;
            addHistoryRecord(keyword, displayName);

            setTimeout(() => {
                if (popup && popup.parentNode) closeFlyPopup(popup);
            }, 12000);

            return popup;
        }

        function closeFlyPopup(popup) {
            if (!popup || popup.classList.contains('fade-out')) return;
            popup.classList.remove('animate-in');
            popup.classList.add('fade-out');
            setTimeout(() => {
                if (popup.parentNode) popup.parentNode.removeChild(popup);
                if (activePopup === popup) activePopup = null;
            }, 350);
        }

        // ---------- 思维流淌 ----------
        let bubblingActive = false;
        let bubbleTimer = null;
        let bubbleQueue = [];
        let bubbleIntervalMs = 600;
        bubbleInterval.addEventListener('input', function() {
            bubbleIntervalMs = parseInt(this.value);
            intervalDisplay.textContent = bubbleIntervalMs + 'ms';
        });

        function toggleBubbling() {
            if (bubblingActive) {
                bubblingActive = false;
                if (bubbleTimer) clearTimeout(bubbleTimer);
                bubbleBtn.textContent = '💭 流淌思维';
                bubbleBtn.classList.remove('active');
                return;
            }
            if (thoughtBubbles.length === 0) {
                replyBox.innerHTML = '⚠️ 还没有任何“值得注意的是”的思考碎片，请思考，并且提问。';
                return;
            }
            clearAllNotes().then(() => {
                bubbleQueue = [...thoughtBubbles];
                bubblingActive = true;
                bubbleBtn.textContent = '⏹️ 停止流淌';
                bubbleBtn.classList.add('active');
                function nextBubble() {
                    if (!bubblingActive || bubbleQueue.length === 0) {
                        if (bubbleQueue.length === 0 && bubblingActive) replyBox.innerHTML = '💭 所有思维碎片已流淌完毕。';
                        bubblingActive = false;
                        bubbleBtn.textContent = '💭 流淌思维';
                        bubbleBtn.classList.remove('active');
                        return;
                    }
                    const text = '💭 ' + bubbleQueue.shift();
                    spawnNote(text, 15000);
                    bubbleTimer = setTimeout(nextBubble, bubbleIntervalMs);
                }
                nextBubble();
            });
        }
        bubbleBtn.addEventListener('click', toggleBubbling);

        const originalClear = clearGameData;
        clearGameData = function() {
            originalClear();
            if (bubblingActive) {
                bubblingActive = false;
                if (bubbleTimer) clearTimeout(bubbleTimer);
                bubbleBtn.textContent = '💭 流淌思维';
                bubbleBtn.classList.remove('active');
            }
        };
        clearHistoryBtn.removeEventListener('click', clearGameData);
        clearHistoryBtn.addEventListener('click', clearGameData);

        // ---------- 处理输入 ----------
        function handleUserInput() {
            const rawText = userInput.value.trim();
            if (rawText === '') { replyBox.innerHTML = '📝 请写下您的疑问……'; return; }
            const lowerText = rawText.toLowerCase();

            const dialogueResult = checkDialogue(rawText);
            if (dialogueResult !== null) {
                if (dialogueResult.isNewChain && !dialogueResult.repeat) {
                    let hasOtherActive = false;
                    for (const chainName in dialogueChains) {
                        if (chainName !== dialogueResult.chainName && dialogueState[chainName] > 0) {
                            hasOtherActive = true;
                            break;
                        }
                    }
                    if (hasOtherActive) {
                        for (const chainName in dialogueChains) dialogueState[chainName] = 0;
                        dialogueState[dialogueResult.chainName] = 1;
                        saveGame();
                    }
                }
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${dialogueResult.reply}`;
                if (dialogueResult.reply.includes('值得注意的是')) {
                    spawnNote('💭 ' + dialogueResult.reply, 15000);
                    addThoughtBubble(dialogueResult.reply);
                    saveGame();
                }
                userInput.value = ''; userInput.focus(); return;
            }

            let hasActive = false;
            for (const chainName in dialogueChains) {
                if (dialogueState[chainName] > 0) { hasActive = true; break; }
            }
            if (hasActive) {
                for (const chainName in dialogueChains) dialogueState[chainName] = 0;
                saveGame();
            }

            let matchedKey = null;
            let normalReply = null;
            for (const [key, value] of Object.entries(flatResponses)) {
                if (lowerText === key.toLowerCase()) {
                    matchedKey = key;
                    normalReply = value;
                    break;
                }
            }
            if (matchedKey) {
                let eggKey = eggAliasMap[lowerText] || null;
                let eggReply = null, triggeredThisTime = false;
                if (eggKey && easterEggStages.hasOwnProperty(eggKey)) {
                    const egg = easterEggStages[eggKey];
                    if (egg.triggered.size === egg.stages.length) { egg.count = 0; egg.triggered.clear(); }
                    egg.count += 1;
                    const sortedStages = [...egg.stages].sort((a, b) => a.at - b.at);
                    for (const stage of sortedStages) {
                        if (egg.count >= stage.at && !egg.triggered.has(stage.at)) {
                            eggReply = stage.reply;
                            egg.triggered.add(stage.at);
                            triggeredThisTime = true;
                            saveGame();
                            break;
                        }
                    }
                }
                const finalReply = triggeredThisTime && eggReply ? eggReply : normalReply;
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${finalReply}`;
                if (finalReply.includes('值得注意的是')) {
                    spawnNote('💭 ' + finalReply, 15000);
                    addThoughtBubble(finalReply);
                    saveGame();
                }
                const popupMatch = flatPopupMap[lowerText];
                if (popupMatch) {
                    const { key, config } = popupMatch;
                    const displayName = popupDisplayNames[key] || key;
                    setTimeout(() => createFlyPopup(key, config, displayName), 300);
                } else {
                    if (activePopup) closeFlyPopup(activePopup);
                }
                userInput.value = ''; userInput.focus(); return;
            }

            const popupMatch = flatPopupMap[lowerText];
            if (popupMatch) {
                const { key, config } = popupMatch;
                const displayName = popupDisplayNames[key] || key;
                const replyText = '您唤醒了某个碎片。';
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${replyText}`;
                if (replyText.includes('值得注意的是')) {
                    spawnNote('💭 ' + replyText, 15000);
                    addThoughtBubble(replyText);
                    saveGame();
                }
                setTimeout(() => createFlyPopup(key, config, displayName), 300);
                userInput.value = ''; userInput.focus(); return;
            }

            replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${defaultReply}`;
            if (activePopup) closeFlyPopup(activePopup);
            userInput.value = ''; userInput.focus();
        }
        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); handleUserInput(); }
        });

        // ---------- 音乐控制 ----------
        let isMusicPlaying = false;
        function updateMusicButton() {
            musicToggle.innerHTML = isMusicPlaying ? '<span class="icon">🔇</span> 关闭音乐' : '<span class="icon">🔊</span> 开启音乐';
        }

        let musicListOpen = false;
        musicCollectionBtn.addEventListener('click', () => {
            musicListOpen = !musicListOpen;
            if (musicListOpen) {
                musicCollectionList.classList.add('open');
                musicCollectionBtn.innerHTML = '<span class="icon">🎵</span> 收起收藏';
            } else {
                musicCollectionList.classList.remove('open');
                musicCollectionBtn.innerHTML = '<span class="icon">🎵</span> 音乐收藏';
            }
        });

        window.addEventListener('load', () => {
            const hasSave = loadGame();
            if (hasSave) {
                replyBox.innerHTML = '📂 已恢复存档。';
                if (thoughtBubbles.length > 0) console.log('🧠 已恢复 ' + thoughtBubbles.length + ' 个思维碎片');
                if (unlockedMusic.size > 0) console.log('🎵 已恢复 ' + unlockedMusic.size + ' 首音乐');
                if (currentMusicName && musicFileMap.has(currentMusicName)) {
                    bgm.src = musicFileMap.get(currentMusicName);
                    bgm.load();
                    bgm.play().then(() => { isMusicPlaying = true; updateMusicButton(); }).catch(() => {});
                }
            } else {
                bgm.src = musicFileMap.get('O');
                bgm.load();
                setTimeout(() => {
                    bgm.play().then(() => { isMusicPlaying = true; updateMusicButton(); }).catch(() => {});
                }, 300);
            }
            updateMusicCollectionDisplay();
        });

        function tryAutoPlay() {
            if (isMusicPlaying) return;
            bgm.play().then(() => { isMusicPlaying = true; updateMusicButton(); }).catch(() => {});
            document.removeEventListener('click', tryAutoPlay);
            document.removeEventListener('touchstart', tryAutoPlay);
        }
        document.addEventListener('click', tryAutoPlay, { once: true });
        document.addEventListener('touchstart', tryAutoPlay, { once: true });

        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
                updateMusicButton();
            } else {
                bgm.play().then(() => { isMusicPlaying = true; updateMusicButton(); }).catch((err) => {
                    alert('音乐播放失败，请检查音乐文件是否存在。');
                    console.warn(err);
                });
            }
        });

        window.addEventListener('beforeunload', () => { bgm.pause(); });

        console.log('❓ 粗糙解谜页已加载。弹窗点击按钮后播放对应音乐，存档正常。');
    </script>
</body>
</html>
