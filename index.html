<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>您为了什么而来？</title>
    <style>
        /* ---------- 基础样式 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Courier New', Courier, 'PingFang SC', monospace;
            padding: 20px;
            position: relative;
        }

        .rough-card {
            max-width: 640px;
            width: 100%;
            padding: 40px 32px 44px;
            background: #111111;
            border: 2px solid #2a2a2a;
            box-shadow: 0 8px 0 #1a1a1a, 0 12px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            transition: 0.2s;
            z-index: 1;
        }

        .rough-card::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 1px dashed #2a2a2a;
            pointer-events: none;
            opacity: 0.3;
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #c0b8a8;
            text-shadow: 0 0 6px rgba(200, 180, 150, 0.1);
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 14px;
        }

        .title span {
            margin-right: 6px;
            font-size: 1.6rem;
        }

        .hint {
            text-align: center;
            color: #5a5a5a;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
            font-style: normal;
            padding-bottom: 10px;
            border-bottom: 1px dashed #222;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            position: relative;
            z-index: 2;
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #333;
            background: #0d0d0d;
            color: #c8c0b0;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: 0.15s;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
        }
        .input-area input:focus {
            border-color: #666;
            background: #111;
        }
        .input-area input::placeholder {
            color: #3a3a3a;
            font-style: italic;
        }

        .input-area button {
            padding: 14px 28px;
            border: 2px solid #444;
            background: #1a1a1a;
            color: #b0a898;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .input-area button:hover {
            background: #222;
            border-color: #666;
            color: #d0c8b8;
        }
        .input-area button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }

        .reply-box {
            background: #0a0a0a;
            border: 2px solid #222;
            padding: 18px 20px;
            min-height: 80px;
            margin-bottom: 16px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9);
            font-size: 1rem;
            line-height: 1.6;
            color: #b8b0a0;
            word-break: break-word;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            position: relative;
            z-index: 1;
        }
        .reply-box .placeholder {
            color: #3a3a3a;
            font-style: italic;
        }

        /* ---------- 飞行弹窗 ---------- */
        .fly-popup {
            position: fixed;
            pointer-events: auto;
            background: #1a1a1a;
            border: 2px solid #444;
            padding: 24px 28px 28px;

            transition: none;
            font-family: 'Courier New', monospace;
            z-index: 1000;
        }

        .fly-popup .popup-title {
            color: #8a8a7a;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1px dashed #333;
            padding-bottom: 6px;

        .fly-popup .popup-text {
            color: #c8c0b0;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

            border: 2px solid #444;
            color: #b0a898;
            padding: 6px 24px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 3px 0 #0a0a0a;
        }
        .fly-popup .popup-btn:hover {

            border-color: #666;
            color: #d0c8b8;
        }
        .fly-popup .popup-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }

        .fly-popup.animate-in {
            animation: flyIn 0.9s cubic-bezier(0.22, 0.9, 0.36, 1.1) forwards;
        }

        @keyframes flyIn {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(var(--start-rotate, -10deg)) translate(var(--start-x, 0px), var(--start-y, 0px));
            }
            40% {
                opacity: 0.9;
                transform: scale(1.05) rotate(var(--mid-rotate, 5deg)) translate(var(--mid-x, 0px), var(--mid-y, 0px));
            }
            70% {
                transform: scale(0.98) rotate(var(--end-rotate, -2deg)) translate(0px, 0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg) translate(0px, 0px);
            }
        }

        .fly-popup.fade-out {
            animation: fadeOut 0.3s ease forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.8) rotate(10deg); }
        }

        /* ---------- 历史记录栏 ---------- */
        .history-area {
            margin-top: 20px;
            border-top: 1px dashed #222;
            padding-top: 16px;

            color: #5a5a5a;

            font-size: 0.7rem;

            margin-left: 6px;
        }
        .clear-history-btn:hover {
            background: #2a1a1a;
            border-color: #5a3a3a;
            color: #8a6a6a;
        }

        /* ---------- 💭 漂浮笔记 ---------- */
        .note-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .note-item {
            position: absolute;
            background: rgba(20, 18, 16, 0.9);
            border: 1px solid #3a3a3a;
            color: #b8b0a0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            padding: 10px 14px;
            max-width: 240px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(2px);
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            letter-spacing: 0.3px;
            border-radius: 2px;
            transform-origin: center;
            opacity: 0;
            animation: noteSlideIn 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
            transition: none;
        }

        @keyframes noteSlideIn {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(30px) rotate(var(--rot, 0deg));
            }
            100% {
                opacity: 0.9;
                transform: scale(1) translateY(0) rotate(var(--rot, 0deg));
            }
        }

        /* 缩小消失动画（替代淡出） */
        .note-item.scale-out {
            animation: scaleOut 0.5s ease forwards !important;
            opacity: 1;
        }

        @keyframes scaleOut {
            0% {
                transform: scale(1) rotate(var(--rot, 0deg));
                opacity: 0.9;
            }
            100% {
                transform: scale(0.1) rotate(calc(var(--rot, 0deg) + 20deg));
                opacity: 0;
            }
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
            padding-top: 12px;
            border-top: 1px dashed #222;
            flex-wrap: wrap;

            color: #5a5a5a;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
        }

        .controls-row input[type="range"] {
            width: 80px;
            height: 4px;
            background: #333;
            outline: none;
            border: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .controls-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #6a6a5a;
            border: 1px solid #444;
            cursor: pointer;
            border-radius: 0;
        }

        .controls-row .speed-value {
            color: #8a8a7a;
            font-size: 0.75rem;
            min-width: 24px;
            text-align: center;
        }

        .controls-row .btn-bubble {
            background: #1a1a1a;
            border: 2px solid #444;
            color: #b0a898;
            padding: 6px 18px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 0 #0a0a0a;
        }
        .controls-row .btn-bubble:hover {
            background: #222;
            border-color: #666;
            color: #d0c8b8;
        }
        .controls-row .btn-bubble:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }
        .controls-row .btn-bubble.active {
            border-color: #7a6a5a;
            background: #1f1a15;
            color: #d0c0a8;
        }

        .music-area {
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }
        .music-btn {
            background: #1a1a1a;
            border: 2px solid #333;
            color: #8a8a7a;
            padding: 10px 32px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .music-btn:hover {
            background: #222;
            border-color: #555;
            color: #b0a898;
        }
        .music-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }
        .music-btn .icon {
            margin-right: 8px;
        }

        @media (max-width: 550px) {
            .rough-card { padding: 24px 16px 30px; }
            .title { font-size: 1.4rem; }
            .input-area { flex-wrap: wrap; }
            .input-area input { flex: 1 1 100%; }
            .input-area button { flex: 1 1 100%; justify-content: center; }
            .reply-box { font-size: 0.9rem; padding: 14px; min-height: 60px; }
            .fly-popup { min-width: 200px; max-width: 300px; padding: 18px 20px 22px; left: 50% !important; transform: translateX(-50%); }
            .fly-popup .popup-text { font-size: 0.95rem; }
            .music-btn { padding: 8px 20px; font-size: 0.8rem; }
            .history-area { gap: 6px; }
            .history-link { font-size: 0.7rem; padding: 3px 10px; }
            .controls-row input[type="range"] { width: 60px; }
            .controls-row .btn-bubble { padding: 4px 12px; font-size: 0.7rem; }
        }
    </style>
</head>

        // ---------- 历史记录 ----------
        const historyRecords = new Set();

        // ---------- 🧠 思维泡沫 ----------
        const thoughtBubbles = [];

        function addThoughtBubble(text) {
            if (thoughtBubbles.includes(text)) return;
            thoughtBubbles.push(text);
            saveGame();
        }

        // ---------- 💭 漂浮笔记系统 ----------
        let noteSpeed = 3;
        const noteItems = [];

        speedSlider.addEventListener('input', function() {
            noteSpeed = parseFloat(this.value);
            speedDisplay.textContent = noteSpeed;
        });

        // 清空所有笔记（缩小消失）
        function clearAllNotes() {
            return new Promise((resolve) => {
                const items = noteContainer.querySelectorAll('.note-item');
                if (items.length === 0) {
                    resolve();
                    return;
                }
                for (const el of items) {
                    el.classList.add('scale-out');
                }
                // 等待动画完成（0.5s + 缓冲）
                setTimeout(() => {
                    const remaining = noteContainer.querySelectorAll('.note-item');
                    for (const el of remaining) {
                        if (el.parentNode) el.parentNode.removeChild(el);
                    }
                    noteItems.length = 0;
                    resolve();
                }, 600);
            });
        }

        function spawnNote(text, duration = 15000) {
            const el = document.createElement('div');
            el.className = 'note-item';
            el.textContent = text;

            const maxX = window.innerWidth - 260;
            const maxY = window.innerHeight - 100;
            const x = 20 + Math.random() * (maxX - 40);
            const y = 20 + Math.random() * (maxY - 40);
            el.style.left = x + 'px';
            el.style.top = y + 'px';

            const rot = (Math.random() - 0.5) * 12;
            el.style.setProperty('--rot', rot + 'deg');

            noteContainer.appendChild(el);
            noteItems.push({
                el: el,
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                rot: rot,
                angleSpeed: (Math.random() - 0.5) * 0.02,
                life: duration,
                born: Date.now()
            });

            // 自动缩小消失
            setTimeout(() => {
                el.classList.add('scale-out');
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                    const idx = noteItems.findIndex(n => n.el === el);
                    if (idx !== -1) noteItems.splice(idx, 1);
                }, 600);
            }, duration);

            // 限制最大数量
            if (noteItems.length > 25) {
                const oldest = noteItems.shift();
                if (oldest.el.parentNode) oldest.el.parentNode.removeChild(oldest.el);
            }
        }

        // 动画循环（缓慢漂浮）
        function animateNotes() {
            const speedFactor = noteSpeed * 0.15;
            for (const n of noteItems) {
                n.x += n.vx * speedFactor;
                n.y += n.vy * speedFactor;

                const maxX = window.innerWidth - 260;
                const maxY = window.innerHeight - 100;
                if (n.x < 0 || n.x > maxX) n.vx *= -1;
                if (n.y < 0 || n.y > maxY) n.vy *= -1;
                n.x = Math.max(0, Math.min(maxX, n.x));
                n.y = Math.max(0, Math.min(maxY, n.y));

                n.rot += n.angleSpeed * speedFactor * 0.5;
                n.el.style.left = n.x + 'px';
                n.el.style.top = n.y + 'px';
                n.el.style.transform = `rotate(${n.rot}deg)`;
            }
            requestAnimationFrame(animateNotes);
        }
        animateNotes();

        // ---------- 对话队列 ----------
        const dialogueChains = {
            '你在哪': [
                { ask: '你在哪', reply: '我就在这里。', next: '这里' },
                { ask: '这里', reply: '这里就是您的所在。', next: '所在' },
                { ask: '所在', reply: '别处。', next: null }
            ],
            '我该怎么见你': [
                { ask: '我该怎么见你', reply: '您真的想见？', next: '真的' },
                { ask: '真的', reply: '再为我说一遍吧', next: '真的' },
                { ask: '真的', reply: '2026824948', next: null }
            ],
        };

        const dialogueState = {};
        for (const chainName in dialogueChains) {
            dialogueState[chainName] = 0;
        }

        function checkDialogue(input) {
            const lower = input.toLowerCase();
            for (const chainName in dialogueChains) {
                const steps = dialogueChains[chainName];
                const currentIdx = dialogueState[chainName];
                if (currentIdx >= steps.length) continue;
                const step = steps[currentIdx];
                if (lower === step.ask.toLowerCase()) {
                    dialogueState[chainName] = currentIdx + 1;
                    saveGame();
                    return step.reply;
                }
            }
            return null;
        }

        // ============================================================
        //  🗄️ 存档系统
        // ============================================================
        let _loading = false;

        function createHistoryLink(keyword, displayName) {
            const link = document.createElement('span');
            link.className = 'history-link';
            link.innerHTML = `<span class="link-icon">📄</span> ${displayName || keyword}`;
            link.addEventListener('click', function() {
                const config = popupConfig[keyword];
                if (config && config.url) {
                    window.open(config.url, '_blank');
                } else {
                    replyBox.innerHTML = `📖 已解锁页面：${displayName || keyword}\n\n（尚未关联新网页）`;
                }
            });
            historyArea.appendChild(link);
        }

        function addHistoryRecord(keyword, displayName) {
            if (historyRecords.has(keyword)) return;
            historyRecords.add(keyword);
            if (historyEmpty) historyEmpty.style.display = 'none';
            createHistoryLink(keyword, displayName || keyword);
            if (!_loading) saveGame();
        }

        function saveGame() {
            try {
                const data = {
                    historyRecords: Array.from(historyRecords),
                    dialogueState: { ...dialogueState },
                    easterEggStages: {},
                    thoughtBubbles: thoughtBubbles
                };
                for (const [key, egg] of Object.entries(easterEggStages)) {
                    data.easterEggStages[key] = {
                        count: egg.count,
                        triggered: Array.from(egg.triggered)
                    };
                }
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('保存失败:', e);
            }
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (!saved) return false;
            try {
                _loading = true;
                const data = JSON.parse(saved);

                if (data.historyRecords && data.historyRecords.length > 0) {
                    historyEmpty.style.display = 'none';
                    for (const item of data.historyRecords) {
                        historyRecords.add(item);
                        createHistoryLink(item, item);
                    }
                }

                if (data.dialogueState) {
                    for (const [key, val] of Object.entries(data.dialogueState)) {
                        if (dialogueState.hasOwnProperty(key)) {
                            dialogueState[key] = val;
                        }
                    }
                }

                if (data.easterEggStages) {
                    for (const [key, val] of Object.entries(data.easterEggStages)) {
                        if (easterEggStages.hasOwnProperty(key)) {
                            easterEggStages[key].count = val.count || 0;
                            easterEggStages[key].triggered = new Set(val.triggered || []);
                        }
                    }
                }

                if (data.thoughtBubbles && data.thoughtBubbles.length > 0) {
                    thoughtBubbles.length = 0;
                    for (const item of data.thoughtBubbles) {
                        if (!thoughtBubbles.includes(item)) {
                            thoughtBubbles.push(item);
                        }
                    }
                }

                _loading = false;
                return true;
            } catch (e) {
                _loading = false;
                console.warn('读取存档失败:', e);
                return false;
            }
        }

        function clearGameData() {
            if (!confirm('确定要清空所有游戏记录吗？此操作不可撤销。')) return;

            localStorage.removeItem(SAVE_KEY);

            historyRecords.clear();
            const links = historyArea.querySelectorAll('.history-link');
            for (const link of links) link.remove();
            historyEmpty.style.display = 'inline';

            for (const key in dialogueState) {
                dialogueState[key] = 0;
            }

            for (const key in easterEggStages) {
                easterEggStages[key].count = 0;
                easterEggStages[key].triggered.clear();
            }

            thoughtBubbles.length = 0;

            replyBox.innerHTML = '🗑️ 已清空所有记录。';
            saveGame();
        }

        clearHistoryBtn.addEventListener('click', clearGameData);

        // ============================================================
        //  🌀 飞行弹窗系统
        // ============================================================
        let activePopup = null;

        function getRandomFlightPath() {
            const startX = -60 + Math.random() * 120;
            const startY = -80 + Math.random() * 40;
            const midX = (Math.random() - 0.5) * 300;
            const midY = -120 - Math.random() * 100;
            const startRotate = -12 + Math.random() * 24;
            const midRotate = 6 + Math.random() * 12;
            const endRotate = -2 + Math.random() * 4;
            return { startX, startY, midX, midY, startRotate, midRotate, endRotate };
        }

        function createFlyPopup(keyword, config) {
            if (activePopup) closeFlyPopup(activePopup);
            const popup = document.createElement('div');
            popup.className = 'fly-popup';
            popup.dataset.keyword = keyword;
            popup.innerHTML = `
                <div class="popup-title">✦ 页面碎片 · ${keyword}</div>
                <div class="popup-text">${config.text}</div>
                <button class="popup-btn">${config.buttonText || '继续'}</button>
            `;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const popupWidth = Math.min(380, viewportWidth - 40);
            const popupHeight = 200;
            const centerX = (viewportWidth - popupWidth) / 2;
            const centerY = (viewportHeight - popupHeight) / 2;
            popup.style.left = centerX + 'px';
            popup.style.top = centerY + 'px';
            popup.style.width = popupWidth + 'px';
            popup.style.opacity = '0';
            popup.style.transform = 'scale(0.5) rotate(-10deg)';
            document.body.appendChild(popup);

            const path = getRandomFlightPath();
            popup.style.setProperty('--start-x', path.startX + 'px');
            popup.style.setProperty('--start-y', path.startY + 'px');
            popup.style.setProperty('--start-rotate', path.startRotate + 'deg');
            popup.style.setProperty('--mid-x', path.midX + 'px');
            popup.style.setProperty('--mid-y', path.midY + 'px');
            popup.style.setProperty('--mid-rotate', path.midRotate + 'deg');
            popup.style.setProperty('--end-rotate', path.endRotate + 'deg');

            requestAnimationFrame(() => {
                popup.classList.add('animate-in');
                popup.style.opacity = '1';
            });

            const btn = popup.querySelector('.popup-btn');
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (config.action && typeof config.action === 'function') {
                    config.action(popup);
                } else if (config.url) {
                    window.open(config.url, '_blank');
                    closeFlyPopup(popup);
                } else {
                    closeFlyPopup(popup);
                }
            });

            popup.addEventListener('click', function(e) {
                if (e.target === popup) closeFlyPopup(popup);
            });

            activePopup = popup;
            addHistoryRecord(keyword, keyword);

            setTimeout(() => {
                if (popup && popup.parentNode) closeFlyPopup(popup);
            }, 12000);

            return popup;
        }

        function closeFlyPopup(popup) {
            if (!popup || popup.classList.contains('fade-out')) return;
            popup.classList.remove('animate-in');
            popup.classList.add('fade-out');
            setTimeout(() => {
                if (popup.parentNode) popup.parentNode.removeChild(popup);
                if (activePopup === popup) activePopup = null;
            }, 350);
        }

        // ============================================================
        //  💭 思维流淌（统一效果，缩小消失）
        // ============================================================
        let bubblingActive = false;
        let bubbleTimer = null;
        let bubbleQueue = [];
        let bubbleIntervalMs = 600;

        bubbleInterval.addEventListener('input', function() {
            bubbleIntervalMs = parseInt(this.value);
            intervalDisplay.textContent = bubbleIntervalMs + 'ms';
        });

        function toggleBubbling() {
            if (bubblingActive) {
                // 停止
                bubblingActive = false;
                if (bubbleTimer) {
                    clearTimeout(bubbleTimer);
                    bubbleTimer = null;
                }
                bubbleBtn.textContent = '💭 流淌思维';
                bubbleBtn.classList.remove('active');
                return;
            }

            if (thoughtBubbles.length === 0) {
                replyBox.innerHTML = '⚠️ 还没有任何“值得注意的是”的思考碎片，先触发一些彩蛋吧。';
                return;
            }

            // 清空现有笔记
            clearAllNotes().then(() => {
                bubbleQueue = [...thoughtBubbles];
                bubblingActive = true;
                bubbleBtn.textContent = '⏹️ 停止流淌';
                bubbleBtn.classList.add('active');

                function nextBubble() {
                    if (!bubblingActive || bubbleQueue.length === 0) {
                        if (bubbleQueue.length === 0 && bubblingActive) {
                            replyBox.innerHTML = '💭 所有思维碎片已流淌完毕。';
                        }
                        bubblingActive = false;
                        bubbleBtn.textContent = '💭 流淌思维';
                        bubbleBtn.classList.remove('active');
                        return;
                    }

                    const text = '💭 ' + bubbleQueue.shift();
                    spawnNote(text, 15000);

                    bubbleTimer = setTimeout(nextBubble, bubbleIntervalMs);
                }

                nextBubble();
            });
        }

        bubbleBtn.addEventListener('click', toggleBubbling);

        const originalClear = clearGameData;
        clearGameData = function() {
            originalClear();
            if (bubblingActive) {
                bubblingActive = false;
                if (bubbleTimer) {
                    clearTimeout(bubbleTimer);
                    bubbleTimer = null;
                }
                bubbleBtn.textContent = '💭 流淌思维';
                bubbleBtn.classList.remove('active');
            }
        };
        clearHistoryBtn.removeEventListener('click', clearGameData);
        clearHistoryBtn.addEventListener('click', clearGameData);

        // ============================================================
        //  📝 处理输入
        // ============================================================
        function handleUserInput() {
            const rawText = userInput.value.trim();
            if (rawText === '') {
                replyBox.innerHTML = '📝 请写下您的疑问……';
                return;
            }

            const lowerText = rawText.toLowerCase();

            const dialogueReply = checkDialogue(rawText);
            if (dialogueReply !== null) {
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${dialogueReply}`;
                if (dialogueReply.includes('值得注意的是')) {
                    spawnNote('💭 ' + dialogueReply, 15000);
                    addThoughtBubble(dialogueReply);
                    saveGame();
                }
                userInput.value = '';
                userInput.focus();
                return;
            }

            let matchedKey = null;
            let normalReply = null;

            for (const [key, value] of Object.entries(responses)) {
                if (lowerText === key.toLowerCase()) {
                    matchedKey = key;
                    normalReply = value;
                    break;
                }
            }

            if (matchedKey) {
                const matchedKeyLower = matchedKey.toLowerCase();
                let eggReply = null;
                let triggeredThisTime = false;

                if (easterEggStages.hasOwnProperty(matchedKeyLower)) {
                    const egg = easterEggStages[matchedKeyLower];
                    if (egg.triggered.size === egg.stages.length) {
                        egg.count = 0;
                        egg.triggered.clear();
                    }
                    egg.count += 1;
                    const sortedStages = [...egg.stages].sort((a, b) => a.at - b.at);
                    for (const stage of sortedStages) {
                        if (egg.count >= stage.at && !egg.triggered.has(stage.at)) {
                            eggReply = stage.reply;
                            egg.triggered.add(stage.at);
                            triggeredThisTime = true;
                            saveGame();
                            break;
                        }
                    }
                }

                let finalReply = triggeredThisTime && eggReply ? eggReply : normalReply;
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${finalReply}`;

                if (finalReply.includes('值得注意的是')) {
                    spawnNote('💭 ' + finalReply, 15000);
                    addThoughtBubble(finalReply);
                    saveGame();
                }

                if (popupConfig.hasOwnProperty(matchedKeyLower)) {
                    const config = popupConfig[matchedKeyLower];
                    setTimeout(() => {
                        createFlyPopup(matchedKey, config);
                    }, 300);
                } else {
                    if (activePopup) closeFlyPopup(activePopup);
                }

                userInput.value = '';
                userInput.focus();
                return;
            }

            const popupMatch = Object.keys(popupConfig).find(key => lowerText === key.toLowerCase());
            if (popupMatch) {
                const config = popupConfig[popupMatch];
                const replyText = '您唤醒了某个碎片。';
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${replyText}`;
                if (replyText.includes('值得注意的是')) {
                    spawnNote('💭 ' + replyText, 15000);
                    addThoughtBubble(replyText);
                    saveGame();
                }
                setTimeout(() => {
                    createFlyPopup(popupMatch, config);
                }, 300);
                userInput.value = '';
                userInput.focus();
                return;
            }

            replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${defaultReply}`;
            if (activePopup) closeFlyPopup(activePopup);
            userInput.value = '';
            userInput.focus();
        }

        // ---------- 事件绑定 ----------
        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleUserInput();
            }
        });

        // ---------- 音乐控制 ----------
        let isMusicPlaying = false;

        window.addEventListener('load', () => {
            const hasSave = loadGame();
            if (hasSave) {
                replyBox.innerHTML = '📂 已恢复存档。';
                if (thoughtBubbles.length > 0) {
                    console.log('🧠 已恢复 ' + thoughtBubbles.length + ' 个思维碎片');
                }
            }

            setTimeout(() => {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    musicToggle.innerHTML = '<span class="icon">🔇</span> 关闭音乐';
                }).catch(() => {});
            }, 300);
        });

        function tryAutoPlay() {
            if (isMusicPlaying) return;
            bgm.play().then(() => {
                isMusicPlaying = true;
                musicToggle.innerHTML = '<span class="icon">🔇</span> 关闭音乐';
            }).catch(() => {});
            document.removeEventListener('click', tryAutoPlay);
            document.removeEventListener('touchstart', tryAutoPlay);
        }
        document.addEventListener('click', tryAutoPlay, { once: true });
        document.addEventListener('touchstart', tryAutoPlay, { once: true });

        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
                musicToggle.innerHTML = '<span class="icon">🔊</span> 开启音乐';
            } else {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    musicToggle.innerHTML = '<span class="icon">🔇</span> 关闭音乐';
                }).catch((err) => {
                    alert('音乐播放失败，请检查 bgm/O.mp3 是否存在。');
                    console.warn('播放错误:', err);
                });
            }
        });

        window.addEventListener('beforeunload', () => {
            bgm.pause();
        });

        console.log('❓ 粗糙解谜页已加载。笔记消失改为缩小动画，效果明显。');
    </script>
</body>
</html>
