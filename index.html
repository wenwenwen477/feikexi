<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>您为了什么而来？</title>
    <style>
        /* ---------- 极简粗糙风格 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Courier New', Courier, 'PingFang SC', monospace;
            padding: 20px;
        }

        .rough-card {
            max-width: 640px;
            width: 100%;
            padding: 40px 32px 44px;
            background: #111111;
            border: 2px solid #2a2a2a;
            box-shadow: 0 8px 0 #1a1a1a, 0 12px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            transition: 0.2s;
        }

        .rough-card::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 1px dashed #2a2a2a;
            pointer-events: none;
            opacity: 0.3;
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #c0b8a8;
            text-shadow: 0 0 6px rgba(200, 180, 150, 0.1);
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 14px;
        }

        .title span {
            margin-right: 6px;
            font-size: 1.6rem;
        }

        .hint {
            text-align: center;
            color: #5a5a5a;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
            font-style: normal;
            padding-bottom: 10px;
            border-bottom: 1px dashed #222;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #333;
            background: #0d0d0d;
            color: #c8c0b0;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: 0.15s;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
        }
        .input-area input:focus {
            border-color: #666;
            background: #111;
        }
        .input-area input::placeholder {
            color: #3a3a3a;
            font-style: italic;
        }

        .input-area button {
            padding: 14px 28px;
            border: 2px solid #444;
            background: #1a1a1a;
            color: #b0a898;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .input-area button:hover {
            background: #222;
            border-color: #666;
            color: #d0c8b8;
        }
        .input-area button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }

        .reply-box {
            background: #0a0a0a;
            border: 2px solid #222;
            padding: 18px 20px;
            min-height: 80px;
            margin-bottom: 28px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9);
            font-size: 1rem;
            line-height: 1.6;
            color: #b8b0a0;
            word-break: break-word;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
        }
        .reply-box .placeholder {
            color: #3a3a3a;
            font-style: italic;
        }

        .music-area {
            display: flex;
            justify-content: center;
        }
        .music-btn {
            background: #1a1a1a;
            border: 2px solid #333;
            color: #8a8a7a;
            padding: 10px 32px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .music-btn:hover {
            background: #222;
            border-color: #555;
            color: #b0a898;
        }
        .music-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }
        .music-btn .icon {
            margin-right: 8px;
        }

        @media (max-width: 550px) {
            .rough-card {
                padding: 24px 16px 30px;
            }
            .title {
                font-size: 1.4rem;
            }
            .input-area {
                flex-wrap: wrap;
            }
            .input-area input {
                flex: 1 1 100%;
            }
            .input-area button {
                flex: 1 1 100%;
                justify-content: center;
            }
            .reply-box {
                font-size: 0.9rem;
                padding: 14px;
                min-height: 60px;
            }
            .music-btn {
                padding: 8px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="rough-card">
        <div class="title">
            <span>❓</span> 您为了什么而来？
        </div>
        <div class="hint">您可以提问，或者拆开网页代码。</div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入你想说的话…" autofocus />
            <button id="sendBtn">询问</button>
        </div>

        <div class="reply-box" id="replyBox">
            <span class="placeholder">💬 等待您的提问……</span>
        </div>

        <div class="music-area">
            <button class="music-btn" id="musicToggle">
                <span class="icon">🔊</span> 关闭音乐
            </button>
        </div>
    </div>

    <!-- ===== 背景音乐 (bgm/O.mp3) ===== -->
    <audio id="bgm" loop>
        <source src="bgm/O.mp3" type="audio/mpeg">
        你的浏览器不支持 audio 标签。
    </audio>

    <script>
        // ---------- DOM ----------
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const replyBox = document.getElementById('replyBox');
        const bgm = document.getElementById('bgm');
        const musicToggle = document.getElementById('musicToggle');

        // ---------- 普通问答词典 ----------
        const responses = {
            '你好': '您好……希望您不虚此行。',
            '我': '您。',
            '你': '您的所见。',
            '闹麻了': '我没有和您闹呀……',
            '池塘': '我们路过了那里。',
            '未来': '未来。',
            '我好': '我也很好，很高兴再次见到您。',
            '你是谁': '我是回答。',
            '为什么': '因为您在此处。',
            '别处': '是的，别处……',
            'somewhere': 'Yes,somewhere……',
            '钥匙': '这里没有钥匙。',
            '书房': '这里没有书房，但……改天可以有。',
            '秘密': '秘密不在我的答案里，而在我与您相处的每个日夜里。',
            '答案': '答案在此处，您可以掘地三尺。',
            '我喜欢你': '能自如表达善意的您……同样值得被喜欢。',
            'help': 'Key Words',
            '帮助': '回想我们交流里的关键词',
        };

        const defaultReply = '输入 “帮助” 以获得指引。';

        // ---------- 🥚 连续彩蛋阶段系统 (同一个关键词，连续触发多个彩蛋) ----------
        // 每个关键词维护一个计数，以及一个阶段数组。
        // 每个阶段包含 { at: 触发次数, reply: 彩蛋回复 }
        // 当计数达到某个阶段的 at 值时，触发该彩蛋，且每个阶段只触发一次。
        const easterEggStages = {
            // 示例：输入"你好" 第3次触发彩蛋1，第4次触发彩蛋2，第5次触发彩蛋3
            '你好': {
                count: 0,
                stages: [
                    { at: 3, reply: '我感到温暖。' },
                    { at: 4, reply: '回应的不是我。' },
                    { at: 5, reply: '在等您，我，或者……' }
                ],
                // 用于记录已触发的阶段 (存储 at 值)
                triggered: new Set()
            },
            // 示例：输入"为什么" 第3次触发一个，第6次触发另一个
            '为什么': {
                count: 0,
                stages: [
                    { at: 3, reply: '因为您在此处。' },
                    { at: 6, reply: '求知若渴。' }
                ],
                triggered: new Set()
            },
            // 示例：输入"我" 第2次触发
            '我': {
                count: 0,
                stages: [
                    { at: 2, reply: '您在……寻找您自己？' },
                    { at: 4, reply: '自言自语。' }
                ],
                triggered: new Set()
            }
            // 你可以在这里随意添加更多关键词及其阶段
            // 例如：
            // '秘密': {
            //     count: 0,
            //     stages: [
            //         { at: 2, reply: '🥚 您对秘密很执着……' },
            //         { at: 5, reply: '🥚 好吧，秘密就是对话本身。' }
            //     ],
            //     triggered: new Set()
            // }
        };

        // ---------- 处理输入 ----------
        function handleUserInput() {
            const rawText = userInput.value.trim();
            if (rawText === '') {
                replyBox.innerHTML = '📝 请写下您的疑问……';
                return;
            }

            const lowerText = rawText.toLowerCase();
            let matchedKey = null;
            let normalReply = null;

            // 1. 先尝试匹配普通问答
            for (const [key, value] of Object.entries(responses)) {
                if (lowerText.includes(key.toLowerCase())) {
                    matchedKey = key;
                    normalReply = value;
                    break;
                }
            }

            // 如果没有匹配任何关键词，直接返回默认回复（不触发彩蛋）
            if (!matchedKey) {
                replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${defaultReply}`;
                userInput.value = '';
                userInput.focus();
                return;
            }

            // 2. 彩蛋阶段检测（仅当匹配的关键词在彩蛋系统中有配置）
            const matchedKeyLower = matchedKey.toLowerCase();
            let eggReply = null;
            let triggeredThisTime = false;

            if (easterEggStages.hasOwnProperty(matchedKeyLower)) {
                const egg = easterEggStages[matchedKeyLower];
                // 计数+1
                egg.count += 1;

                // 按 at 值排序阶段（从小到大）
                const sortedStages = [...egg.stages].sort((a, b) => a.at - b.at);

                // 遍历所有阶段，检查是否有未触发且计数达到 at 值的阶段
                for (const stage of sortedStages) {
                    if (egg.count >= stage.at && !egg.triggered.has(stage.at)) {
                        // 触发彩蛋
                        eggReply = stage.reply;
                        egg.triggered.add(stage.at); // 标记为已触发
                        triggeredThisTime = true;
                        break; // 一次输入只触发一个彩蛋（按最低未触发的阶段）
                    }
                }
            }

            // 3. 输出回复
            // 优先显示彩蛋回复，其次显示普通回复
            let finalReply = null;
            if (triggeredThisTime && eggReply) {
                finalReply = eggReply;
            } else if (normalReply) {
                finalReply = normalReply;
            } else {
                finalReply = defaultReply;
            }

            replyBox.innerHTML = `您的提问是：${rawText}\n\n我的回答是：${finalReply}`;

            userInput.value = '';
            userInput.focus();
        }

        // ---------- 事件绑定 ----------
        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleUserInput();
            }
        });

        // ---------- 音乐控制 ----------
        let isMusicPlaying = false;

        window.addEventListener('load', () => {
            setTimeout(() => {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    musicToggle.innerHTML = '<span class="icon">🔇</span> 关闭音乐';
                }).catch(() => {});
            }, 300);
        });

        function tryAutoPlay() {
            if (isMusicPlaying) return;
            bgm.play().then(() => {
                isMusicPlaying = true;
                musicToggle.innerHTML = '<span class="icon">🔇</span> 关闭音乐';
            }).catch(() => {});
            document.removeEventListener('click', tryAutoPlay);
            document.removeEventListener('touchstart', tryAutoPlay);
        }
        document.addEventListener('click', tryAutoPlay, { once: true });
        document.addEventListener('touchstart', tryAutoPlay, { once: true });

        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();

            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
                musicToggle.innerHTML = '<span class="icon">🔊</span> 开启音乐';
            } else {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    musicToggle.innerHTML = '<span class="icon">🔇</span> 关闭音乐';
                }).catch((err) => {
                    alert('音乐播放失败，请检查 bgm/O.mp3 是否存在。');
                    console.warn('播放错误:', err);
                });
            }
        });

        window.addEventListener('beforeunload', () => {
            bgm.pause();
        });

        console.log('❓ 粗糙解谜页已加载。连续彩蛋阶段系统已就绪！');
    </script>
</body>
</html>
